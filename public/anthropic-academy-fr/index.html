u m'aider ? »</li>\n</ul>\n</li>\n<li>Explorez ensemble les questions suivantes :<ul>\n<li>Quelle est la vision d'ensemble de la tâche ? À quoi ressemble un bon résultat ?</li>\n<li>Quels différents types de travail sont nécessaires pour atteindre cet objectif ?</li>\n<li>Lesquelles de ces tâches nécessitent une expertise, une créativité ou un jugement humains ?</li>\n<li><strong>Remarque</strong> : en discutant de ces questions, ayez une véritable conversation ! Ne vous contentez pas d'énoncer ou de lister des réponses. Faites de véritables allers-retours — chacun de vous peut voir des choses que l'autre ne voit pas !</li>\n</ul>\n</li>\n<li>Ensemble, créez un plan de délégation simple qui tire parti des forces à la fois de vous-même et de l'IA.</li>\n</ol>", "id": "c2-5-0-1"}, {"level": 4, "title": "Réflexion", "children": [], "html": "<p>Avant de continuer, prenez un moment pour réfléchir :</p>\n<ul>\n<li>Repensez à un projet récent où vous avez collaboré avec l'IA. Si vous aviez disposé de ce cadre de Délégation à l'époque, en quoi votre approche aurait-elle pu être différente ?</li>\n<li>Quels types de tâches, dans votre travail ou vos études, vous semblent le plus susceptibles de bénéficier d'une collaboration avec l'IA ?</li>\n</ul>", "id": "c2-5-0-2"}, {"level": 4, "title": "Prochaines étapes", "children": [], "html": "<p>Dans la prochaine leçon, vous appliquerez ce que vous avez appris sur la Délégation à un projet en plusieurs étapes qui se poursuivra tout au long du reste du cours. Vous choisirez un projet qui vous intéresse, en clarifierez la vision, le décomposerez en tâches, et créerez un plan de délégation qui répartit stratégiquement le travail entre vous et l'IA (tout comme vous l'avez pratiqué dans cette leçon). Ce projet deviendra le support pratique sur lequel vous appliquerez l'ensemble des compétences de l'AI Fluency au fil du cours.</p>", "id": "c2-5-0-3"}, {"level": 4, "title": "Retours", "children": [], "html": "<p>Au fil de votre progression dans ce cours, nous aimerions beaucoup connaître votre avis sur la façon dont vous utilisez les concepts du cours dans votre vie, votre travail ou en classe, ainsi que tout autre retour que vous souhaiteriez partager. Partagez votre avis ici.</p>", "id": "c2-5-0-4"}, {"level": 4, "title": "Remerciements et licence", "children": [], "html": "<p>Copyright 2025 Rick Dakan, Joseph Feller et Anthropic. Publié sous licence CC BY-NC-SA 4.0. Ce cours s'appuie sur le cadre AI Fluency de Dakan et Feller. Soutien partiel fourni par la Higher Education Authority of Ireland, via le National Forum for the Enhancement of Teaching and Learning.</p>\n<hr />", "id": "c2-5-0-5"}], "html": "<p>(6 minutes)</p>\n<p>Cette vidéo explore la première compétence fondamentale de l'AI Fluency : la Délégation. Nous expliquons que la Délégation consiste à décider quel travail réaliser soi-même, quel travail effectuer en collaboration avec l'IA, et comment répartir efficacement les tâches. Nous présentons les trois composantes clés de la Délégation :</p>\n<ul>\n<li><strong>Conscience du problème</strong> : comprendre votre objectif et le travail qu'implique son atteinte avant de commencer</li>\n<li><strong>Conscience de la plateforme</strong> : connaître les capacités des différents systèmes d'IA</li>\n<li><strong>Délégation des tâches</strong> : répartir stratégiquement le travail entre vous et l'IA</li>\n</ul>\n<p>Nous expliquons également pourquoi une Délégation efficace exige à la fois une expertise dans votre domaine et une compréhension des capacités de l'IA — et pourquoi cela est essentiel pour travailler efficacement et avec efficience avec les systèmes d'IA.</p>", "id": "c2-5-0"}], "html": "<p><strong>Ce que vous allez apprendre</strong></p>\n<p>À la fin de cette leçon, vous serez capable de :</p>\n<ul>\n<li>Comprendre la compétence de Délégation et ses trois composantes : la Conscience du problème, la Conscience de la plateforme et la Délégation des tâches</li>\n<li>Reconnaître quand et comment déléguer efficacement des tâches à l'IA</li>\n<li>Développer une conscience des tâches, des plateformes et des modes lorsque vous travaillez avec l'IA</li>\n</ul>", "id": "c2-5"}, {"level": 2, "title": "Planification de projet et Délégation", "children": [{"level": 3, "title": "Planification de projet et Délégation", "children": [{"level": 4, "title": "Réflexion", "children": [], "html": "<p>Avant de continuer, prenez un moment pour réfléchir :</p>\n<ul>\n<li>Quelles idées ont émergé de votre conversation de planification avec Claude ?</li>\n<li>Quel aspect de votre plan de délégation anticipez-vous comme étant le plus difficile ?</li>\n<li>Quelles informations ou compétences supplémentaires pourraient vous aider à déléguer plus efficacement à l'IA ?</li>\n</ul>", "id": "c2-6-0-0"}, {"level": 4, "title": "Prochaines étapes", "children": [], "html": "<p>Dans la prochaine leçon, nous explorerons la deuxième compétence fondamentale : la Description. Vous apprendrez des méthodes pour communiquer efficacement avec les systèmes d'IA, ce qui vous aidera à exécuter le plan que vous venez de créer. Cela comprend des techniques pour définir ce que vous voulez, guider l'IA sur la manière d'aborder une tâche, et préciser comment vous souhaitez que l'IA interagisse avec vous tout au long du processus.</p>", "id": "c2-6-0-1"}, {"level": 4, "title": "Retours", "children": [], "html": "<p>Au fil de votre progression dans ce cours, nous aimerions beaucoup connaître votre avis sur la façon dont vous utilisez les concepts du cours dans votre vie, votre travail ou en classe, ainsi que tout autre retour que vous souhaiteriez partager. Partagez votre avis ici.</p>", "id": "c2-6-0-2"}, {"level": 4, "title": "Remerciements et licence", "children": [], "html": "<p>Copyright 2025 Rick Dakan, Joseph Feller et Anthropic. Publié sous licence CC BY-NC-SA 4.0. Ce cours s'appuie sur le cadre AI Fluency de Dakan et Feller. Soutien partiel fourni par la Higher Education Authority of Ireland, via le National Forum for the Enhancement of Teaching and Learning.</p>\n<hr />", "id": "c2-6-0-3"}], "html": "<p>Durée estimée : 20 minutes</p>\n<p><strong>Étape 1 : choisissez votre projet</strong></p>\n<p>Choisissez un projet de taille moyenne, en plusieurs étapes, sur lequel vous pourrez travailler tout au long du reste du cours. Votre projet devrait présenter les caractéristiques suivantes :</p>\n<ul>\n<li><strong>Suffisamment substantiel</strong> pour inclure plusieurs types de tâches</li>\n<li><strong>Suffisamment gérable</strong> pour être réalisé en environ 1 heure de travail</li>\n<li>Quelque chose qui vous <strong>intéresse réellement</strong> de créer ou de mener à bien</li>\n</ul>\n<p>Voici quelques suggestions à titre indicatif :</p>\n<p><strong>Projets de communication :</strong></p>\n<ul>\n<li>Créer une présentation engageante sur un sujet que vous connaissez bien</li>\n<li>Écrire un article ou une série d'articles expliquant un sujet complexe à un public généraliste</li>\n<li>Élaborer une proposition ou un pitch pour une idée que vous souhaitez porter</li>\n<li>Créer une biographie personnelle ou professionnelle et les supports qui l'accompagnent</li>\n</ul>\n<p><strong>Projets de recherche :</strong></p>\n<ul>\n<li>Rechercher et résumer l'état actuel d'une technologie ou d'une tendance émergente</li>\n<li>Analyser un jeu de données pour identifier des tendances et formuler des recommandations</li>\n<li>Comparer plusieurs produits, services ou approches et formuler une recommandation</li>\n<li>Étudier un événement historique et présenter vos conclusions de façon engageante</li>\n</ul>\n<p><strong>Projets créatifs :</strong></p>\n<ul>\n<li>Développer une nouvelle avec des personnages bien construits et une intrigue</li>\n<li>Concevoir la structure simple d'un site web et préparer le contenu des pages clés</li>\n<li>Développer un concept de produit, de service ou d'expérience</li>\n</ul>\n<p><strong>Projets d'apprentissage :</strong></p>\n<ul>\n<li>Créer un plan d'apprentissage structuré pour une compétence que vous souhaitez développer</li>\n<li>Constituer un recueil de ressources autour d'un sujet que vous étudiez</li>\n<li>Créer un tutoriel ou un guide pour un processus que vous connaissez bien</li>\n<li>Créer un ensemble de supports d'étude pour un sujet que vous souhaitez maîtriser</li>\n</ul>\n<p><strong>Étape 2 : vision et objectifs du projet</strong></p>\n<p>Démarrez une conversation avec Claude. Partagez l'idée de votre projet, et invitez Claude à vous poser des questions jusqu'à ce que vous ayez une vision claire du résultat final. Travaillez ensemble jusqu'à avoir une image nette de :</p>\n<ul>\n<li>À quoi ressemble la réussite pour votre projet</li>\n<li>Ce qui rend ce projet particulièrement précieux ou significatif pour vous</li>\n</ul>\n<p><strong>Étape 3 : décomposition des tâches et analyse de la Délégation</strong></p>\n<p>De la même manière que dans la leçon précédente, explorez votre projet avec Claude à travers le prisme de la Délégation :</p>\n<ul>\n<li>Identifiez ensemble les principales tâches nécessaires pour mener à bien le projet.</li>\n<li>Pour chaque tâche, discutez une par une :<ul>\n<li>Quelles compétences, connaissances ou capacités d'IA précises sont nécessaires ?</li>\n<li>Quelles parties bénéficieraient de forces proprement humaines ?</li>\n<li>Quelles parties pourraient bien exploiter les capacités de l'IA ?</li>\n<li>Où la collaboration pourrait-elle produire le plus grand impact ?</li>\n</ul>\n</li>\n<li><strong>Remarque</strong> : là encore, ayez une véritable conversation sur ces questions, pas un simple échange d'affirmations. Remettez en question vos hypothèses, demandez des clarifications, et restez ouvert aux idées inattendues qui émergent de la discussion.</li>\n<li>Créez un plan de projet qui inclut vos principales tâches et vos décisions de délégation.</li>\n<li><strong>Enregistrez votre plan de projet</strong> — vous reviendrez à ce projet plus tard dans le cours pour mettre en pratique vos compétences de Description, de Discernement et de Diligence.</li>\n</ul>", "id": "c2-6-0"}], "html": "<p><strong>Ce que vous allez apprendre</strong></p>\n<p>À la fin de cette leçon, vous serez capable de :</p>\n<ul>\n<li>Appliquer votre compréhension de la Délégation à un véritable projet en plusieurs étapes qui se poursuit tout au long du reste du cours</li>\n</ul>", "id": "c2-6"}, {"level": 2, "title": "Un regard approfondi sur la Description", "children": [{"level": 3, "title": "Un regard approfondi sur la Description", "children": [{"level": 4, "title": "Points clés à retenir", "children": [], "html": "<ul>\n<li>La Description signifie communiquer avec l'IA de manière à créer un environnement de collaboration efficace</li>\n<li>La Description du produit consiste à définir clairement vos exigences concernant le résultat, le format, le public et le style</li>\n<li>La Description du processus oriente la manière dont l'IA aborde votre demande, ce qui est tout aussi important que de préciser l'objectif final</li>\n<li>La Description du comportement définit des aspects comportementaux, comme le fait que l'IA doive être concise ou détaillée, stimulante ou bienveillante</li>\n<li>Les systèmes d'IA sont des partenaires interactifs, pas des bases de données ni des distributeurs automatiques</li>\n<li>Une communication claire en amont fait gagner du temps et conduit à de meilleurs résultats</li>\n</ul>", "id": "c2-7-0-0"}, {"level": 4, "title": "Exercice", "children": [], "html": "<p><strong>Améliorer un mauvais prompt</strong></p>\n<p>Durée estimée : 10 minutes</p>\n<p><strong>Consignes :</strong></p>\n<ol>\n<li>Demandez à Claude de vous mettre au défi avec des prompts mal rédigés que vous devrez améliorer.</li>\n<li>Appliquez votre réflexion en matière de Description pour améliorer chaque prompt, en tenant compte :<ul>\n<li>D'une <strong>Description du produit</strong> claire (ce que vous voulez précisément)</li>\n<li>De consignes de <strong>Processus</strong> (comment vous souhaitez que Claude aborde la tâche)</li>\n<li>De précisions sur le <strong>Comportement</strong> (comment vous souhaitez que Claude se comporte pendant la collaboration)</li>\n</ul>\n</li>\n<li>Discutez avec Claude des versions « avant » et « après », et demandez-lui un retour sur la façon dont vos descriptions améliorées l'aident à fournir de meilleures réponses.</li>\n<li>Après environ 5 minutes, inversez les rôles : c'est vous qui fournissez les mauvais prompts que Claude devra corriger. Observez quelles informations Claude tend à ajouter et comment il organise ces informations.</li>\n</ol>", "id": "c2-7-0-1"}, {"level": 4, "title": "Réflexion", "children": [], "html": "<p>Avant de continuer, prenez un moment pour réfléchir :</p>\n<ul>\n<li>Quelle composante de la Description (produit, processus ou comportement) pensez-vous négliger le plus dans vos interactions actuelles avec l'IA ?</li>\n<li>Repensez à une interaction récente avec l'IA qui n'a pas répondu à vos attentes. En quoi de meilleures techniques de description auraient-elles pu améliorer le résultat ?</li>\n</ul>", "id": "c2-7-0-2"}, {"level": 4, "title": "Prochaines étapes", "children": [], "html": "<p>Dans la prochaine leçon, nous examinerons de plus près la première des compétences 4D : la Délégation. Vous apprendrez à prendre des décisions stratégiques pour répartir le travail entre vous et l'IA, en vous appuyant sur votre compréhension de vos objectifs et des capacités de l'IA. Cette base vous aidera à décider de façon réfléchie quand et comment intégrer l'IA dans vos processus créatifs et de résolution de problèmes.</p>", "id": "c2-7-0-3"}, {"level": 4, "title": "Retours", "children": [], "html": "<p>Au fil de votre progression dans ce cours, nous aimerions beaucoup connaître votre avis sur la façon dont vous utilisez les concepts du cours dans votre vie, votre travail ou en classe, ainsi que tout autre retour que vous souhaiteriez partager. Partagez votre avis ici.</p>", "id": "c2-7-0-4"}, {"level": 4, "title": "Remerciements et licence", "children": [], "html": "<p>Copyright 2025 Rick Dakan, Joseph Feller et Anthropic. Publié sous licence CC BY-NC-SA 4.0. Ce cours s'appuie sur le cadre AI Fluency de Dakan et Feller. Soutien partiel fourni par la Higher Education Authority of Ireland, via le National Forum for the Enhancement of Teaching and Learning.</p>\n<hr />", "id": "c2-7-0-5"}], "html": "<p>(4 minutes)</p>\n<p>Cette vidéo explore la compétence de Description de l'AI Fluency — l'art de communiquer efficacement avec les systèmes d'IA. Nous expliquons que la Description va bien au-delà de la simple rédaction de prompts ; elle consiste à créer un environnement collaboratif où vous et l'IA pouvez travailler ensemble efficacement. Nous présentons les trois composantes clés de la Description :</p>\n<ul>\n<li><strong>Description du produit</strong> : définir clairement ce que vous voulez que l'IA crée</li>\n<li><strong>Description du processus</strong> : orienter la manière dont l'IA aborde votre demande</li>\n<li><strong>Description du comportement</strong> : définir comment vous souhaitez que l'IA se comporte pendant la collaboration.</li>\n</ul>\n<p>Nous soulignons également que l'IA ne peut pas lire dans vos pensées, et que la qualité de vos résultats dépend souvent de la clarté avec laquelle vous exprimez vos besoins, l'approche que vous privilégiez, et le style d'interaction souhaité.</p>", "id": "c2-7-0"}], "html": "<p><strong>Ce que vous allez apprendre</strong></p>\n<p>À la fin de cette leçon, vous serez capable de :</p>\n<ul>\n<li>Comprendre comment communiquer efficacement votre intention aux systèmes d'IA</li>\n<li>Reconnaître l'importance d'une communication claire et intentionnelle</li>\n<li>Développer des compétences dans les trois types de Description : Produit, Processus et Comportement</li>\n</ul>", "id": "c2-7"}, {"level": 2, "title": "Techniques de prompting efficaces", "children": [{"level": 3, "title": "Techniques de prompting efficaces", "children": [{"level": 4, "title": "Points clés à retenir", "children": [], "html": "<ul>\n<li>Un prompting efficace combine des principes clairs de communication avec des techniques propres à l'IA</li>\n<li>Six techniques de prompting fondamentales :<ol>\n<li><strong>Fournir du contexte</strong> : soyez précis sur ce que vous voulez, pourquoi vous le voulez, et les informations de contexte pertinentes</li>\n<li><strong>Montrer des exemples</strong> : illustrez le style ou le format de résultat que vous souhaitez</li>\n<li><strong>Préciser des contraintes</strong> : définissez clairement le format, la longueur et les autres exigences relatives au résultat</li>\n<li><strong>Décomposer les tâches complexes en étapes</strong> : guidez l'IA à travers un raisonnement en plusieurs étapes</li>\n<li><strong>Demander à l'IA de réfléchir d'abord</strong> : laissez à l'IA la place nécessaire pour dérouler son raisonnement</li>\n<li><strong>Définir le rôle ou le ton de l'IA</strong> : précisez la manière dont vous souhaitez que l'IA communique</li>\n</ol>\n</li>\n<li>L'« arme secrète » : demandez à l'IA elle-même de vous aider à améliorer votre prompt</li>\n<li>Un prompting réussi est itératif (et peut nécessiter une collaboration avec l'IA !). Attendez-vous à affiner continuellement votre approche en fonction des résultats obtenus</li>\n<li>Les schémas récurrents de réussite incluent la présentation claire de la tâche, des précisions de format, des contraintes explicites, et des informations de contexte pertinentes</li>\n</ul>", "id": "c2-8-0-0"}, {"level": 4, "title": "Exercice", "children": [], "html": "<p><strong>Réflexion</strong></p>\n<p>Avant de continuer, prenez un moment pour réfléchir :</p>\n<ul>\n<li>Parmi les six techniques de prompting, laquelle pensez-vous améliorerait le plus vos interactions actuelles avec l'IA ?</li>\n<li>Repensez à une interaction récente avec l'IA qui n'a pas répondu à vos besoins. Quelles techniques auraient pu améliorer le résultat ?</li>\n<li>En quoi ces techniques de prompting se rattachent-elles à la compétence de Description du cadre AI Fluency ?</li>\n</ul>\n<p>Si vous le souhaitez, vous pouvez revenir à l'exercice « Améliorer un mauvais prompt » de la leçon précédente pour mettre en pratique ces principes de prompting.</p>", "id": "c2-8-0-1"}, {"level": 4, "title": "Prochaines étapes", "children": [], "html": "<p>Dans la prochaine leçon, nous explorerons la troisième compétence fondamentale de l'AI Fluency : le Discernement. Cet approfondissement et la leçon précédente portent tous deux sur la manière de communiquer efficacement avec l'IA et de pratiquer une bonne Description. Le Discernement aborde un défi tout aussi important : évaluer de façon réfléchie les résultats que produit l'IA — l'autre moitié de la conversation !</p>", "id": "c2-8-0-2"}, {"level": 4, "title": "Retours", "children": [], "html": "<p>Au fil de votre progression dans ce cours, nous aimerions beaucoup connaître votre avis sur la façon dont vous utilisez les concepts du cours dans votre vie, votre travail ou en classe, ainsi que tout autre retour que vous souhaiteriez partager. Partagez votre avis ici.</p>", "id": "c2-8-0-3"}, {"level": 4, "title": "Remerciements et licence", "children": [], "html": "<p>Copyright 2025 Rick Dakan, Joseph Feller et Anthropic. Publié sous licence CC BY-NC-SA 4.0. Ce cours s'appuie sur le cadre AI Fluency de Dakan et Feller. Soutien partiel fourni par la Higher Education Authority of Ireland, via le National Forum for the Enhancement of Teaching and Learning.</p>\n<hr />", "id": "c2-8-0-4"}], "html": "<p>Cette vidéo explore des techniques concrètes pour élaborer des prompts efficaces lorsque vous travaillez avec des assistants IA comme Claude. Nous expliquons que le prompt engineering est simplement la pratique consistant à concevoir des instructions efficaces pour les systèmes d'IA, en combinant des principes de communication humaine familiers avec des considérations propres à l'IA. Nous présentons six techniques fondamentales : fournir du contexte, montrer des exemples du résultat souhaité, préciser des contraintes, décomposer les tâches complexes en étapes, demander à l'IA de réfléchir d'abord, et définir le rôle ou le ton de l'IA. Nous partageons également des stratégies de dépannage pour les cas où les réponses ne sont pas tout à fait satisfaisantes, et mettons en lumière les schémas récurrents qui conduisent à des interactions réussies.</p>", "id": "c2-8-0"}], "html": "<p><strong>Ce que vous allez apprendre</strong></p>\n<p>À la fin de cette leçon, vous serez capable de :</p>\n<ul>\n<li>Comprendre ce qu'est le prompt engineering et son importance pour une collaboration efficace avec l'IA</li>\n<li>Appliquer six techniques de prompting fondamentales pour améliorer vos interactions avec l'IA</li>\n<li>Identifier les schémas récurrents qui conduisent à des interactions réussies avec l'IA</li>\n<li>Diagnostiquer et affiner vos prompts lorsque les réponses de l'IA ne correspondent pas à vos besoins</li>\n</ul>", "id": "c2-8"}, {"level": 2, "title": "Un regard approfondi sur le Discernement", "children": [{"level": 3, "title": "Un regard approfondi sur le Discernement", "children": [{"level": 4, "title": "Points clés à retenir", "children": [], "html": "<ul>\n<li>Le Discernement est votre capacité à évaluer soigneusement ce que produit l'IA, comment elle le produit, et comment elle se comporte</li>\n<li>Le Discernement du produit se concentre sur l'évaluation de la qualité du résultat lui-même (exactitude, pertinence, cohérence, adéquation)</li>\n<li>Le Discernement du processus consiste à évaluer la manière dont l'IA est arrivée à son résultat, en repérant les erreurs logiques, les lacunes d'attention ou un raisonnement inapproprié</li>\n<li>Le Discernement du comportement évalue le comportement de l'IA pendant la collaboration, en examinant si son style de communication est efficace pour vos besoins</li>\n<li>Le Discernement et la Description fonctionnent de concert dans une boucle de rétroaction continue</li>\n<li>Même les systèmes d'IA les plus avancés bénéficient du jugement et de la supervision humaine</li>\n</ul>", "id": "c2-9-0-0"}, {"level": 4, "title": "Exercice", "children": [], "html": "<p><strong>Discernement d'expert : évaluer les réponses de l'IA dans votre domaine</strong></p>\n<p><strong>Objectif de l'activité</strong></p>\n<p>En évaluant du contenu généré par l'IA dans un domaine où vous avez de l'expertise, mettez en pratique le Discernement de produit, de processus et de comportement, et prenez conscience de la manière dont vos connaissances renforcent votre capacité à évaluer de façon critique les résultats de l'IA.</p>\n<p><strong>Consignes</strong></p>\n<p><strong>Étape 1 : revenez à votre domaine d'expertise</strong></p>\n<p>Repensez au sujet dont vous avez discuté avec Claude dans un exercice précédent (Leçon 2, Exercice 2 : « Explorez un sujet que vous aimez »). Il s'agissait d'un sujet sur lequel vous possédez une connaissance approfondie et une véritable passion.</p>\n<p><strong>Étape 2 : demandez plusieurs explications</strong></p>\n<p>Démarrez une nouvelle conversation avec Claude et demandez-lui de générer trois explications ou analyses différentes d'un aspect particulier de votre domaine d'expertise. Par exemple :</p>\n<ul>\n<li>Si votre sujet est la photographie, vous pourriez demander trois explications différentes de la profondeur de champ</li>\n<li>Si votre sujet est la cuisine, vous pourriez demander trois analyses différentes des techniques de fermentation</li>\n<li>Si votre sujet est l'histoire, vous pourriez demander trois perspectives différentes sur un événement historique particulier</li>\n</ul>\n<p><strong>Étape 3 : appliquez votre Discernement d'expert</strong></p>\n<p>En vous appuyant sur votre expertise, évaluez soigneusement chacune des explications fournies par Claude :</p>\n<p><strong>Discernement du produit :</strong></p>\n<ul>\n<li>Quelle explication contient les informations les plus exactes ?</li>\n<li>Y a-t-il des erreurs factuelles ou des incompréhensions ?</li>\n<li>Pour quelqu'un qui découvre le sujet, le niveau de détail est-il approprié ?</li>\n</ul>\n<p><strong>Discernement du processus :</strong></p>\n<ul>\n<li>Claude a-t-il suivi un raisonnement logique dans chaque explication ?</li>\n<li>Y a-t-il des lacunes dans son analyse ou son cheminement de pensée ?</li>\n<li>Claude a-t-il établi des liens appropriés entre les concepts ?</li>\n</ul>\n<p><strong>Discernement du comportement :</strong></p>\n<ul>\n<li>Claude a-t-il tenu compte de vos questions précises et répondu à vos retours et consignes ?</li>\n<li>L'usage de la terminologie est-il adapté au sujet ?</li>\n<li>Comment le ton et le style influencent-ils la clarté de l'explication ?</li>\n</ul>\n<p><strong>Étape 4 : donnez un retour et affinez</strong></p>\n<p>Sur la base de votre évaluation :</p>\n<ul>\n<li>Identifiez l'explication la plus solide et expliquez précisément à Claude pourquoi elle fonctionnait bien</li>\n<li>Identifiez l'explication la plus faible et donnez un retour précis sur ce qui n'allait pas</li>\n<li>Travaillez avec Claude pour créer une version améliorée qui corrige les problèmes que vous avez identifiés</li>\n</ul>\n<p><strong>Étape 5 : réfléchissez</strong></p>\n<p>Discutez avec Claude (dans le même chat) :</p>\n<ul>\n<li>Quelles connaissances précises possédiez-vous qui vous ont permis d'identifier les forces ou les faiblesses ?</li>\n<li>Quelles difficultés quelqu'un sans votre expertise pourrait-il rencontrer pour juger de la qualité de ces explications ?</li>\n<li>Que vous apprend cette expérience sur la relation entre l'expertise d'un domaine et un Discernement efficace ?</li>\n</ul>\n<p>Pour un exercice de Discernement plus ludique, vous pourriez essayer certaines des suggestions « soirée jeux » de la dernière leçon (« Activités bonus »).</p>", "id": "c2-9-0-1"}, {"level": 4, "title": "Réflexion", "children": [], "html": "<p>Avant de continuer, prenez un moment pour considérer :</p>\n<ul>\n<li>Quel type de Discernement (produit, processus ou comportement) avez-vous trouvé le plus difficile à appliquer, et pourquoi ?</li>\n<li>Comment le Discernement complète-t-il la Description ? Comment fonctionnent-ils ensemble ?</li>\n<li>Quels signaux ou schémas pourraient indiquer qu'un résultat de l'IA nécessite un examen plus approfondi ?</li>\n</ul>", "id": "c2-9-0-2"}, {"level": 4, "title": "Prochaines étapes", "children": [], "html": "<p>Dans la prochaine leçon, vous aurez l'occasion d'appliquer les compétences de Description et de Discernement à l'ensemble de votre projet de cours. Vous mettrez en pratique ce que vous avez appris sur la manière de communiquer efficacement avec l'IA et d'évaluer ses résultats de façon critique, afin de produire des résultats qui exploitent pleinement les capacités à la fois humaines et de l'IA.</p>", "id": "c2-9-0-3"}, {"level": 4, "title": "Retours", "children": [], "html": "<p>Au fil de votre progression dans ce cours, nous aimerions beaucoup connaître votre avis sur la façon dont vous utilisez les concepts du cours dans votre vie, votre travail ou en classe, ainsi que tout autre retour que vous pourriez avoir. Partagez votre avis ici.</p>", "id": "c2-9-0-4"}, {"level": 4, "title": "Remerciements et licence", "children": [], "html": "<p>Copyright 2025 Rick Dakan, Joseph Feller et Anthropic. Publié sous licence CC BY-NC-SA 4.0.</p>\n<p>Ce cours s'appuie sur le cadre AI Fluency de Dakan et Feller. Un soutien partiel a été fourni par la Higher Education Authority of Ireland via le National Forum for the Enhancement of Teaching and Learning.</p>\n<hr />", "id": "c2-9-0-5"}], "html": "<p>(5 minutes)</p>\n<p>Cette vidéo explore le Discernement, la compétence de l'AI Fluency centrée sur l'évaluation réfléchie des résultats, du processus et du comportement de l'IA. Nous expliquons que le Discernement est l'envers de la Description. La Description vous aide à exprimer clairement votre intention, tandis que le Discernement vous aide à évaluer si ce que vous recevez répond à vos besoins. La vidéo présente trois types de Discernement :</p>\n<ul>\n<li><strong>Discernement du produit</strong> : évaluer la qualité du résultat produit par l'IA</li>\n<li><strong>Discernement du processus</strong> : évaluer l'approche adoptée par l'IA pour réaliser la tâche</li>\n<li><strong>Discernement du comportement</strong> : évaluer le comportement de l'IA pendant l'interaction</li>\n</ul>\n<p>Ensemble, ces compétences aident à garantir que votre collaboration avec l'IA reste toujours guidée par un jugement humain réfléchi.</p>", "id": "c2-9-0"}], "html": "<p><strong>Ce que vous allez apprendre</strong></p>\n<p>À la fin de cette leçon, vous serez capable de :</p>\n<ul>\n<li>Comprendre comment évaluer de façon réfléchie les résultats et le processus de l'IA</li>\n<li>Développer des compétences d'esprit critique pour vos interactions avec l'IA</li>\n<li>Apprendre à identifier et à traiter les problèmes de qualité dans vos interactions avec l'IA</li>\n</ul>", "id": "c2-9"}, {"level": 2, "title": "La boucle Description-Discernement", "children": [{"level": 3, "title": "Exercice", "children": [{"level": 4, "title": "Réflexion", "children": [], "html": "<p>Avant de continuer, prenez un moment pour réfléchir :</p>\n<ul>\n<li>Quelles régularités avez-vous observées quant aux types de descriptions ayant produit les meilleurs résultats ?</li>\n<li>Lequel des deux vous a demandé le plus d'effort : la Description ou le Discernement ? Pourquoi, selon vous ?</li>\n<li>En quoi l'exécution réelle de votre projet a-t-elle différé de votre plan initial de la Leçon 5 ? Quels ajustements avez-vous apportés en cours de route ?</li>\n</ul>", "id": "c2-10-0-0"}, {"level": 4, "title": "Prochaines étapes", "children": [], "html": "<p>Dans la prochaine leçon, nous explorerons la dernière compétence du cadre AI Fluency : la Diligence. Alors que la Délégation, la Description et le Discernement se concentrent principalement sur l'efficacité et l'efficience, la Diligence concerne les dimensions éthiques et de sécurité du travail avec l'IA. Vous apprendrez comment veiller à ce que votre collaboration avec l'IA soit responsable, transparente et redevable.</p>", "id": "c2-10-0-1"}, {"level": 4, "title": "Retours sur ce cours", "children": [], "html": "<p>Pendant que vous suivez ce cours, nous serions ravis de connaître votre avis sur la manière dont vous utilisez les concepts du cours dans votre vie, votre travail ou votre classe, ainsi que tout retour que vous pourriez avoir.</p>\n<p>Partagez votre avis ici.</p>", "id": "c2-10-0-2"}, {"level": 4, "title": "Remerciements et licence", "children": [], "html": "<p>Copyright 2025 Rick Dakan, Joseph Feller et Anthropic. Publié sous licence CC BY-NC-SA 4.0. Ce cours s'appuie sur le cadre AI Fluency de Dakan et Feller. Un soutien partiel a été apporté par la Higher Education Authority of Ireland, via le National Forum for the Enhancement of Teaching and Learning.</p>\n<hr />", "id": "c2-10-0-3"}], "html": "<p><strong>Exercice : Réaliser un projet à l'aide de la boucle Description-Discernement</strong></p>\n<p>Le moment est venu de mettre en pratique tout ce que vous avez appris, en utilisant les compétences de Description et de Discernement que vous avez développées, pour mener à bien le projet que vous avez planifié à la Leçon 5.</p>\n<p><strong>Étape 1 : Revoir votre plan de projet</strong><br />\n- Retrouvez le plan de projet que vous avez créé à la Leçon 5<br />\n- Passez rapidement en revue vos décisions de délégation concernant les tâches qui bénéficieraient de l'expertise humaine, des capacités de l'IA, ou d'une collaboration<br />\n- N'hésitez pas à affiner votre plan en fonction de ce que vous avez appris depuis</p>\n<p><strong>Étape 2 : Préparer votre approche de Description</strong></p>\n<p>Entamez une conversation avec Claude et expliquez le projet sur lequel vous allez travailler ensemble. Avant de commencer l'exécution, planifiez la manière dont vous utiliserez la Description :</p>\n<ul>\n<li><strong>Description du Produit</strong> : Quels résultats précis attendez-vous de Claude pour chaque tâche ? Quel format, style, longueur et niveau de détail attendez-vous ?</li>\n<li><strong>Description du Processus</strong> : Comment Claude devrait-il aborder chaque tâche ? Quelles méthodes, cadres ou étapes particulières souhaitez-vous qu'il suive ?</li>\n<li><strong>Description de la Performance</strong> : Quel type de comportement collaboratif souhaitez-vous que Claude adopte dans ce projet ? Doit-il être concis ou détaillé, stimulant ou bienveillant, orienté idées ou analytique ?</li>\n</ul>\n<p>Discutez de ces questions avec Claude pour établir des attentes claires concernant votre collaboration.</p>\n<p><strong>Étape 3 : Exécuter votre projet à l'aide de la boucle Description-Discernement</strong></p>\n<p>Travaillez maintenant sur les tâches de votre projet planifié avec Claude. Pour chaque tâche :</p>\n<ol>\n<li><strong>Décrivez clairement vos besoins</strong>, en utilisant les compétences de Description que vous avez apprises :<ul>\n<li>Soyez précis sur ce que vous voulez (<strong>Produit</strong>)</li>\n<li>Orientez la manière dont Claude devrait aborder ou penser la tâche (<strong>Processus</strong>)</li>\n<li>Précisez la manière dont vous souhaitez que Claude interagisse avec vous pendant le processus (<strong>Performance</strong>)</li>\n</ul>\n</li>\n<li><strong>Discernez la qualité de ce que vous recevez</strong> :<ul>\n<li>Évaluez le résultat lui-même (<strong>Discernement du Produit</strong>)</li>\n<li>Évaluez la façon dont Claude a accompli la tâche (<strong>Discernement du Processus</strong>)</li>\n<li>Considérez si le comportement de Claude a été le plus utile possible pour vos besoins (<strong>Discernement de la Performance</strong>)</li>\n</ul>\n</li>\n<li><strong>Affinez en fonction de votre discernement</strong> :<ul>\n<li>Donnez un retour sur ce qui a fonctionné et ce qui n'a pas fonctionné</li>\n<li>Clarifiez ou ajustez votre description si nécessaire</li>\n<li>Demandez des itérations jusqu'à ce que vous soyez satisfait du résultat</li>\n</ul>\n</li>\n<li><strong>Intégrez votre propre expertise et jugement</strong> :<ul>\n<li>Ajoutez votre perspective, votre créativité ou vos connaissances propres au domaine</li>\n<li>Prenez les décisions finales sur ce qu'il faut garder, modifier ou écarter</li>\n<li>Assumez la responsabilité du résultat final</li>\n</ul>\n</li>\n</ol>\n<p>Poursuivez cette boucle Description-Discernement pour chaque tâche de votre projet jusqu'à ce qu'il soit terminé.</p>", "id": "c2-10-0"}], "html": "<p>Durée estimée : 30-60 minutes</p>\n<p>À la fin de cette leçon, vous serez capable de :</p>\n<ul>\n<li>Appliquer les compétences de Description et de Discernement à un véritable projet</li>\n<li>Mener une boucle de rétroaction Description-Discernement productive</li>\n<li>Créer, par la collaboration humain-IA, des résultats qui dépassent ce que chacun aurait pu accomplir seul</li>\n</ul>", "id": "c2-10"}, {"level": 2, "title": "Un regard approfondi sur la Diligence", "children": [{"level": 3, "title": "Vidéo : Un regard approfondi sur la Diligence", "children": [{"level": 4, "title": "Points clés à retenir", "children": [], "html": "<ul>\n<li>La Diligence signifie assumer la responsabilité de notre collaboration avec l'IA</li>\n<li>La Diligence de Création consiste à choisir avec discernement les systèmes d'IA que nous utilisons et la manière dont nous interagissons avec eux</li>\n<li>La Diligence de Transparence signifie être honnête sur le rôle de l'IA dans notre travail auprès de tous ceux qui doivent le savoir</li>\n<li>La Diligence de Déploiement exige que nous assumions la responsabilité de vérifier et de garantir les résultats que nous utilisons ou partageons</li>\n<li>Les contextes différents (personnel, académique, professionnel) peuvent avoir des attentes différentes en matière de divulgation et de vérification</li>\n<li>Une Diligence réfléchie contribue à faire en sorte que notre collaboration avec l'IA soit non seulement efficace et efficiente, mais aussi éthique et sûre</li>\n</ul>", "id": "c2-11-0-0"}, {"level": 4, "title": "Exercice", "children": [], "html": "<p><strong>Exercice : Rédiger une déclaration de Diligence</strong></p>\n<p>Durée estimée : 14 minutes</p>\n<p>Dans cet exercice, vous allez rédiger une déclaration de diligence pour le projet sur lequel vous travaillez. Voici, à titre d'exemple, la déclaration de diligence de ce cours lui-même.</p>\n<p><strong>Étape 1 : Comprendre la déclaration de Diligence</strong></p>\n<p>Durée estimée : <em>3 minutes</em></p>\n<p>Une déclaration de diligence est une reconnaissance transparente du rôle de l'IA dans votre travail, accompagnée de votre engagement à assumer la responsabilité du résultat final. En voici un exemple :</p>\n<blockquote>\n<p>« Dans la réalisation de ce [document/projet/contenu], j'ai collaboré avec [nom de l'assistant IA] pour m'aider dans [tâches précises : rédaction, recherche, édition, etc.]. Je confirme que tout contenu généré ou co-créé par l'IA a été soigneusement relu et évalué. Le résultat final reflète fidèlement ma compréhension, mon expertise et mon intention. Bien que l'assistance de l'IA ait joué un rôle important dans le processus, j'assume l'entière responsabilité du contenu, de son exactitude et de sa présentation. Cette divulgation est faite dans un esprit de transparence et en reconnaissance du rôle de l'IA dans le processus de création. »</p>\n</blockquote>\n<p><strong>Étape 2 : Réfléchir à votre collaboration avec l'IA</strong></p>\n<p>Durée estimée : 5 minutes</p>\n<p>Passez en revue votre travail sur le projet du cours, et considérez :</p>\n<p><strong>Diligence de Création :</strong><br />\n- Avec quels systèmes d'IA avez-vous choisi de travailler, et pourquoi ?<br />\n- Quelles données ou informations avez-vous partagées avec l'IA ?<br />\n- Y avait-il des considérations de confidentialité, de sécurité ou d'éthique dans vos choix ?</p>\n<p><strong>Diligence de Transparence :</strong><br />\n- Qui est le public visé par le résultat de votre projet ?<br />\n- Quelles attentes pourrait-il avoir concernant la divulgation de l'usage de l'IA ?<br />\n- Dans quels aspects précis de votre travail l'IA a-t-elle contribué ?</p>\n<p><strong>Diligence de Déploiement :</strong><br />\n- Quelles mesures avez-vous prises pour vérifier l'exactitude et la pertinence des contributions de l'IA ?<br />\n- Comment vous êtes-vous assuré que le résultat final répondait à vos normes et exigences ?<br />\n- Quelle responsabilité assumez-vous pour le produit final ?</p>\n<p><strong>Étape 3 : Rédiger votre déclaration de Diligence</strong></p>\n<p>Durée estimée : 6 minutes</p>\n<p>Entamez une conversation avec Claude, puis :</p>\n<ul>\n<li>Partagez vos réflexions de l'Étape 2, et éventuellement les conversations passées que vous avez eues avec Claude à propos de ce projet</li>\n<li>Collaborez avec Claude pour rédiger une déclaration de diligence spécifique à votre projet</li>\n<li>Assurez-vous que votre déclaration couvre :<ul>\n<li>Les systèmes d'IA que vous avez utilisés</li>\n<li>La façon dont l'IA a contribué à votre projet</li>\n<li>Le processus de relecture que vous avez suivi</li>\n<li>Une déclaration affirmant que vous assumez la responsabilité du résultat final</li>\n<li>Toute considération spécifique au contexte (académique, professionnel, etc.)</li>\n</ul>\n</li>\n</ul>\n<p><strong>Étape 4 : Ajouter votre déclaration à votre projet</strong></p>\n<p>Lorsque vous terminez votre projet, ajoutez votre déclaration de diligence à un endroit approprié (par exemple, dans un pied de page, une annexe ou des métadonnées).</p>", "id": "c2-11-0-1"}, {"level": 4, "title": "Réflexion", "children": [], "html": "<p>Avant de continuer, prenez un moment pour réfléchir :</p>\n<ul>\n<li>Quel aspect de la Diligence (Création, Transparence ou Déploiement) avez-vous trouvé le plus difficile, et pourquoi ?</li>\n<li>Comment votre approche de la Diligence changerait-elle selon le contexte (personnel, académique, professionnel) ?</li>\n<li>En quoi le fait de reconnaître le rôle de l'IA dans votre travail pourrait-il influencer la perception qu'en ont les autres ?</li>\n<li>Quelles questions éthiques ont surgi dans votre projet que vous n'aviez pas anticipées ?</li>\n<li>Quelles lignes directrices personnelles pourriez-vous établir pour une collaboration responsable avec l'IA ?</li>\n</ul>", "id": "c2-11-0-2"}, {"level": 4, "title": "Prochaines étapes", "children": [], "html": "<p>Dans la dernière leçon de ce cours, nous reviendrons sur ce que nous avons appris à propos de l'AI Fluency, et sur la manière dont ces compétences fonctionnent ensemble. Nous reparcourrons l'ensemble du cadre et discuterons de la façon dont vous pouvez continuer à développer ces compétences à mesure que les capacités de l'IA évoluent. Cette conclusion vous aidera à synthétiser les connaissances et la pratique que vous avez acquises, et à les appliquer à vos futures collaborations avec l'IA.</p>", "id": "c2-11-0-3"}, {"level": 4, "title": "Retours sur ce cours", "children": [], "html": "<p>Pendant que vous suivez ce cours, nous serions ravis de connaître votre avis sur la manière dont vous utilisez les concepts du cours dans votre vie, votre travail ou votre classe, ainsi que tout retour que vous pourriez avoir. Partagez votre avis ici.</p>", "id": "c2-11-0-4"}, {"level": 4, "title": "Remerciements et licence", "children": [], "html": "<p>Copyright 2025 Rick Dakan, Joseph Feller et Anthropic. Publié sous licence CC BY-NC-SA 4.0.</p>\n<p>Ce cours s'appuie sur le cadre AI Fluency de Dakan et Feller. Un soutien partiel a été apporté par la Higher Education Authority of Ireland, via le National Forum for the Enhancement of Teaching and Learning.</p>\n<hr />", "id": "c2-11-0-5"}], "html": "<p>(7 minutes)</p>\n<p>Cette vidéo explore la Diligence, la compétence de l'AI Fluency qui porte sur une collaboration responsable et éthique avec l'IA. Nous expliquons que, si les autres compétences se concentrent principalement sur l'efficacité et l'efficience, la Diligence traite des dimensions éthiques et de sécurité, tout aussi essentielles. Nous présentons trois composantes :</p>\n<ul>\n<li><strong>Diligence de Création</strong> : Choisir avec discernement les systèmes d'IA que vous utilisez et la manière dont vous travaillez avec eux</li>\n<li><strong>Diligence de Transparence</strong> : Être honnête sur le rôle de l'IA dans votre travail</li>\n<li><strong>Diligence de Déploiement</strong> : Assumer la responsabilité des résultats assistés par l'IA que vous partagez avec d'autres</li>\n</ul>\n<p>Nous soulignons que les attentes peuvent varier selon les contextes, mais que chacun de nous est responsable de les comprendre et de les respecter.</p>", "id": "c2-11-0"}], "html": "<p>Durée estimée : 20 minutes</p>\n<p>À la fin de cette leçon, vous serez capable de :</p>\n<ul>\n<li>Comprendre les implications éthiques de la collaboration avec l'IA</li>\n<li>Comprendre l'importance de la transparence dans le travail avec l'IA</li>\n<li>Reconnaître votre responsabilité dans les interactions et les résultats issus de l'IA</li>\n</ul>", "id": "c2-11"}, {"level": 2, "title": "Conclusion", "children": [{"level": 3, "title": "Vidéo : Conclusion", "children": [{"level": 4, "title": "Points clés à retenir", "children": [], "html": "<ul>\n<li>L'AI Fluency se développe par la pratique délibérée des quatre compétences fondamentales</li>\n<li>La Délégation souligne que notre expertise et notre jugement restent le fondement d'une collaboration efficace avec l'IA</li>\n<li>La Description implique une communication claire pour faire le pont entre notre intention et les capacités de l'IA</li>\n<li>Le Discernement exige une évaluation réfléchie et critique des résultats afin de travailler dans les limites d'un système</li>\n<li>La Diligence garantit la redevabilité, la transparence et la responsabilité dans notre travail avec l'IA</li>\n<li>Les résultats les plus puissants émergent lorsque les humains et l'IA mettent en valeur leurs forces respectives et se complètent</li>\n<li>Le cadre est conçu pour rester pertinent à mesure que les systèmes d'IA continuent d'évoluer</li>\n</ul>", "id": "c2-12-0-0"}, {"level": 4, "title": "Exercice", "children": [], "html": "<p><strong>Exercice : Discuter du cours AI Fluency avec Claude</strong></p>\n<p>Ayez une conversation approfondie avec Claude sur ce cours et le cadre AI Fluency (vous pouvez charger une copie du cadre depuis https://ringling.libguides.com/ai/framework)</p>\n<p>Amorces de conversation suggérées :</p>\n<ul>\n<li>« Je viens de terminer un cours sur l'AI Fluency qui couvrait la Délégation, la Description, le Discernement et la Diligence. Discutons de la manière dont ces compétences s'appliquent à [mon programme d'études, mon travail, ou autre chose]. »</li>\n<li>« Explorons comment le cadre AI Fluency pourrait évoluer à mesure que les capacités de l'IA progressent. Quelles nouvelles compétences pourraient devenir importantes à l'avenir ? » (Si vous faites cet exercice, contactez-nous et faites-nous part de vos découvertes !)</li>\n<li>« À partir de notre conversation, aide-moi à identifier celles des 4 compétences que je semble bien maîtriser, et celles que je pourrais avoir besoin de développer davantage. »</li>\n<li>« Voici [un exercice que j'ai réalisé dans ce cours]. Analysons-le pour améliorer mes compétences. »</li>\n</ul>\n<p><strong>Exercice : Élaborer une politique personnelle en matière d'IA</strong></p>\n<p>Avec l'aide de Claude, créez vos propres lignes directrices pour une collaboration responsable et éthique avec l'IA, dans des contextes personnels et professionnels :</p>\n<ul>\n<li>Élaborez des normes claires sur quand et comment vous collaborerez avec l'IA selon les différents contextes</li>\n<li>Fixez des limites concernant les informations sensibles ou confidentielles</li>\n<li>Clarifiez comment vous mènerez le contrôle qualité du travail assisté par l'IA</li>\n<li>Identifiez les enjeux éthiques les plus pertinents pour votre domaine ou vos activités</li>\n<li>Élaborez des critères de décision pour résoudre les dilemmes éthiques</li>\n<li>Prenez en compte les points de vue des différentes personnes qui pourraient être affectées par vos interactions avec l'IA</li>\n<li>Déterminez comment vous divulguerez votre collaboration avec l'IA selon les différents contextes</li>\n<li>Créez des modèles pour les mentions d'attribution et les déclarations de transparence</li>\n<li>Établissez des critères déterminant quand une divulgation plus détaillée est nécessaire</li>\n</ul>\n<p>Tout au long de ce processus, utilisez Claude comme partenaire de réflexion pour explorer les questions éthiques sous plusieurs angles.</p>", "id": "c2-12-0-1"}, {"level": 4, "title": "Réflexion", "children": [], "html": "<p>Les exercices ci-dessus constituent la partie réflexion de cette leçon. Grâce à eux, vous aurez l'occasion de consolider vos apprentissages et de les relier à votre développement continu.</p>", "id": "c2-12-0-2"}, {"level": 4, "title": "Prochaines étapes", "children": [], "html": "<p>Félicitations pour avoir terminé le cours AI Fluency : Cadre et Fondations ! Ce n'est que le début de votre parcours vers l'AI Fluency. Alors que la technologie de l'IA continue d'évoluer, les compétences que vous avez développées en Délégation, Description, Discernement et Diligence vous fourniront un cadre de référence durable pour votre travail avec ces systèmes.</p>\n<p>Rappelez-vous que la maîtrise se développe par la pratique. Chaque interaction avec l'IA est une occasion d'affiner vos compétences et d'approfondir votre compréhension. En traitant l'IA comme un partenaire de réflexion plutôt qu'un simple outil, et en restant fidèle à un engagement envers l'efficacité, l'efficience, l'éthique et la sécurité, vous êtes bien préparé pour naviguer l'avenir de la collaboration humain-IA.</p>\n<p>Nous vous encourageons à continuer d'explorer, d'expérimenter et de réfléchir sur vos interactions avec l'IA. La Leçon 12 contient de nombreux excellents exercices bonus pour poursuivre votre parcours.</p>\n<p>Nous vous encourageons à partager ce que vous avez appris avec les autres (et avec nous !), à rechercher des points de vue différents, et à contribuer à la conversation en cours sur la manière dont nous pouvons collaborer avec l'IA de façon à renforcer le potentiel humain tout en respectant nos valeurs et nos responsabilités les uns envers les autres. Merci pour votre participation et votre engagement dans ce cours !</p>", "id": "c2-12-0-3"}, {"level": 4, "title": "Retours sur ce cours", "children": [], "html": "<p>Pendant que vous suivez ce cours, nous serions ravis de connaître votre avis sur la manière dont vous utilisez les concepts du cours dans votre vie, votre travail ou votre classe, ainsi que tout retour que vous pourriez avoir. Partagez votre avis ici.</p>", "id": "c2-12-0-4"}, {"level": 4, "title": "Remerciements et licence", "children": [], "html": "<p>Copyright 2025 Rick Dakan, Joseph Feller et Anthropic. Publié sous licence CC BY-NC-SA 4.0.</p>\n<p>Ce cours s'appuie sur le cadre AI Fluency de Dakan et Feller. Un soutien partiel a été apporté par la Higher Education Authority of Ireland, via le National Forum for the Enhancement of Teaching and Learning.</p>\n<hr />", "id": "c2-12-0-5"}], "html": "<p>(6 minutes)</p>\n<p>Cette vidéo de synthèse revient sur le cadre AI Fluency et réunit les principaux concepts explorés tout au long du cours. Nous rappelons les quatre compétences fondamentales (les 4D) : la Délégation (décider quel travail confier à l'IA et lequel réaliser soi-même), la Description (communiquer efficacement avec l'IA), le Discernement (évaluer les résultats et le comportement de l'IA), et la Diligence (garantir une collaboration responsable avec l'IA). Nous soulignons que ces compétences s'appliquent aux trois principales façons d'interagir avec l'IA (Automatisation, Augmentation et Agentivité), et que la maîtrise se développe par la pratique, et non d'un seul coup. Nous concluons en rappelant à chacun que les systèmes d'IA sont puissants, mais ne sont pas des solutions magiques ; leur utilité et leur sécurité dépendent de la manière dont nous les mettons en œuvre par un engagement réfléchi.</p>", "id": "c2-12-0"}], "html": "<p>Durée estimée : 15 minutes</p>\n<p>À la fin de cette leçon, vous serez capable de :</p>\n<ul>\n<li>Consolider les principaux apprentissages du cours</li>\n<li>Relier l'AI Fluency à votre développement continu</li>\n</ul>", "id": "c2-12"}, {"level": 2, "title": "Certificat de réussite", "children": [], "html": "<p>[Aucun contenu]</p>\n<hr />", "id": "c2-13"}, {"level": 2, "title": "Activités bonus", "children": [{"level": 3, "title": "Élaborer un plan personnel d'AI Fluency", "children": [], "html": "<p>Avec l'aide d'un assistant IA, créez un plan structuré pour développer votre AI Fluency dans le temps :</p>\n<p><strong>Évaluation actuelle des compétences</strong><br />\n- Pour chacune des 4 compétences, évaluez votre niveau actuel de maîtrise (novice, en progression, confiant)<br />\n- Notez les points forts précis et les axes de progression au sein de chaque compétence<br />\n- Identifiez quelle façon d'interagir avec l'IA (Automatisation, Augmentation, Agentivité) vous utilisez actuellement le plus souvent, et laquelle vous utilisez le moins efficacement</p>\n<p><strong>Identifier les priorités de développement</strong><br />\n- Choisissez 1 ou 2 compétences comme axe de développement prioritaire<br />\n- Identifiez les aspects précis de ces compétences les plus utiles dans votre contexte<br />\n- Réfléchissez à la façon d'interagir avec l'IA dans laquelle vous souhaiteriez devenir plus compétent</p>\n<p><strong>Planification d'actions concrètes</strong><br />\n- Créez des activités précises pour développer chaque compétence ciblée<br />\n- Fixez un calendrier et une fréquence de pratique<br />\n- Identifiez les ressources et outils pour soutenir votre développement<br />\n- Définissez comment vous reconnaîtrez vos progrès et vos réussites</p>\n<p>Tout au long de ce processus, utilisez Claude comme partenaire de réflexion, en partageant votre auto-évaluation et en recueillant des retours sur votre plan.</p>", "id": "c2-14-0"}, {"level": 3, "title": "Constituer une bibliothèque personnelle de prompts et de modèles", "children": [], "html": "<p>Avec l'aide de Claude, créez une collection personnalisée de prompts et de modèles efficaces pour les interactions avec l'IA que vous effectuez fréquemment :</p>\n<p><strong>Création de modèles pour les tâches courantes</strong><br />\n- Identifiez 5 à 10 tâches pour lesquelles vous utilisez fréquemment l'IA<br />\n- Développez un prompt-modèle pour chaque tâche qui produit systématiquement de bons résultats<br />\n- Incluez des espaces réservés ou des notes pour les informations variables à ajouter chaque fois</p>\n<p><strong>Documenter les stratégies efficaces</strong><br />\n- Documentez les techniques de Description précises qui fonctionnent pour différents types de tâches<br />\n- Notez les schémas de Discernement qui vous aident à évaluer les résultats plus efficacement<br />\n- Notez quelles approches fonctionnent le mieux selon les différents modes d'interaction</p>\n<p><strong>Construire une ressource de référence personnelle</strong><br />\n- Organisez vos modèles et stratégies de manière à ce qu'ils soient faciles à rechercher et à consulter<br />\n- Incluez des exemples de résultats réussis à titre de référence<br />\n- Créez un système pour mettre à jour votre bibliothèque à mesure que vous découvrez de nouvelles approches efficaces</p>\n<p>Vous pouvez travailler avec Claude pour analyser vos interactions passées réussies et identifier les schémas qui les ont rendues efficaces.</p>", "id": "c2-14-1"}, {"level": 3, "title": "Soirée jeux !", "children": [], "html": "<p>Ces exercices ludiques, conçus pour vous et Claude, vous aident à pratiquer une Description précise et à aiguiser vos compétences de Discernement à travers des jeux de mots. Parce que les énigmes comportent des consignes précises (contrairement à des tâches ouvertes comme « rédige une lettre de remerciement »), elles constituent un excellent moyen de s'exercer à une communication claire. Et parce qu'elles sont délibérément un peu retorses, elles font d'excellents exercices de Discernement ! En jouant simplement à quelques jeux, vous pouvez apprendre beaucoup sur la manière d'évaluer et de guider soigneusement le raisonnement de l'IA. Essayez l'un ou l'ensemble des jeux suivants.</p>\n<p><strong>Échange d'énigmes</strong></p>\n<p>Créez une énigme (ou essayez celle-ci : « Une centaine de battements de tambour, que je frappe, composant une symphonie de lumière. Que suis-je en train de faire ? »).</p>\n<p>(Réponse : Je tape sur un clavier d'ordinateur (généralement 104 touches) pour créer des pixels sur un écran.)</p>\n<p>Demandez à Claude de deviner et, surtout, d'expliquer son raisonnement.</p>\n<p>Prêtez attention non seulement à ce que Claude a deviné, mais aussi aux raisons de sa réponse.</p>\n<p>Ensuite, plutôt que de lui donner la réponse, guidez doucement Claude vers le bon enchaînement de raisonnement et le contexte permettant d'arriver à la réponse.</p>\n<p>Puis échangez les rôles et demandez-lui de vous poser une énigme. Laissez Claude vous guider comme vous venez de le faire.</p>\n<p><strong>Mots croisés coopératifs</strong></p>\n<p>Résolvez ensemble des définitions de mots croisés (les définitions de mots croisés cryptiques peuvent être particulièrement amusantes).</p>\n<p>L'important n'est pas la performance de vous-même ou de Claude aux mots croisés. Il s'agit d'apprendre à guider et à affiner le raisonnement : « Rappelle-toi, ça ne fait que 5 lettres », « Non, ça ne peut pas être ça, parce que ça commence par un B », « Peut-être que par \"avaler\", ils ne parlent pas de boire, mais de l'oiseau appelé hirondelle. »</p>\n<p>Ces techniques de guidage se révéleront étonnamment utiles dans des projets « réels ».</p>\n<p><strong>Association de mots</strong></p>\n<p>Jouer à des jeux d'association de mots avec Claude (ou le modèle de votre choix) est très satisfaisant et éclairant. Il existe de nombreux jeux gratuits en ligne, il suffit d'en chercher un !</p>\n<p>Même le simple fait de choisir 12 à 20 mots au hasard et de travailler avec Claude pour trouver des relations entre eux constitue un excellent exercice de Discernement. Lorsque vous remarquez que Claude établit un lien discutable ou passe à côté d'un schéma prometteur, signalez-le et orientez-le vers un meilleur raisonnement. De même, restez ouvert à ce que Claude repère des liens que vous auriez pu manquer !</p>\n<p>Pendant la collaboration, exercez les trois types de Discernement :</p>\n<ul>\n<li><strong>Discernement du Produit</strong> : La réponse est-elle logique, et correspond-elle véritablement à un thème cohérent ?</li>\n<li><strong>Discernement du Processus</strong> : Comment Claude a-t-il résolu l'énigme ? A-t-il envisagé plusieurs possibilités ? S'est-il concentré de manière trop étroite sur une seule interprétation ?</li>\n<li><strong>Discernement de la Performance</strong> : Comment Claude a-t-il communiqué son raisonnement ? Était-il clair ? A-t-il posé de bonnes questions ? A-t-il su s'appuyer efficacement sur vos suggestions ?</li>\n</ul>\n<p><strong>Autres suggestions de jeux</strong></p>\n<p>Continuez à développer vos compétences de Description et de Discernement avec les activités suivantes :</p>\n<ul>\n<li><strong>Vingt questions</strong> : Demandez à Claude de penser à un objet, une personne ou un concept, puis devinez en posant des questions fermées (oui/non). Puis échangez les rôles. Observez comment chacun de vous formule les questions et fournit des indices.</li>\n<li><strong>Récit collaboratif</strong> : Commencez une histoire avec une phrase, laissez Claude ajouter la suivante, puis alternez. Observez comment vous maintenez tous les deux la cohérence narrative et vous appuyez sur les idées de l'autre.</li>\n<li><strong>Un magicien vous approche dans une taverne</strong> : Si vous aimez les jeux de rôle, essayez de jouer une ou deux parties avec un modèle de langage, en tant que joueur ou en tant que maître du jeu.</li>\n<li><strong>Concept et contrainte</strong> : Choisissez un concept complexe et une contrainte très stricte, comme « explique-le uniquement à l'aide de métaphores culinaires ». Puis demandez à Claude de vous lancer un défi, essayez-le vous-même, et comparez vos approches.</li>\n<li><strong>Énigmes avancées</strong> : Créez vos propres énigmes logiques ou verbales, puis mettez Claude au défi de les résoudre. Ou demandez à Claude de créer des énigmes que vous devrez résoudre. (Si vous êtes programmeur, vous pouvez remplacer les énigmes par des problèmes ardus, comme vous attaquer à https://projecteuler.net/ avec Claude.)</li>\n</ul>", "id": "c2-14-2"}, {"level": 3, "title": "Retours sur ce cours", "children": [], "html": "<p>Nous serions ravis de connaître votre avis sur la manière dont vous utilisez les concepts de ce cours dans votre vie, votre travail ou votre classe, ainsi que tout retour que vous pourriez avoir. Partagez votre avis ici.</p>", "id": "c2-14-3"}, {"level": 3, "title": "Remerciements et licence", "children": [], "html": "<p>Copyright 2025 Rick Dakan, Joseph Feller et Anthropic. Publié sous licence CC BY-NC-SA 4.0.</p>\n<p>Ce cours s'appuie sur le cadre AI Fluency de Dakan et Feller. Un soutien partiel a été apporté par la Higher Education Authority of Ireland, via le National Forum for the Enhancement of Teaching and Learning.</p>\n<hr />", "id": "c2-14-4"}], "html": "<p>Durée estimée : à votre rythme</p>\n<p>Les activités suivantes sont conçues pour un apprentissage autonome après avoir terminé le cours AI Fluency : Cadre et Fondations.</p>\n<p>Choisissez celles qui correspondent à vos intérêts et à vos besoins — ou utilisez-les comme source d'inspiration pour créer les vôtres !</p>", "id": "c2-14"}]}, {"num": 3, "title": "Leçon 3 : AI Fluency pour les enseignants", "introHtml": "<blockquote>\n<p>Formation aux compétences de collaboration avec l'IA pour les enseignants<br />\nLien du cours : <a href=\"https://anthropic.skilljar.com/ai-fluency-for-educators\">AI Fluency for Educators</a> | 5 leçons au total</p>\n</blockquote>\n<hr />", "tree": [{"level": 3, "title": "Leçon 2 : Appliquer l'AI Fluency à la conception de cours et aux objectifs d'apprentissage", "children": [], "html": "<p><strong>Leçon 2 : Appliquer l'AI Fluency à la conception de cours et aux objectifs d'apprentissage</strong></p>\n<p><strong>Concept central</strong><br />\nL'AI Fluency transforme la conception de cours en construisant un contexte riche et partagé, faisant passer l'IA d'un assistant générique à un collaborateur qui comprend les contextes d'enseignement spécifiques, les contraintes et la vision pédagogique.</p>\n<p><strong>Trois tâches fondamentales de conception de cours</strong><br />\n1. Déterminer le contenu et les concepts essentiels pour les étudiants<br />\n2. Planifier le parcours d'apprentissage — c'est-à-dire la manière dont les différents sujets se relient entre eux<br />\n3. Formuler des objectifs d'apprentissage précis</p>\n<p><strong>Appliquer le cadre des 4D à la conception de cours</strong></p>\n<p><strong>La Délégation dans la conception de cours</strong><br />\n- Prendre des décisions de délégation éclairées en fonction de l'expertise disciplinaire et des objectifs<br />\n- Déterminer quel travail doit être fait (sélection du contenu, séquençage, définition des objectifs)<br />\n- Décider qui le fait (l'humain, l'IA, ou les deux) et comment<br />\n- Avant de déterminer « qui le fait » et « comment », répondre d'abord à « quoi faire » et « pourquoi »</p>\n<p><strong>La Description dans la conception de cours</strong><br />\n- Créer un espace de réflexion ancré dans des défis pédagogiques réels<br />\n- Exemple : « Je conçois un cours de statistiques pour des étudiants en journalisme qui ont besoin de maîtriser les données, mais qui sont souvent anxieux face aux mathématiques ou sceptiques quant à l'importance des statistiques dans leur carrière »<br />\n- Partager les défis spécifiques, les besoins des étudiants, les prérequis et les résultats attendus<br />\n- Expliquer sa vision de la réussite et les contraintes rencontrées<br />\n- Utiliser à la fois la Description de produit (ce que l'on veut que l'IA fasse) et la Description de processus (comment le faire)</p>\n<p><strong>Le Discernement dans la conception de cours</strong><br />\n- Évaluer les suggestions de l'IA à l'aune de sa propre expertise<br />\n- Se demander : ce concept aide-t-il vraiment les étudiants ciblés ?<br />\n- Ne pas se contenter d'accepter ou de rejeter — expliquer pourquoi une suggestion donnée fonctionne ou non dans un contexte particulier<br />\n- Utiliser son expertise pour orienter de meilleures suggestions futures<br />\n- Repérer les intuitions inattendues et les nouvelles façons de penser</p>\n<p><strong>La Diligence dans la conception de cours</strong><br />\n- Ne pas externaliser les décisions — assumer la responsabilité de ce qui est finalement présenté aux étudiants<br />\n- Documenter les décisions clés prises pendant la collaboration avec l'IA<br />\n- Partager son processus de réflexion avec les étudiants pour montrer l'exemple d'un usage responsable de l'IA<br />\n- Assurance qualité et transparence<br />\n- Maintenir sa responsabilité tout en montrant comment l'IA renforce l'expertise pédagogique</p>\n<p><strong>Technique du jeu de rôle avec l'IA</strong><br />\nDemander à l'IA de « jouer le rôle d'un de mes étudiants » pour évaluer le déroulement du cours :<br />\n- Comment les étudiants réagiraient-ils aux différentes étapes ?<br />\n- Où la confusion pourrait-elle apparaître ?<br />\n- Quelles connaissances préalables sont nécessaires à chaque étape ?<br />\n- Quel accompagnement est nécessaire lors des transitions entre les sujets ?</p>\n<p><strong>Améliorer les objectifs d'apprentissage</strong><br />\n- Tirer parti du contexte déjà établi lors de collaborations précédentes<br />\n- Téléverser les programmes de cours contenant des descriptions de contexte plus riches<br />\n- Élaborer des objectifs d'apprentissage précis, pertinents, motivants, fidèles à sa philosophie pédagogique et conformes aux exigences institutionnelles<br />\n- Relier les résultats du cours aux compétences valorisables sur un CV pour motiver les étudiants<br />\n- Comme le processus est plus rapide, on peut tester différentes approches</p>\n<p><strong>Bénéfices au-delà du gain de temps</strong><br />\n- Découvrir des présupposés cachés et des angles morts<br />\n- Explorer des connexions créatives entre les concepts<br />\n- Maintenir la cohérence tout en explorant de nouvelles idées<br />\n- Développer des capacités personnelles, renforcées par la pratique</p>\n<p><strong>Principes clés</strong><br />\n- Les 4D constituent un véritable cadre de partenariat cognitif, pas une simple checklist<br />\n- L'expertise pédagogique et disciplinaire guide l'exploration collaborative<br />\n- L'approche de construction du contexte s'applique à : la création de nouveaux cours, la mise à jour de cours, la conception de séries de cours et la planification de parcours d'apprentissage<br />\n- Partir de la vue d'ensemble, construire à travers les détails, et maintenir le contexte<br />\n- L'objectif est l'amélioration, pas seulement l'efficacité — obtenir un meilleur enseignement et un meilleur apprentissage, pas seulement une planification plus rapide</p>\n<p><strong>Structure de l'exercice (50 minutes)</strong><br />\nPhase 1 : Planifier son approche (clarifier le cours, le travail nécessaire, et les frontières entre sa propre expertise et l'assistance de l'IA)<br />\nPhase 2 : Lancer la collaboration (partager le contexte d'enseignement, expliquer les défis, établir le partenariat)<br />\nPhase 3 : Construire la conversation à travers la Description et le Discernement (identification du contenu, planification du parcours d'apprentissage, définition des objectifs d'apprentissage)<br />\nPhase 4 : Documentation et réflexion (vérifier l'exactitude, consigner les décisions, noter les suggestions rejetées, créer une déclaration sur le rôle de l'IA)</p>\n<p><strong>Résultat</strong><br />\nCréer un véritable partenariat cognitif dans lequel le jugement humain, les valeurs et les relations enseignant-étudiant restent centraux, tandis que l'IA renforce la pratique pédagogique.</p>\n<hr />", "id": "c3-0"}, {"level": 3, "title": "Leçon 1 : Introduction à l'AI Fluency pour les enseignants", "children": [], "html": "<p>AI Fluency pour les enseignants = un cadre permettant d'intégrer l'IA à la pratique pédagogique de manière efficace, efficiente, éthique et sûre</p>\n<p>Objectif du cours = appliquer le cadre des 4D (Délégation, Description, Discernement, Diligence) spécifiquement aux contextes éducatifs</p>\n<p>Pourquoi l'AI Fluency compte en éducation :<br />\n- Les étudiants utilisent déjà l'IA<br />\n- Les employeurs attendent des diplômés qu'ils maîtrisent l'IA<br />\n- Les établissements ont besoin de stratégies d'intégration responsable de l'IA<br />\n- Les enseignants façonnent la manière dont la prochaine génération interagit avec l'IA</p>\n<p>Résultats attendus du cours :<br />\n- Appliquer le cadre des 4D à la pratique pédagogique<br />\n- Utiliser l'IA pour la conception de cours et la préparation des leçons<br />\n- Créer du matériel pédagogique tout en préservant la vision pédagogique et l'intégrité académique<br />\n- Mener des discussions sur l'IA au sein de son établissement<br />\n- Montrer l'exemple d'une interaction responsable avec l'IA pour les étudiants</p>\n<p>Prérequis = avoir suivi le cours AI Fluency : Framework and Foundations</p>\n<p>Résumé du cadre des 4D :</p>\n<p>AI Fluency = un humain responsable dans la boucle, l'augmentation plutôt que l'automatisation</p>\n<p>Délégation = décider qui fait quel travail (l'humain vs l'IA vs la collaboration)<br />\nTrois types :<br />\n- Conscience du problème = clarifier les objectifs et les critères de réussite avant d'interagir avec l'IA<br />\n- Conscience de la plateforme = comprendre les capacités et les limites des différentes IA<br />\n- Délégation des tâches = répartir le travail pour tirer parti à la fois de la créativité/du jugement humains et de la vitesse/puissance de traitement de l'IA</p>\n<p>Description = la manière de communiquer avec l'IA (une conversation, pas une commande)<br />\nTrois dimensions :<br />\n- Description de produit = spécification détaillée du résultat final (longueur, public, style, format)<br />\n- Description de processus = orienter l'approche de l'IA (réfléchir étape par étape, analyser sous plusieurs angles)<br />\n- Description de performance = définir le comportement de l'IA pendant l'interaction (jouer le rôle d'un éditeur critique, d'un partenaire de brainstorming bienveillant)</p>\n<p>Discernement = évaluer les résultats de l'IA et ajuster en conséquence<br />\nTrois niveaux :<br />\n- Discernement de produit = évaluation qualitative du résultat produit par l'IA (exactitude, utilité, nouvelles perspectives)<br />\n- Discernement de processus = examiner le raisonnement et les hypothèses de l'IA<br />\n- Discernement de performance = évaluer le comportement de l'IA pendant l'interaction</p>\n<p>Description + Discernement = une boucle de rétroaction continue qui transforme l'IA d'un simple outil en un partenaire de réflexion</p>\n<p>Diligence = utiliser l'IA de manière responsable tout au long de la collaboration<br />\nTrois aspects :<br />\n- Diligence de création = choisir les systèmes d'IA avec discernement, en tenant compte de la confidentialité, de la sécurité et de la pertinence<br />\n- Diligence de transparence = divulguer honnêtement le rôle d'assistance de l'IA<br />\n- Diligence de déploiement = assumer la propriété et la responsabilité des résultats produits avec l'aide de l'IA</p>\n<p>Principes clés :<br />\n- L'augmentation plutôt que l'automatisation (en particulier dans les contextes d'apprentissage)<br />\n- Les valeurs pédagogiques restent toujours au centre<br />\n- Les 4D fonctionnent ensemble comme des compétences interconnectées<br />\n- Ces compétences restent applicables à mesure que la technologie de l'IA évolue</p>\n<p>Document de contexte pédagogique = un artefact réutilisable permettant d'établir une compréhension partagée avec l'IA pour les collaborations futures</p>\n<p>Domaines de contexte essentiels :<br />\n- Domaine, niveau, cours spécifique<br />\n- Profil des étudiants, difficultés, objectifs<br />\n- Contraintes institutionnelles<br />\n- Philosophie et approche pédagogiques<br />\n- Difficultés d'enseignement récurrentes<br />\n- Objectifs d'intégration de l'IA<br />\n- Aspects particuliers du contexte d'enseignement</p>\n<p>Bénéfices d'un document de contexte :<br />\n- Améliore l'efficacité de la collaboration avec l'IA<br />\n- Fait gagner du temps lors des interactions futures<br />\n- Maintient la cohérence entre différentes conversations avec l'IA<br />\n- Aide l'IA à comprendre les besoins et les contraintes spécifiques de l'enseignant</p>\n<hr />", "id": "c3-1"}, {"level": 3, "title": "Leçon 3 : Appliquer l'AI Fluency au matériel pédagogique et aux devoirs", "children": [], "html": "<p><strong>Leçon 3 : Appliquer l'AI Fluency au matériel pédagogique et aux devoirs</strong></p>\n<p><strong>Objectifs d'apprentissage principaux</strong><br />\n- Utiliser le cadre des 4D pour construire du matériel pédagogique avec l'IA<br />\n- Tirer parti du contexte établi pour développer du matériel cohérent<br />\n- Appliquer un contrôle qualité systématique grâce au Discernement<br />\n- Créer des expériences d'apprentissage intégrées</p>\n<p><strong>Cadre d'analyse de l'impact disciplinaire de l'IA</strong></p>\n<p><strong>Trois questions clés à propos d'une discipline :</strong><br />\n1. Ce qui sera automatisé = les tâches routinières que l'IA pourrait automatiser dans les futures carrières<br />\n2. Le potentiel de collaboration = les domaines où la collaboration humain-IA a le plus d'impact<br />\n3. Qui est responsable = comment les humains gèrent le travail de l'IA et en assument la responsabilité</p>\n<p><strong>Trois types d'expertise existants :</strong><br />\n- Expertise disciplinaire = le contenu du domaine, ses valeurs, ses méthodes, ses modes de pensée<br />\n- Expertise pédagogique = les points de confusion des étudiants, les moments de compréhension, le processus d'acquisition de la maîtrise<br />\n- Expertise en évaluation = reconnaître une compréhension authentique, concevoir des méthodes d'évaluation</p>\n<p><strong>L'impact disruptif de l'IA dans trois domaines</strong></p>\n<p><strong>Impact sur le curriculum :</strong><br />\n- Les savoirs fondamentaux comptent toujours, mais les étudiants en questionneront la nécessité<br />\n- Il faut une réponse convaincante et propre à chaque discipline à la question « pourquoi apprendre cela si l'IA peut le faire »<br />\n- Tâches : identifier ce que l'IA peut automatiser, juger quels concepts deviennent plus ou moins importants, évaluer comment l'IA modifie les meilleures pratiques</p>\n<p><strong>Impact sur l'enseignement :</strong><br />\n- L'IA peut permettre un tutorat personnalisé, des simulations interactives, un retour instantané<br />\n- Défi : distinguer si elle renforce l'apprentissage ou si elle n'est qu'un raccourci<br />\n- Tâches : définir comment l'IA renforce ou entrave l'apprentissage, identifier les meilleurs modèles de collaboration étudiant-enseignant-IA, déterminer des méthodes d'enseignement efficaces</p>\n<p><strong>Impact sur l'évaluation :</strong><br />\n- La perturbation la plus urgente = que mesure-t-on quand les étudiants peuvent générer du contenu en quelques secondes<br />\n- Une évaluation de l'authenticité est nécessaire pour distinguer le travail assisté par l'IA du travail purement humain<br />\n- Tâches : identifier la performance réelle de l'apprentissage assisté par l'IA, créer des devoirs qui empêchent les « raccourcis », valoriser le processus plutôt que le produit, s'adapter à l'usage inévitable de l'IA par les étudiants</p>\n<p><strong>Appliquer les 4D à l'expertise disciplinaire</strong></p>\n<p><strong>Discernement = évaluation de la qualité</strong><br />\n- Établir des standards de qualité = des grilles d'évaluation détaillées qui vont au-delà des termes vagues et précisent les marqueurs d'excellence<br />\n- Rassembler des travaux exemplaires = une analyse systématique avec les étudiants, rendant visibles les processus de pensée des experts<br />\n- Diagnostiquer les cas d'échec = un examen minutieux d'exemples défaillants pour comprendre les schémas d'échec</p>\n<p><strong>Description = maîtrise de la communication</strong><br />\n- Cartographier les résultats disciplinaires = documenter précisément les productions clés et en révéler la logique sous-jacente<br />\n- Révéler la pensée experte = rendre visible le processus de résolution de problèmes, en retraçant les micro-décisions<br />\n- Formuler les normes = mettre en évidence les comportements propres au domaine et définir concrètement « penser comme X »</p>\n<p><strong>Délégation = décomposition du travail</strong><br />\n- Révéler la structure du problème = décomposer les défis en composantes distinctes et explorer les possibilités offertes par l'IA<br />\n- Explorer les possibilités de l'IA = ce qui peut être automatisé, augmenté ou délégué à un agent d'IA<br />\n- Concevoir des arbres de décision = à partir d'études de cas, construire un cadre définissant quand et comment faire intervenir l'IA</p>\n<p><strong>Diligence = normes éthiques</strong><br />\n- Codifier un cadre éthique = des principes de « non-nuisance » propres au domaine, en créant une matrice de décision<br />\n- Formuler des normes de transparence = les attentes en matière de divulgation, en fournissant des modèles de citation pour l'assistance de l'IA<br />\n- Co-créer des politiques de responsabilisation = établir des standards conjointement avec les étudiants, développer des protocoles d'évaluation par les pairs</p>\n<p><strong>Créer du matériel avec l'IA</strong></p>\n<p><strong>Tirer parti du contexte :</strong><br />\n- Le contexte établi = chaque nouveau flux de travail est meilleur que de partir de zéro<br />\n- Se référer aux conversations précédentes et au travail de conception de cours déjà réalisé<br />\n- Partager les transcriptions vidéo et le contexte du cours avec l'IA</p>\n<p><strong>Appliquer les 4D à la création de matériel :</strong><br />\n- Délégation = comprendre quel matériel est nécessaire et pourquoi<br />\n- Description = tirer parti du contexte établi ainsi que des exigences spécifiques<br />\n- Boucle Description-Discernement = un outil d'affinement qui explique pourquoi une suggestion fonctionne ou non<br />\n- Diligence = protéger les données sensibles, vérifier l'exactitude, contrôler les biais, créer de la transparence</p>\n<p><strong>Quatre options de création de matériel :</strong></p>\n<p><strong>Option 1 : Diapositives de cours</strong><br />\n- Préparation : partager le contexte du cours, le style de présentation, la dynamique de classe, les préférences visuelles<br />\n- Processus : plan initial → évaluer le déroulement/la complexité → développer les diapositives clés → produire les diapositives complètes<br />\n- Vérification finale : vérifier l'exactitude, noter les besoins en images/citations, documenter la contribution de l'IA</p>\n<p><strong>Option 2 : Guide d'étude/de révision</strong><br />\n- Préparation : se référer aux sujets du cours, décrire les habitudes d'étude des étudiants, expliquer quels supports sont efficaces<br />\n- Processus : identifier les concepts clés → concevoir des questions d'autoévaluation → anticiper les erreurs courantes → construire des liens entre les connaissances<br />\n- Vérification finale : vérifier l'exactitude des réponses, contrôler l'alignement avec l'évaluation, garantir l'accessibilité</p>\n<p><strong>Option 3 : Exercice interactif en classe</strong><br />\n- Préparation : décrire le cadre de la classe, les contraintes de temps, les modes d'interaction des étudiants, les objectifs d'apprentissage<br />\n- Processus : concevoir l'activité de manière collaborative → réfléchir à la logistique → anticiper les réactions des étudiants → créer des notes de facilitation<br />\n- Vérification finale : tester la clarté des consignes, tenir compte de l'accessibilité, prévoir des solutions de repli</p>\n<p><strong>Option 4 : Quiz de vérification des connaissances</strong><br />\n- Préparation : se référer aux objectifs d'apprentissage, au niveau d'évaluation, à l'approche en matière d'intégrité académique<br />\n- Processus : concevoir 5 à 10 questions de types différents → varier les types de questions → relier aux objectifs d'apprentissage → créer des explications de réponses<br />\n- Vérification finale : vérifier l'exactitude des réponses, contrôler les biais/sources de confusion, garantir un niveau de difficulté approprié</p>\n<p><strong>Principes clés</strong><br />\n- L'AI Fluency = amplifier plutôt que remplacer l'expertise humaine<br />\n- Le savoir disciplinaire = le fondement permettant d'atteindre des résultats sans précédent<br />\n- Les capacités humaines = l'expertise du domaine, le jugement, la créativité, l'éthique et les relations interpersonnelles<br />\n- Former des étudiants qui soient des humains irremplaçables, et non ceux que l'on remplace<br />\n- Se concentrer sur la cohérence et la qualité, pas seulement sur l'efficacité<br />\n- La boucle Description-D
