z-vous la dignité et le respect lorsque vous réalisez un travail assisté par l'IA avec des populations vulnérables ?</li>\n<li>Quand devriez-vous choisir de ne pas utiliser l'IA, même si cela était plus efficace ?</li>\n</ul>\n<p>Partie 7 : Compiler et relire</p>\n<p>Travaillez avec l'IA pour consolider vos réponses en un projet de document de politique :</p>\n<ul>\n<li>Partagez vos réponses et demandez à l'IA de vous aider à les organiser en une politique claire et utilisable.</li>\n<li>Relisez le brouillon pour vérifier son exhaustivité et son alignement avec le style de votre organisation.</li>\n<li>Identifiez les lacunes ou les points nécessitant une discussion approfondie avec votre équipe.</li>\n<li>Planifiez la manière dont vous introduirez et réviserez cette politique à mesure que l'utilisation de l'IA par votre organisation évolue.</li>\n</ul>\n<p>Réflexion sur la leçon<br />\n- Comment votre vision de l'intégration de l'IA a-t-elle évolué depuis le début de ce cours ?<br />\n- Sur la base de ce que vous avez appris, quelle est une chose que vous ferez différemment lorsque vous travaillerez avec l'IA ?</p>\n<p>Retour d'expérience</p>\n<p>Nous aimerions savoir comment vous appliquez les concepts de ce cours à votre travail, ainsi que tout retour que vous souhaiteriez partager. Partagez votre retour d'expérience ici.</p>\n<p>Remerciements et licence</p>\n<p>Copyright 2025 Anthropic et Giving Tuesday. Basé sur le cadre de maîtrise de l'IA développé par le professeur Rick Dakan (Ringling College of Art and Design) et le professeur Joseph Feller (University College Cork). Publié sous licence CC BY-NC-SA 4.0.</p>\n<hr />", "id": "c5-7"}, {"level": 2, "title": "Prochaines étapes", "children": [], "html": "<p>Ce que vous allez apprendre</p>\n<p>Durée estimée : 15 minutes</p>\n<p>À la fin de cette leçon, vous serez capable de :</p>\n<ul>\n<li>Accéder à des modèles types et à des ressources pour continuer à développer votre maîtrise de l'IA</li>\n<li>Partager ce que vous avez appris avec des collègues de votre organisation</li>\n<li>Comprendre où réclamer votre certificat de réussite</li>\n</ul>\n<p>Prochaines étapes</p>\n<p>(5 minutes)</p>\n<p>Cette vidéo réunit tout ce que vous avez appris et vous met au défi de le mettre en pratique immédiatement. Vous obtiendrez des conseils sur la manière de choisir une tâche réelle de votre travail, d'appliquer les quatre capacités du cadre des 4D, et de développer votre maîtrise de l'IA par la pratique concrète. La vidéo présente également des modèles types et des ressources pour soutenir la poursuite de votre apprentissage.</p>\n<p>Points clés à retenir<br />\n- <strong>Commencez par une tâche réelle cette semaine</strong> : choisissez une tâche qui vous attend — une demande de subvention, un rapport aux donateurs, des données de projet nécessitant une analyse — et utilisez ce que vous avez appris pour l'accomplir avec le soutien de l'IA.<br />\n- <strong>Appliquez le cadre des 4D dans son intégralité</strong> : commencez par la <strong>Délégation</strong> (qu'est-ce qui nécessite le soutien de l'IA par rapport au jugement humain ?), passez à la <strong>Description</strong> (partagez le contexte de votre organisation, les exigences de la tâche et les résultats souhaités), utilisez le <strong>Discernement</strong> (évaluez et améliorez par itération), et pratiquez la <strong>Diligence</strong> (assumez la responsabilité du résultat final).<br />\n- <strong>Rappelez-vous que c'est une boucle, pas une ligne droite</strong> : vous pourriez passer de la Délégation à la Description, revenir au Discernement, puis réaliser que vous souhaitez déléguer différemment. C'est ainsi que votre maîtrise de l'IA se développe par la pratique.<br />\n- <strong>Utilisez les modèles types pour guider vos premières tentatives</strong> : accédez à des guides pas à pas pour les tâches associatives courantes afin de soutenir vos premières interactions avec l'IA.<br />\n- <strong>Partagez avec votre communauté</strong> : utilisez votre certificat de réussite pour lancer des conversations sur la maîtrise de l'IA au sein de votre organisation.</p>\n<p>Votre travail final</p>\n<p>Avant de terminer ce cours, choisissez une tâche réelle de votre travail et accomplissez-la cette semaine avec le soutien de l'IA.</p>\n<p>Étape 1 : Choisir votre tâche</p>\n<p>Choisissez une tâche précise qui vous attend :</p>\n<ul>\n<li>Une demande ou un rapport de subvention avec une échéance imminente</li>\n<li>Une communication à un donateur que vous repoussez depuis un moment</li>\n<li>Des données de projet nécessitant une analyse</li>\n<li>Une politique ou une procédure nécessitant une mise à jour</li>\n<li>La planification d'un événement ou un contenu promotionnel</li>\n</ul>\n<p>Étape 2 : Appliquer le cadre des 4D</p>\n<p>Pratiquez chaque capacité une par une :</p>\n<ul>\n<li><strong>Délégation</strong> : quelles parties bénéficieraient du soutien de l'IA ? Lesquelles nécessitent votre jugement humain ?</li>\n<li><strong>Description</strong> : partagez le contexte de votre organisation, les exigences de la tâche, et la manière dont vous souhaitez que l'IA l'aborde.</li>\n<li><strong>Discernement</strong> : évaluez les résultats obtenus, identifiez les lacunes, et affinez votre approche.</li>\n<li><strong>Diligence</strong> : assumez la responsabilité du résultat final, vérifiez l'exactitude, et maintenez la transparence lorsque cela est approprié.</li>\n</ul>\n<p>Étape 3 : Réfléchir à votre expérience</p>\n<p>Après avoir accompli la tâche, réfléchissez à :</p>\n<ul>\n<li>Qu'est-ce qui s'est bien passé ? Que feriez-vous différemment ?</li>\n<li>Quelles capacités vous ont semblé naturelles ? Lesquelles nécessitent davantage de pratique ?</li>\n<li>Comment appliquerez-vous cette approche à de futures tâches ?</li>\n</ul>\n<p>Poursuivre votre apprentissage<br />\n<strong>Modèles types</strong></p>\n<p>Accédez à des guides pas à pas pour les tâches associatives courantes à l'adresse https://claude.com/resources/use-cases/category/nonprofits. Ces modèles types couvrent :</p>\n<ul>\n<li>La rédaction et le rapportage de demandes de subvention</li>\n<li>Les communications avec les donateurs et la recherche de prospects</li>\n<li>L'analyse et la visualisation de données</li>\n<li>Et plus encore</li>\n</ul>\n<p><strong>Ressources</strong></p>\n<p>Vous pouvez accéder à :</p>\n<ul>\n<li>Le guide du cadre des 4D</li>\n<li>Un aide-mémoire des termes clés</li>\n<li>Les exercices du cours et les questions de réflexion</li>\n</ul>\n<p><strong>Approfondir votre compréhension</strong></p>\n<p>Si vous ne l'avez pas encore suivi, le cours d'Anthropic « La maîtrise de l'IA : cadres et fondations » propose une exploration plus approfondie du cadre des 4D et de ses applications.</p>\n<p>Réflexion sur la leçon<br />\n- Quelle est la tâche que vous vous engagez à accomplir avec le soutien de l'IA cette semaine ?<br />\n- Comment votre relation avec l'IA a-t-elle évolué depuis le début de ce cours ?<br />\n- Qui, dans votre organisation ou votre réseau, bénéficierait de suivre ce cours ?</p>\n<p>Félicitations !</p>\n<p>Félicitations pour avoir terminé « La maîtrise de l'IA pour les associations » ! Vous avez construit une base solide dans le cadre des 4D, pratiqué son application à la recherche, à la rédaction, à l'analyse de données et à l'automatisation des flux de travail, et développé des stratégies pour une intégration organisationnelle responsable.</p>\n<p>Rappelez-vous : la maîtrise de l'IA n'est pas une destination, c'est une pratique continue. Les outils continueront d'évoluer, mais le cadre que vous avez appris vous aidera à vous adapter de manière réfléchie, en maintenant votre mission et vos valeurs au centre de chaque décision.</p>\n<p>Après avoir répondu à quelques questions rapides, vous recevrez votre certificat de réussite dans la prochaine leçon.</p>\n<p>Retour d'expérience</p>\n<p>Nous aimerions savoir comment vous appliquez les concepts de ce cours à votre travail, ainsi que tout retour que vous souhaiteriez partager. Partagez votre retour d'expérience ici.</p>\n<p>Remerciements et licence</p>\n<p>Copyright 2025 Anthropic et Giving Tuesday. Basé sur le cadre de maîtrise de l'IA développé par le professeur Rick Dakan (Ringling College of Art and Design) et le professeur Joseph Feller (University College Cork). Publié sous licence CC BY-NC-SA 4.0.</p>\n<hr />", "id": "c5-8"}, {"level": 2, "title": "Quiz du cours", "children": [], "html": "<p>[Aucun contenu]</p>\n<hr />", "id": "c5-9"}]}, {"num": 6, "title": "Leçon 6 : Enseigner la maîtrise de l'IA", "introHtml": "<blockquote>\n<p>Méthodologie d'enseignement pour la maîtrise de l'IA, conçue pour les formateurs<br />\nLien du cours : <a href=\"https://anthropic.skilljar.com/teaching-ai-fluency\">Teaching AI Fluency</a> | 8 leçons au total</p>\n</blockquote>\n<hr />", "tree": [{"level": 3, "title": "Introduction et méthodologie pour enseigner la maîtrise de l'IA", "children": [], "html": "<p>CADRE DE MAÎTRISE DE L'IA = un outil à double finalité qui décrit à la fois ce qui se passe lorsque des personnes collaborent avec l'IA et qui les guide vers de meilleures pratiques</p>\n<p>Structure du cours = 3 leçons, chacune traitant : 1) comment introduire le cadre auprès des étudiants (pédagogie), 2) comment évaluer si les étudiants le comprennent (évaluation), et 3) comment l'intégrer au programme existant</p>\n<p>Méthodes d'enseignement = 4 points d'entrée différents pour introduire le cadre de maîtrise de l'IA auprès des étudiants</p>\n<p>Méthode 1 : Étape par étape (linéaire)<br />\n- Le cadre comme processus séquentiel : Délégation → Description → Discernement → Diligence<br />\n- Idéal pour : les débutants en IA qui ont besoin de structure et d'une progression maîtrisable<br />\n- Mise en œuvre : un exercice en quatre parties qui progresse étape par étape (par ex. Partie 1 = Délégation/planification de projet, Partie 2 = Description/atelier pratique, Partie 3 = Discernement/évaluation, Partie 4 = Diligence/éthique)<br />\n- Points forts : naturelle, intuitive, crée un parcours d'apprentissage structuré</p>\n<p>Méthode 2 : Commencer n'importe où (non linéaire)<br />\n- Le cadre comme système interconnecté où chaque compétence peut constituer le point de départ<br />\n- Idéal pour : les utilisateurs d'IA expérimentés capables de gérer la complexité du monde réel<br />\n- Idée centrale : les compétences s'influencent mutuellement (des problèmes de Discernement → de nouvelles décisions de Délégation ; des exigences de Diligence → des stratégies de Description différentes ; des difficultés de Description → des lacunes de Délégation)<br />\n- Mise en œuvre : projets de groupe, études de cas fondées sur des scénarios réels de collaboration avec l'IA<br />\n- Points forts : reflète la réalité complexe de la collaboration réelle avec l'IA, développe une pensée adaptative</p>\n<p>Méthode 3 : Se concentrer sur un D à la fois (ciblée)<br />\n- Explorer une seule compétence en profondeur à chaque fois<br />\n- Idéal pour : des objectifs spécifiques, des cours de développement de compétences, des ateliers<br />\n- Mise en œuvre : un atelier entier consacré à une seule compétence (par ex. trois leçons de Discernement portant respectivement sur l'évaluation du produit, du processus et de la performance)<br />\n- Points forts : permet de maîtriser un domaine précis sans surcharge cognitive, autorise une exploration nuancée des techniques et des cas limites</p>\n<p>Méthode 4 : Les deux boucles<br />\n- L'approche la plus conceptuelle, traitant la maîtrise de l'IA comme des processus imbriqués<br />\n- Idéal pour : les étudiants qui maîtrisent déjà les fondamentaux et ont besoin d'une compréhension plus approfondie<br />\n- Structure : la boucle Délégation-Diligence (décisions stratégiques/éthiques) + la boucle Description-Discernement (travail tactique/itératif)<br />\n- Points forts : révèle comment les compétences s'influencent continuellement les unes les autres dans la pratique</p>\n<p>Boucle Délégation-Diligence = le cadre de prise de décision stratégique et éthique pour une collaboration responsable avec l'IA</p>\n<p>Composants de la boucle :<br />\nDélégation = Conscience du problème + Conscience de la plateforme + Délégation de la tâche<br />\nDiligence = Diligence de création + Diligence de transparence + Diligence de déploiement</p>\n<p>Flux bidirectionnel :<br />\nSens direct (Délégation → Diligence) : les décisions stratégiques soulèvent des questions éthiques<br />\nSens inverse (Diligence → Délégation) : les contraintes éthiques clarifient et améliorent les choix stratégiques</p>\n<p>Stratégies d'enseignement :<br />\n- Des scénarios d'application rendent les liens visibles<br />\n- Fournir des guides étape par étape pour les deux sens<br />\n- Reconnaître que les contraintes renforcent la créativité plutôt que de la limiter<br />\n- Se concentrer sur la fourniture d'une justification claire des choix</p>\n<p>Boucle Description-Discernement = les techniques du moment présent pour construire un environnement cognitif propice à la collaboration humain-IA</p>\n<p>Concept central : c'est une conversation, pas une commande — construire un contexte et une compréhension partagés, plutôt qu'un simple échange de prompt unique</p>\n<p>Environnement cognitif = le contexte collaboratif, comprenant :<br />\n- Un vocabulaire et des références partagés qui évoluent avec le temps<br />\n- Des objectifs, valeurs, processus et méthodes clairement définis<br />\n- Des schémas d'interaction établis qui permettent d'atteindre la meilleure performance<br />\n- Des mécanismes qui s'appuient sur les interactions précédentes</p>\n<p>Trois perspectives :<br />\nProduit = ce que nous créons ensemble (une compréhension évolutive des objectifs et de la qualité)<br />\nProcessus = l'approche partagée de la réflexion et de la résolution de problèmes<br />\nPerformance = la dynamique relationnelle entre l'humain et l'IA</p>\n<p>Stratégies d'enseignement :<br />\n- Des exercices à interactions multiples qui exigent de construire progressivement le contexte<br />\n- Partager son propre processus de collaboration avec l'IA en tant que formateur<br />\n- Documenter l'évolution de la collaboration, et pas seulement le résultat<br />\n- Passer de l'automatisation à l'augmentation</p>\n<p>Indicateurs de réussite :<br />\n- Langage partagé : références abrégées à des idées complexes issues de conversations antérieures<br />\n- État d'esprit exploratoire : évolution de commandes rigides vers une approche flexible et interactive</p>\n<p>Systèmes imbriqués = comment les deux boucles fonctionnent ensemble :<br />\nBoucle Délégation-Diligence = le contenant stratégique qui fixe la direction et les limites<br />\nBoucle Description-Discernement = le contenu tactique qui remplit le contenant d'une interaction riche<br />\nRésultat = une collaboration avec l'IA responsable et mature qui dépasse ce que chaque partie pourrait accomplir seule</p>\n<p>Durée du cours = 2 heures (30 minutes de vidéo, 90 minutes d'exercices)</p>\n<p>Structure des exercices = 3 exercices progressifs qui développent la capacité d'enseignement :<br />\n1) Établir le contexte d'enseignement et explorer les méthodes (30 minutes)<br />\n2) Concevoir une leçon sur la boucle Délégation-Diligence (30 minutes)<br />\n3) Concevoir une leçon sur la boucle Description-Discernement (30 minutes)</p>\n<hr />", "id": "c6-0"}, {"level": 3, "title": "Évaluer et concevoir la maîtrise de l'IA", "children": [], "html": "", "id": "c6-1"}, {"level": 1, "title": "Notes sur l'évaluation et la conception de la maîtrise de l'IA", "children": [{"level": 2, "title": "Cadre d'évaluation fondamental", "children": [], "html": "<p>Évaluation de la maîtrise de l'IA = une combinaison d'évaluation fondée sur le résultat + évaluation fondée sur le processus + évaluation fondée sur la réflexion</p>\n<p><strong>Évaluation fondée sur le résultat</strong> = se concentre sur ce que les étudiants produisent grâce à la collaboration avec l'IA. Évalue si les étudiants ont atteint leurs objectifs déclarés par la collaboration humain-IA.</p>\n<p><strong>Évaluation fondée sur le processus</strong> = examine comment les étudiants collaborent avec l'IA au fil du temps. Capture les schémas d'itération, la capacité à se relever d'un échec, et la maturité de leur approche.</p>\n<p><strong>Évaluation fondée sur la réflexion</strong> = se concentre sur la conscience métacognitive. Les étudiants analysent pourquoi les stratégies ont réussi ou échoué, ce qu'ils ont appris, et les applications futures.</p>", "id": "c6-2-0"}, {"level": 2, "title": "Évaluer les 4D", "children": [{"level": 3, "title": "Évaluation de la Délégation", "children": [], "html": "<ul>\n<li><strong>Résultat</strong> : Le plan de délégation est-il solide ? Les objectifs sont-ils réalistes ? Les choix d'outils sont-ils corrects ?</li>\n<li><strong>Processus</strong> : Examiner des journaux de conversation annotés montrant l'exploration des options et le processus de prise de décision</li>\n<li><strong>Réflexion</strong> : Les étudiants expliquent leurs choix, les alternatives envisagées, et comment la délégation a influencé le résultat final</li>\n</ul>", "id": "c6-2-1-0"}, {"level": 3, "title": "Évaluation de la Description", "children": [], "html": "<ul>\n<li><strong>Résultat</strong> : La qualité des prompts et des réponses de l'IA. Les instructions sont-elles claires ? Le contexte est-il suffisant ? L'évolution de la première version à la version finale</li>\n<li><strong>Processus</strong> : Les enregistrements de conversation montrant un raffinement itératif, les tentatives échouées, et le processus de construction d'un contexte partagé</li>\n<li><strong>Réflexion</strong> : Analyser quelles techniques de description ont été les plus efficaces, les approches de communication propres à des tâches spécifiques, et la relation entre la qualité de la description et la qualité du résultat</li>\n</ul>", "id": "c6-2-1-1"}, {"level": 3, "title": "Évaluation du Discernement", "children": [], "html": "<ul>\n<li><strong>Résultat</strong> : Les étudiants annotent le résultat de l'IA, en indiquant les points forts et faibles. Des journaux de décision expliquent ce qui a été conservé/modifié/écarté</li>\n<li><strong>Processus</strong> : Commentaires d'évaluation en ligne, détection/correction des erreurs, reconnaissance de schémas à travers les interactions</li>\n<li><strong>Réflexion</strong> : Analyser les évolutions des critères d'évaluation, les problèmes initialement manqués, et les comparaisons entre différents types de tâches</li>\n</ul>", "id": "c6-2-1-2"}, {"level": 3, "title": "Évaluation de la Diligence", "children": [], "html": "<ul>\n<li><strong>Résultat</strong> : La qualité des déclarations de diligence, la documentation d'attribution/de transparence, les preuves de vérification des faits</li>\n<li><strong>Processus</strong> : La gestion des données dans les journaux de conversation, les décisions éthiques, la gestion des informations sensibles, la vérification des contraintes</li>\n<li><strong>Réflexion</strong> : Discuter des dilemmes éthiques, de la compréhension de la responsabilité, des difficultés inattendues, des améliorations futures</li>\n</ul>", "id": "c6-2-1-3"}], "html": "", "id": "c6-2-1"}, {"level": 2, "title": "Principes de conception des exercices", "children": [], "html": "<p><strong>Authenticité</strong> = créer des exercices qui simulent une collaboration réelle avec l'IA, résolvant de vrais problèmes où la collaboration avec l'IA apporte une valeur ajoutée</p>\n<p><strong>Itération</strong> = intégrer des occasions de raffinement qui démontrent une progression dans le temps</p>\n<p><strong>Transparence pédagogique</strong> = évaluer explicitement le processus collaboratif et la réflexion, pas seulement le résultat final</p>", "id": "c6-2-2"}, {"level": 2, "title": "Types d'exercices", "children": [{"level": 3, "title": "Exercices fondés sur le résultat", "children": [], "html": "<ul>\n<li><strong>Améliorer un résultat de l'IA</strong> : Transformer un résultat médiocre de l'IA en un travail excellent</li>\n<li><strong>Comparaison de produits</strong> : Utiliser plusieurs systèmes d'IA pour la même tâche, analyser les différences</li>\n<li><strong>Défis à contraintes</strong> : Répondre à des exigences spécifiques (format, longueur, style, public)</li>\n<li><strong>Revue de produit entre pairs</strong> : Les étudiants fixent des objectifs, co-créent avec l'IA, puis échangent et critiquent le travail des autres</li>\n</ul>", "id": "c6-2-3-0"}, {"level": 3, "title": "Exercices fondés sur le processus", "children": [], "html": "<ul>\n<li><strong>Journaux de conversation annotés</strong> : Les étudiants signalent les tournants, les percées, et les moments clés de reprise après un échec</li>\n<li><strong>Enregistrement d'écran avec commentaire</strong> : Expliquer en temps réel le processus de prise de décision en travaillant avec l'IA</li>\n<li><strong>Manuel de processus</strong> : Un guide personnel de stratégie IA pour différents types de tâches</li>\n<li><strong>Débriefings assistés par l'IA/entre pairs</strong> : Discuter des journaux de conversation avec l'IA ou avec un pair</li>\n</ul>", "id": "c6-2-3-1"}, {"level": 3, "title": "Exercices fondés sur la réflexion", "children": [], "html": "<ul>\n<li><strong>Questionnement guidé</strong> : Poser des questions spécifiques pour un exercice donné</li>\n<li><strong>Journal d'apprentissage</strong> : Auto-évaluer le développement des 4D à travers des preuves recueillies sur l'ensemble du cours</li>\n<li><strong>Scénarios/études de cas</strong> : Appliquer les apprentissages à des scénarios hypothétiques ou réels</li>\n<li><strong>Déclaration de stratégie personnelle</strong> : Développer ses propres valeurs/stratégie de collaboration avec l'IA</li>\n</ul>", "id": "c6-2-3-2"}], "html": "", "id": "c6-2-3"}, {"level": 2, "title": "Gérer la charge de travail", "children": [], "html": "<p><strong>Grilles d'évaluation détaillées des livrables</strong> = des livrables clairs et granulaires qui facilitent une vérification rapide</p>\n<p><strong>Privilégier l'auto-évaluation et l'évaluation entre pairs</strong> = avec un accompagnement approprié, les étudiants sont les mieux placés pour observer leur propre progression</p>\n<p><strong>Conférences éclair</strong> = de brefs échanges remplaçant les retours écrits (discussions de 5 minutes)</p>\n<p><strong>Échantillonnage sélectif</strong> = il n'est pas nécessaire de tout lire ; les étudiants signalent les moments clés à examiner</p>", "id": "c6-2-4"}, {"level": 2, "title": "Artefacts d'évaluation clés", "children": [], "html": "<p><strong>Journaux de conversation</strong> = la documentation principale du processus<br />\n<strong>Déclarations de diligence</strong> = documentation de transparence et d'attribution<br />\n<strong>Journaux d'apprentissage</strong> = réflexion et développement métacognitif<br />\n<strong>Journaux de décision</strong> = documentent quels résultats de l'IA ont été conservés/modifiés/écartés<br />\n<strong>Manuels de processus</strong> = documentation de stratégie personnelle</p>", "id": "c6-2-5"}, {"level": 2, "title": "Domaines d'attention pour l'évaluation", "children": [{"level": 3, "title": "Guide des composants d'exercices sur la maîtrise de l'IA", "children": [], "html": "<p>Composants des exercices sur la maîtrise de l'IA</p>\n<p>Composants fondés sur le résultat</p>\n<p>Améliorer un résultat de l'IA = les étudiants transforment un résultat médiocre de l'IA en un travail excellent grâce à la critique et à l'itération<br />\n- Focus d'évaluation : Discernement, Description<br />\n- Livrables : version originale annotée + version améliorée<br />\n- Pourquoi cela fonctionne : force l'établissement de normes de qualité claires, exige l'application de connaissances du domaine, développe les compétences de guidage de l'IA<br />\n- Variantes : différents types de défauts, échange d'amélioration entre pairs</p>\n<p>Comparaison de produits = les étudiants utilisent plusieurs systèmes d'IA pour la même tâche et analysent les différences<br />\n- Focus d'évaluation : Délégation, Discernement<br />\n- Livrables : plusieurs résultats + matrice de comparaison + rapport de recommandation<br />\n- Pourquoi cela fonctionne : développe la conscience des plateformes, cultive des compétences de sélection fondées sur des preuves, révèle les compromis<br />\n- Processus : utiliser un assistant IA standard + un système à capacités de raisonnement + un système spécialisé</p>\n<p>Défis à contraintes = répondre à des exigences spécifiques dans certaines limites grâce à la collaboration avec l'IA<br />\n- Focus d'évaluation : Description, Délégation<br />\n- Livrables : un produit final qui respecte toutes les contraintes<br />\n- Pourquoi cela fonctionne : développe une communication précise avec l'IA, révèle l'importance des spécifications, développe la résolution de problèmes sous contraintes<br />\n- Variantes : contraintes éthiques, contraintes contradictoires, pression temporelle</p>\n<p>Revue de produit entre pairs = évaluer le travail assisté par l'IA d'un pair au regard des objectifs et de l'éthique<br />\n- Focus d'évaluation : Discernement, Diligence<br />\n- Livrables : un formulaire de retour d'évaluation<br />\n- Critères : atteinte des objectifs, pertinence de l'usage de l'IA, qualité de la supervision humaine, adéquation de l'attribution de l'IA<br />\n- Variantes : évaluation à l'aveugle, conférences de groupe</p>\n<p>Composants fondés sur le processus</p>\n<p>Journaux de conversation annotés = soumettre des journaux de conversation complets avec des annotations détaillées<br />\n- Focus d'évaluation : Description, Discernement<br />\n- Marqueurs d'annotation : tournants, idées/percées, échecs/reprises, évolution de la communication, établissement d'un contexte partagé<br />\n- Pourquoi cela fonctionne : rend visible le processus de réflexion, capture le véritable processus de résolution de problèmes, révèle l'évolution de la communication<br />\n- Variantes : annotations centrées sur une compétence, comparaison de schémas</p>\n<p>Enregistrement d'écran avec commentaire = enregistrement d'écran accompagné d'un commentaire verbal en temps réel du processus de travail avec l'IA<br />\n- Focus d'évaluation : les 4D<br />\n- Contenu du commentaire : justification des choix, évaluation des réponses, alternatives envisagées, considérations éthiques<br />\n- Pourquoi cela fonctionne : capture le véritable processus de décision, révèle les connaissances tacites, montre la différence entre le travail réel et le travail rapporté<br />\n- Variantes : commentaire en binôme, comparaison avant/après</p>\n<p>Manuel de processus = un guide de référence personnel sur la stratégie de collaboration avec l'IA<br />\n- Focus d'évaluation : les 4D<br />\n- Comprend : guides de conversation, arbres de décision, listes de contrôle qualité, récupération après un écueil, lignes directrices éthiques<br />\n- Pourquoi cela fonctionne : encourage une documentation systématique, crée une ressource utile, développe la conscience métacognitive<br />\n- Variantes : manuel collaboratif, exigences spécifiques à la discipline</p>\n<p>Débriefing assisté par l'IA/par les pairs = analyse structurée de la collaboration avec l'IA depuis une perspective externe<br />\n- Focus d'évaluation : les 4D<br />\n- Contenu de l'analyse : schémas positifs, occasions manquées, points forts, axes d'amélioration<br />\n- Pourquoi cela fonctionne : offre une perspective externe, révèle les angles morts, encourage l'apprentissage entre pairs</p>\n<p>Composants fondés sur la réflexion</p>\n<p>Questionnement guidé = répondre à des questions spécifiques favorisant une réflexion approfondie<br />\n- Focus d'évaluation : varie selon la question<br />\n- Types de questions : moments de surprise, stratégies échouées, évolution de la communication, décisions éthiques<br />\n- Pourquoi cela fonctionne : cible des aspects précis de la maîtrise de l'IA, exige une réflexion fondée sur des preuves<br />\n- Variantes : adaptation disciplinaire, questions progressives</p>\n<p>Journal d'apprentissage = documentation continue du développement de la maîtrise de l'IA<br />\n- Focus d'évaluation : développement à long terme des 4D<br />\n- Entrées hebdomadaires : tentatives, réussites, difficultés, progrès de compétences, objectifs futurs<br />\n- Synthèses mensuelles : reconnaissance de schémas, fixation d'objectifs<br />\n- Variantes : journal multimédia, journal collaboratif, journal de conversation avec l'IA</p>\n<p>Scénarios et études de cas = appliquer les apprentissages de la maîtrise de l'IA à des scénarios réels<br />\n- Focus d'évaluation : Diligence, Délégation<br />\n- L'analyse comprend : décisions de délégation, considérations éthiques, plans d'action, atténuation des risques<br />\n- Pourquoi cela fonctionne : développe la pensée stratégique, cultive le raisonnement éthique, relie la théorie à la pratique<br />\n- Variantes : cas réels, scénarios spécifiques à la discipline, jeu de rôle avec parties prenantes</p>\n<p>Déclaration de stratégie personnelle = synthétiser les apprentissages en un cadre personnel de collaboration avec l'IA<br />\n- Focus d'évaluation : Diligence, évaluation holistique des 4D<br />\n- Composants : principes éthiques, critères de décision, normes de qualité, engagements de transparence, limites, stratégies d'apprentissage<br />\n- Pourquoi cela fonctionne : exige une synthèse approfondie, construit une identité professionnelle, crée une redevabilité<br />\n- Variantes : stratégie collaborative pour le travail de groupe</p>\n<p>Matrices d'évaluation</p>\n<p>Matrice d'évaluation de la Délégation :<br />\n- Performance solide = pensée stratégique sur le quand/pourquoi/comment collaborer avec l'IA<br />\n- Focus résultat : qualité de la répartition des tâches, pertinence du choix des outils, atteinte des objectifs<br />\n- Focus processus : documentation des décisions, exploration des plateformes, preuves d'adaptation<br />\n- Focus réflexion : analyse des choix, prise en compte des alternatives, évaluation de l'impact</p>\n<p>Matrice d'évaluation de la Description :<br />\n- Performance solide = communication efficace avec l'IA sur le résultat/le processus/le comportement<br />\n- Focus résultat : évolution du prompt, construction du contexte, clarté de la communication<br />\n- Focus processus : raffinement itératif, schémas de reprise, développement d'un vocabulaire partagé<br />\n- Focus réflexion : analyse de stratégie, identification de techniques, enseignements sur le contexte</p>\n<p>Matrice d'évaluation du Discernement :<br />\n- Performance solide = évaluation critique utilisant des critères nuancés et propres au domaine<br />\n- Focus résultat : qualité de l'annotation, profondeur de l'évaluation, jugement fondé sur des preuves<br />\n- Focus processus : détection des erreurs, cohérence, amélioration de la qualité dans le temps<br />\n- Focus réflexion : évolution des critères, analyse des problèmes manqués, compétences de méta-évaluation</p>\n<p>Matrice d'évaluation de la Diligence :<br />\n- Performance solide = intégration du raisonnement éthique tout au long de la collaboration<br />\n- Focus résultat : qualité de l'attribution, documentation de la transparence, preuves de vérification<br />\n- Focus processus : gestion des données, documentation des autorisations, vérification des contraintes<br />\n- Focus réflexion : discussion des dilemmes éthiques, compréhension de la responsabilité, articulation des valeurs</p>\n<p>Utiliser les matrices :<br />\n- Création de grilles d'évaluation : sélectionner le D pertinent, choisir le type d'évaluation, ajuster les indicateurs, définir les niveaux de performance<br />\n- Fournir un retour : utiliser les indicateurs pour guider l'évaluation, se référer aux marqueurs de performance solide<br />\n- Auto-évaluation des étudiants : partager les critères à l'avance, encourager l'identification autonome des preuves de compétence</p>\n<hr />", "id": "c6-2-6-0"}, {"level": 3, "title": "L'impact de l'IA sur votre discipline", "children": [], "html": "<p><strong>Vue d'ensemble du cours</strong><br />\n- Durée = 50+ minutes (vidéo de 20 minutes + exercices de 30 minutes + discussion hors ligne)<br />\n- Focus = l'impact de l'IA sur une discipline spécifique en termes de programme/pédagogie/évaluation<br />\n- Objectif = utiliser le cadre des 4D pour créer des applications de maîtrise de l'IA spécifiques à la discipline</p>\n<p><strong>Principes fondamentaux</strong><br />\nMaîtrise de l'IA = amplifier l'expertise humaine, pas la remplacer<br />\nConnaissance disciplinaire = le fondement permettant d'obtenir des résultats sans précédent grâce à la collaboration avec l'IA</p>\n<p><strong>Trois questions clés pour les diplômés</strong><br />\n1. Qu'est-ce qui sera automatisé ? = quelles tâches professionnelles routinières l'IA prendra en charge<br />\n2. Où se situe le potentiel de collaboration ? = dans quels domaines la collaboration humain-IA a le plus d'impact<br />\n3. Qui est responsable ? = comment gérer et rendre compte d'un travail réalisé de manière autonome par l'IA</p>\n<p><strong>Schémas de disruption de l'IA</strong><br />\nLa disruption n'est pas uniforme selon les disciplines<br />\n- Le programme peut rester stable tandis que les méthodes d'évaluation évoluent<br />\n- La pédagogie peut évoluer tandis que le contenu fondamental reste inchangé<br />\n- Certaines disruptions sont des occasions à saisir<br />\n- D'autres sont des problèmes à résoudre<br />\n- Votre expertise déterminera de quoi il s'agit</p>\n<p><strong>Trois types d'expertise pour répondre à l'IA</strong><br />\n1. Expertise disciplinaire = contenu du domaine, valeurs, méthodes, façons de penser<br />\n2. Expertise pédagogique = schémas de difficulté/de percée des étudiants, le parcours émotionnel de l'apprentissage<br />\n3. Expertise en évaluation = reconnaître une compréhension authentique, concevoir des évaluations pour un apprentissage en profondeur</p>\n<p><strong>Analyse de l'impact sur le programme</strong><br />\nTâches d'évaluation disciplinaire :<br />\n- Identifier les capacités d'automatisation de l'IA au sein du domaine<br />\n- Déterminer comment l'importance des concepts fondamentaux évolue avec l'IA<br />\n- Cartographier les améliorations liées à l'augmentation par l'IA en fonction des meilleures pratiques<br />\n- Se préparer à répondre à des questions comme « Pourquoi apprendre X si l'IA peut le faire ? »<br />\n- Définir comment guider efficacement les agents IA</p>\n<p><strong>Transformation pédagogique</strong><br />\nOpportunités d'augmentation :<br />\n- Tutorat personnalisé à grande échelle<br />\n- Simulations interactives<br />\n- Systèmes de retour instantané<br />\n- L'IA comme assistant pédagogique/partenaire d'apprentissage interactif</p>\n<p>Évaluation des risques :<br />\n- Distinguer l'IA qui augmente l'apprentissage de l'IA qui le diminue<br />\n- Identifier les schémas de collaboration enseignant-étudiant-IA qui libèrent le potentiel<br />\n- Déterminer quelles méthodes d'enseignement adopter et lesquelles éviter<br />\n- Prendre en compte la réalité selon laquelle les étudiants utiliseront l'IA de toute façon</p>\n<p><strong>Révolution de l'évaluation</strong><br />\nDéfis fondamentaux :<br />\n- Qu'évaluons-nous lorsque les étudiants peuvent générer une dissertation en quelques secondes ?<br />\n- Créer des évaluations qui valorisent la progression/créativité/capacité de résolution de problèmes de chacun<br />\n- Évaluer à la fois la performance assistée par l'IA et la performance purement humaine</p>\n<p>Tâches fondamentales :<br />\n- Identifier les manifestations d'un apprentissage authentique dans un travail assisté par l'IA<br />\n- Créer des exercices où les étudiants ne peuvent pas prendre de raccourcis avec l'IA<br />\n- Valoriser le processus/la progression, pas seulement le produit<br />\n- Déterminer où la collaboration avec l'IA renforce ou diminue les objectifs<br />\n- S'adapter à la réalité de l'usage de l'IA par les étudiants</p>\n<p><strong>Capacités humaines irremplaçables</strong><br />\n- Expertise du domaine<br />\n- Compréhension du contexte du monde réel<br />\n- Jugement dans des situations ambiguës<br />\n- Résolution créative de problèmes<br />\n- Raisonnement éthique<br />\n- Construction de relations</p>\n<p><strong>Appliquer les 4D à votre discipline</strong></p>\n<p><strong>DISCERNEMENT = capacité d'évaluation de la qualité</strong><br />\nÉtablir des normes de qualité :<br />\n- Aller au-delà des termes vagues, articuler clairement l'excellence<br />\n- Créer des grilles d'évaluation détaillées qui capturent des marqueurs de qualité plus profonds<br />\n- Documenter des normes que les étudiants peuvent intérioriser/appliquer</p>\n<p>Rassembler des travaux exemplaires :<br />\n- Analyser systématiquement des exemples avec les étudiants<br />\n- Rendre visibles les processus de réflexion des experts grâce à des guides d'annotation</p>\n<p>Diagnostiquer l'échec :<br />\n- Explorer en profondeur des exemples défectueux<br />\n- Comprendre les modes d'échec, en travail solitaire ou en collaboration avec l'IA</p>\n<p><strong>DESCRIPTION = Maîtriser la communication du domaine</strong><br />\nCartographier le paysage des produits de la discipline :<br />\n- Documenter précisément les principaux livrables du domaine<br />\n- Créer des modèles qui révèlent la logique sous-jacente<br />\n- Faire réaliser aux étudiants une rétro-ingénierie des livrables professionnels</p>\n<p>Révéler la pensée des experts :<br />\n- Rendre visibles les processus de résolution de problèmes des experts<br />\n- Documenter les micro-décisions et les itérations<br />\n- Créer des organigrammes de la pensée des experts</p>\n<p>Nommer les normes du domaine :<br />\n- Faire émerger les comportements qui définissent votre domaine<br />\n- Construire ensemble avec les étudiants des schémas de performance comportementale</p>\n<p><strong>DÉLÉGATION = Comprendre la décomposition du travail</strong><br />\nRévéler la structure du problème :<br />\n- Décomposer les défis en leurs éléments constitutifs<br />\n- Créer des diagrammes de structure de problème<br />\n- Cartographier les possibilités d'automatisation/d'augmentation/d'agents par l'IA</p>\n<p>Concevoir des arbres de décision :<br />\n- Créer un cadre définissant quand/comment impliquer l'IA<br />\n- Le construire à travers des études de cas pour rendre explicites les décisions de délégation</p>\n<p><strong>DILIGENCE = Incarner les valeurs du domaine</strong><br />\nCodifier les cadres éthiques :<br />\n- Définir les principes de « ne pas nuire » propres au domaine<br />\n- Construire des études de cas qui explorent les limites éthiques<br />\n- Créer une matrice de décision éthique</p>\n<p>Rendre explicites les normes de transparence :<br />\n- Documenter les attentes de divulgation propres au domaine<br />\n- Créer des modèles de divulgation de l'assistance par l'IA</p>\n<p>Co-créer des politiques de redevabilité :<br />\n- Établir les normes avec les étudiants plutôt que de les leur imposer<br />\n- Rédiger les politiques ensemble<br />\n- Développer des protocoles d'évaluation entre pairs</p>\n<p><strong>Bénéfices de la boucle de rétroaction</strong><br />\nLes étudiants capables d'articuler la qualité → peuvent mieux évaluer n'importe quel résultat<br />\nLes étudiants qui comprennent la méthode → peuvent guider efficacement n'importe quel processus<br />\nLes étudiants qui intériorisent l'éthique → peuvent naviguer de manière responsable dans n'importe quelle collaboration</p>\n<p><strong>Exercices</strong></p>\n<p><strong>Exercice 1 : Note de position sur l'impact de l'IA (40 minutes)</strong><br />\nÉtape 1 : Explorer le cours avec l'IA (10 minutes)<br />\nÉtape 2 : Analyse de la transformation de l'enseignement (10 minutes)<br />\nÉtape 3 : Restructuration de la stratégie d'évaluation (10 minutes)<br />\nÉtape 4 : Synthèse de la position (10 minutes)</p>\n<p><strong>Exercice 2 : Une discussion des 4D avec un collègue</strong><br />\nDiscussion sur le Discernement = « À quoi ressemble la qualité ? »<br />\nDiscussion sur la Description = « Comment communiquons-nous ? »<br />\nDiscussion sur la Délégation = « Quel travail allons-nous faire ? »<br />\nDiscussion sur la Diligence = « Quelles sont nos valeurs/normes ? »</p>\n<p><strong>Message final</strong><br />\nL'objectif ≠ préparer les étudiants à être remplacés par l'IA<br />\nL'objectif = préparer les étudiants à devenir irremplaçables<br />\nL'avenir a besoin de personnes capables de penser de manière critique, de communiquer clairement, de collaborer avec sagesse, et d'agir de manière responsable</p>\n<p>Expertise humaine + maîtrise de l'IA = le fondement pour prospérer dans un avenir augmenté par l'IA</p>\n<hr />", "id": "c6-2-6-1"}], "html": "<p>Se concentrer sur des <strong>actions observables et des artefacts concrets</strong>, plutôt que sur des suppositions quant à ce qui a été compris</p>\n<p>Différentes compétences se prêtent à différentes méthodes d'évaluation</p>\n<p>L'évaluation doit être une <strong>occasion d'apprentissage, pas seulement une mesure</strong></p>\n<p>Les étudiants doivent comprendre que l'on se préoccupe de <strong>la manière dont ils apprennent à collaborer avec l'IA</strong>, et pas seulement de ce qu'ils produisent</p>\n<p>Principe fondamental : rendre visible, par la documentation et la réflexion, le processus de prise de décision invisible</p>\n<hr />", "id": "c6-2-6"}], "html": "", "id": "c6-2"}]}]</script>
<script>
const COURSES = JSON.parse(document.getElementById('data').textContent);

// ---------- Build flat order (depth-first) for prev/next ----------
const flatOrder = [];
function walk(node, courseNum, courseTitle, trail){
  const entry = {id: node.id, title: node.title, courseNum, courseTitle, trail: trail.concat([node.title])};
  flatOrder.push(entry);
  node.children.forEach(c => walk(c, courseNum, courseTitle, entry.trail));
}
const nodeIndex = {}; // id -> {node, courseNum, courseTitle, trail}
function indexNode(node, courseNum, courseTitle, trail){
  const t = trail.concat([node.title]);
  nodeIndex[node.id] = {node, courseNum, courseTitle, trail: t};
  node.children.forEach(c => indexNode(c, courseNum, courseTitle, t));
}
COURSES.forEach(course => {
  course.tree.forEach(node => {
    walk(node, course.num, course.title, [course.title]);
    indexNode(node, course.num, course.title, [course.title]);
  });
});

// ---------- Render sidebar ----------
const treeEl = document.getElementById('tree');

function renderNodeRow(node, depth){
  const wrap = document.createElement('div');
  wrap.className = 'node';
  wrap.dataset.id = node.id;

  const row = document.createElement('button');
  row.className = 'node-row';
  row.style.paddingLeft = (8 + depth*4) + 'px';
  row.dataset.id = node.id;
  row.dataset.search = node.title.toLowerCase();

  const twist = document.createElement('span');
  twist.className = 'twist' + (node.children.length ? '' : ' empty');
  twist.textContent = node.children.length ? '▸' : '·';
  row.appendChild(twist);

  const label = document.createElement('span');
  label.textContent = node.title;
  row.appendChild(label);

  row.addEventListener('click', (e) => {
    if (node.children.length && e.target === twist) {
      wrap.classList.toggle('open');
    } else {
      selectNode(node.id);
      if (node.children.length) wrap.classList.add('open');
    }
  });

  wrap.appendChild(row);

  if (node.children.length){
    const childWrap = document.createElement('div');
    childWrap.className = 'node-children';
    node.children.forEach(c => childWrap.appendChild(renderNodeRow(c, depth+1)));
    wrap.appendChild(childWrap);
  }
  return wrap;
}

COURSES.forEach(course => {
  const block = document.createElement('div');
  block.className = 'course-block';
  block.dataset.course = course.num;

  const toggle = document.createElement('button');
  toggle.className = 'course-toggle';
  toggle.innerHTML = `<span class="num">${course.num}</span><span class="course-title-text">${course.title.replace(/^Le[çc]on\s*\d+\s*:\s*/i,'')}</span><span class="chev">▸</span>`;
  toggle.addEventListener('click', () => {
    block.classList.toggle('open');
    if (block.classList.contains('open')) selectCourseIntro(course.num);
  });
  block.appendChild(toggle);

  const childrenWrap = document.createElement('div');
  childrenWrap.className = 'course-children';
  course.tree.forEach(node => childrenWrap.appendChild(renderNodeRow(node, 0)));
  block.appendChild(childrenWrap);

  treeEl.appendChild(block);
});

// ---------- Content rendering ----------
const contentInner = document.getElementById('content-inner');
const breadcrumb = document.getElementById('breadcrumb');
let currentId = null;

function clearActive(){
  document.querySelectorAll('.node-row.active').forEach(el => el.classList.remove('active'));
}

function setActive(id){
  clearActive();
  const row = document.querySelector('.node-row[data-id="'+cssEscape(id)+'"]');
  if (row) row.classList.add('active');
}

function cssEscape(s){
  return s.replace(/([^a-zA-Z0-9_-])/g, '\\$1');
}

function selectCourseIntro(courseNum){
  const course = COURSES.find(c => c.num === courseNum);
  currentId = 'course-' + courseNum;
  clearActive();
  breadcrumb.innerHTML = `<b>${escapeHtml(course.title)}</b>`;
  let html = `<div class="page-kicker">Cours ${course.num}</div>`;
  html += `<h1 class="page-title">${escapeHtml(course.title)}</h1>`;
  if (course.introHtml && course.introHtml.trim()){
    html += `<div id="course-intro">${course.introHtml}</div>`;
  }
  html += `<div class="children-nav"><div class="label">Contenu du cours</div>`;
  course.tree.forEach(n => {
    html += `<a href="#" data-goto="${n.id}">${escapeHtml(n.title)}</a>`;
  });
  html += `</div>`;
  contentInner.innerHTML = html;
  attachGotoLinks();
  document.getElementById('content').scrollTop = 0;
  closeMobileSidebar();
}

function selectNode(id){
  const entry = nodeIndex[id];
  if (!entry) return;
  currentId = id;
  setActive(id);

  breadcrumb.innerHTML = entry.trail.map((t,i) => {
    const isLast = i === entry.trail.length -1;
    return (i>0 ? '<span class="sep">›</span>' : '') + (isLast ? `<b>${escapeHtml(t)}</b>` : escapeHtml(t));
  }).join('');

  let html = `<div class="page-kicker">Cours ${entry.courseNum}</div>`;
  html += `<h1 class="page-title">${escapeHtml(entry.node.title)}</h1>`;
  html += `<div class="node-html">${entry.node.html || '<p><em>Pas de contenu détaillé pour cette section — parcourez ses sous-sections ci-dessous.</em></p>'}</div>`;

  if (entry.node.children.length){
    html += `<div class="children-nav"><div class="label">Sous-sections</div>`;
    entry.node.children.forEach(c => {
      html += `<a href="#" data-goto="${c.id}">${escapeHtml(c.title)}</a>`;
    });
    html += `</div>`;
  }

  // pager
  const idx = flatOrder.findIndex(e => e.id === id);
  const prev = idx > 0 ? flatOrder[idx-1] : null;
  const next = idx >=0 && idx < flatOrder.length -1 ? flatOrder[idx+1] : null;
  html += `<div id="pager">`;
  if (prev){
    html += `<button class="pager-btn prev" data-goto="${prev.id}"><span class="pager-label">← Précédent</span><span class="pager-title">${escapeHtml(prev.title)}</span></button>`;
  } else {
    html += `<div class="pager-spacer"></div>`;
  }
  if (next){
    html += `<button class="pager-btn next" data-goto="${next.id}"><span class="pager-label">Suivant →</span><span class="pager-title">${escapeHtml(next.title)}</span></button>`;
  } else {
    html += `<div class="pager-spacer"></div>`;
  }
  html += `</div>`;

  contentInner.innerHTML = html;
  attachGotoLinks();
  document.getElementById('content').scrollTop = 0;
  ensureVisible(id);
  closeMobileSidebar();
}

function attachGotoLinks(){
  contentInner.querySelectorAll('[data-goto]').forEach(el => {
    el.addEventListener('click', (e) => {
      e.preventDefault();
      selectNode(el.dataset.goto);
    });
  });
}

function ensureVisible(id){
  let el = document.querySelector('.node[data-id="'+cssEscape(id)+'"]');
  while (el){
    if (el.classList.contains('node')) el.classList.add('open');
    el = el.parentElement ? el.parentElement.closest('.node') : null;
  }
  const row = document.querySelector('.node-row[data-id="'+cssEscape(id)+'"]');
  const courseBlock = row ? row.closest('.course-block') : null;
  if (courseBlock) courseBlock.classList.add('open');
  if (row) row.scrollIntoView({block:'nearest'});
}

function escapeHtml(s){
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

// ---------- Search ----------
const searchInput = document.getElementById('search');
searchInput.addEventListener('input', () => {
  const q = searchInput.value.trim().toLowerCase();
  document.querySelectorAll('.node-row').forEach(row => {
    const match = !q || row.dataset.search.includes(q);
    row.parentElement.classList.toggle('hidden-by-search', !match && !hasMatchingDescendant(row.parentElement, q));
  });
  document.querySelectorAll('.course-block').forEach(block => {
    if (!q){ block.classList.remove('hidden-by-search'); return; }
    const anyVisible = Array.from(block.querySelectorAll('.node-row')).some(r => r.dataset.search.includes(q));
    const titleMatch = block.querySelector('.course-title-text').textContent.toLowerCase().includes(q);
    block.classList.toggle('hidden-by-search', !anyVisible && !titleMatch);
    if ((anyVisible || titleMatch) && q) block.classList.add('open');
  });
});

function hasMatchingDescendant(nodeEl, q){
  if (!q) return true;
  const rows = nodeEl.querySelectorAll('.node-row');
  return Array.from(rows).some(r => r.dataset.search.includes(q));
}

// ---------- Mobile sidebar ----------
const sidebar = document.getElementById('sidebar');
const overlay = document.getElementById('overlay');
document.getElementById('hamburger').addEventListener('click', () => {
  sidebar.classList.add('mobile-open');
  overlay.classList.add('show');
});
overlay.addEventListener('click', closeMobileSidebar);
function closeMobileSidebar(){
  sidebar.classList.remove('mobile-open');
  overlay.classList.remove('show');
}

// ---------- Initial view ----------
document.getElementById('content-inner').innerHTML = `
  <div class="page-kicker">Bienvenue</div>
  <h1 class="page-title">Anthropic Academy — édition française</h1>
  <div class="node-html">
    <p>Traduction française des notes de cours du cluster <strong>Foundations &amp; Fluency</strong> de l'Anthropic Academy (6 cours) : Claude 101, AI Fluency (cadres et fondations), AI Fluency pour les enseignants, les étudiants, les associations, et l'enseignement de l'AI Fluency.</p>
    <p>Utilisez le panneau de gauche pour parcourir les cours et leurs leçons, ou la recherche pour trouver un sujet précis.</p>
  </div>
  <div class="children-nav"><div class="label">Cours disponibles</div>
    ${COURSES.map(c => `<a href="#" data-course-intro="${c.num}">${c.num}. ${escapeHtml(c.title.replace(/^Le[çc]on\s*\d+\s*:\s*/i,''))}</a>`).join('')}
  </div>
`;
document.querySelectorAll('[data-course-intro]').forEach(el => {
  el.addEventListener('click', (e) => {
    e.preventDefault();
    const num = parseInt(el.dataset.courseIntro, 10);
    const block = document.querySelector('.course-block[data-course="'+num+'"]');
    if (block) block.classList.add('open');
    selectCourseIntro(num);
  });
});
</script>
