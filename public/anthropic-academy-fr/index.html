 réduit la précision de la récupération.</p>\n<p>Solution : une étape de prétraitement qui ajoute des informations contextuelles à chaque chunk avant son insertion dans la base de données du retriever.</p>\n<p>Processus :<br />\n1. Prendre un chunk individuel + le document source d'origine.<br />\n2. L'envoyer au LLM (Claude) avec un prompt lui demandant de générer un contexte de situation.<br />\n3. Le LLM génère un bref contexte expliquant comment le chunk se rapporte à l'ensemble du document.<br />\n4. Concaténer le contexte généré avec le chunk d'origine = le « chunk contextualisé ».<br />\n5. Utiliser le chunk contextualisé comme entrée pour l'index vectoriel/BM25.</p>\n<p>Gestion des documents volumineux : si le document source est trop volumineux pour tenir dans un seul prompt, utiliser une stratégie de contexte sélectif :<br />\n- Inclure les premiers chunks (1 à 3) au début du document pour le résumé/aperçu général.<br />\n- Inclure les chunks précédant le chunk cible pour un contexte local.<br />\n- Ignorer les chunks du milieu qui apportent un contexte moins pertinent.</p>\n<p>Implémentation : la fonction <code>add_context</code> prend un chunk de texte + le texte source, génère le contexte via le LLM, concatène le contexte avec le chunk d'origine, et renvoie la version contextualisée.</p>\n<p>Avantages : les chunks conservent leur lien avec la structure globale du document et les renvois croisés, ce qui améliore la précision de la récupération pour les documents complexes comportant des sections interdépendantes.</p>\n<hr />", "id": "c1-41"}, {"level": 3, "title": "Extended Thinking", "children": [], "html": "<p>Extended Thinking = une fonctionnalité de Claude qui lui permet de raisonner avant de générer la réponse finale.</p>\n<p>Mécanismes clés :<br />\n- Affiche un processus de réflexion distinct, visible par l'utilisateur.<br />\n- Améliore la précision sur les tâches complexes mais augmente le coût (vous payez pour les tokens de réflexion) et la latence.<br />\n- <code>thinking budget</code> = un minimum de 1024 tokens alloués pour la phase de réflexion.<br />\n- <code>max_tokens</code> doit dépasser le thinking budget (par exemple, pour un budget de 1024, <code>max_tokens</code> ≥ 1025).</p>\n<p>Quand l'utiliser :<br />\n- L'activer après que l'optimisation du prompt n'a pas permis d'atteindre la précision souhaitée.<br />\n- Utiliser l'évaluation de prompt pour déterminer sa nécessité.</p>\n<p>Structure de la réponse :<br />\n- Bloc <code>thinking</code> = contient le texte du raisonnement + une signature chiffrée.<br />\n- Bloc <code>text</code> = la réponse finale.<br />\n- La signature = empêche toute altération du texte de réflexion (une mesure de sécurité).</p>\n<p>Cas particulier :<br />\n- Bloc de réflexion expurgé (Redacted thinking block) = un texte de réflexion chiffré signalé par le système de sécurité.<br />\n- Fourni pour maintenir la continuité de la conversation sans perdre le contexte.<br />\n- Un bloc expurgé peut être forcé à l'aide d'une chaîne de test : « entropic magic string triggered redacted thinking [caractères spéciaux] ».</p>\n<p>Implémentation :<br />\n- Définir les paramètres <code>thinking=true</code> et <code>thinking_budget</code>.<br />\n- S'assurer que <code>max_tokens</code> &gt; <code>thinking_budget</code> pour garantir une capacité suffisante pour la génération de la réponse.</p>\n<hr />", "id": "c1-42"}, {"level": 3, "title": "Prise en charge des images", "children": [], "html": "<p>Capacités de vision de Claude = traiter des images dans les messages utilisateur pour des tâches d'analyse, de comparaison, de comptage et de description.</p>\n<p>Limites concernant les images :<br />\n- Jusqu'à 100 images par requête.<br />\n- Il existe des limites de taille/dimension.<br />\n- Les images consomment des tokens (facturés selon la hauteur/largeur en pixels).</p>\n<p>Structure d'un bloc image = un type de bloc spécial dans un message utilisateur qui contient les données d'image brutes (<code>base64</code>) ou une référence URL pour une image en ligne. Plusieurs blocs image sont autorisés par message.</p>\n<p>Facteur clé de réussite = des techniques de prompting solides sont nécessaires pour obtenir des résultats précis. Les prompts simples échouent souvent.</p>\n<p>Techniques de prompting pour les images :<br />\n- Instructions d'analyse étape par étape.<br />\n- Exemples one-shot/multi-shot (paires alternées d'image et de texte).<br />\n- Directives claires et étapes de validation.<br />\n- Un cadre d'analyse structuré.</p>\n<p>Exemple de cas d'usage = évaluer automatiquement le risque d'incendie à partir d'images satellite, en analysant la densité des arbres, l'accès à la propriété, les débords de toiture, et en attribuant un score de risque numérique.</p>\n<p>Implémentation = encoder les données de l'image en <code>base64</code>, créer un message contenant un bloc image (<code>type: image</code>, <code>source: base64</code>, <code>media_type</code>, <code>data</code>), suivi d'un bloc de texte contenant des instructions de prompting détaillées.</p>\n<p>Enseignement central = la précision sur les images dépend entièrement de la sophistication du prompt, et pas seulement de la qualité de l'image.</p>\n<hr />", "id": "c1-43"}, {"level": 3, "title": "Prise en charge des PDF", "children": [], "html": "<p>Prise en charge des PDF dans Claude :</p>\n<p>Claude peut lire directement des fichiers PDF en utilisant un code similaire au traitement d'images.</p>\n<p>Principaux changements d'implémentation :<br />\n- Type de fichier = \"document\" au lieu de \"image\".<br />\n- Type de média = \"application/pdf\" au lieu de \"image/png\".<br />\n- Nommage de la variable = <code>file_bytes</code> au lieu de <code>image_bytes</code>.</p>\n<p>Capacités PDF de Claude = lecture de texte + images + graphiques + tableaux + extraction de contenu mixte.</p>\n<p>Traitement des PDF = une solution tout-en-un pour une analyse complète des documents.</p>\n<p>Pattern d'usage = le même que pour l'entrée image, mais en utilisant des paramètres spécifiques aux documents.</p>\n<hr />", "id": "c1-44"}, {"level": 3, "title": "Citations", "children": [], "html": "<p>Citations = une fonctionnalité qui permet à Claude de citer des documents source et de montrer d'où provient une information.</p>\n<p>Types de citations :<br />\n- <code>citation_page_location</code> = pour les documents PDF, indiquant l'index/le titre/la page de début/la page de fin/le texte cité du document.<br />\n- <code>citation_char_location</code> = pour le texte brut, indiquant la position du caractère dans un bloc de texte.</p>\n<p>Implémentation :<br />\n- Ajouter <code>\"citations\": {\"enabled\": true}</code> à la requête.<br />\n- Ajouter un champ « title » pour identifier le document source.<br />\n- Fonctionne à la fois pour les fichiers PDF et les sources en texte brut.</p>\n<p>Structure de la réponse = <code>content</code> devient une liste de blocs de texte, dont certains contiennent un tableau <code>citations</code> avec les données de localisation.</p>\n<p>Objectif = offrir de la transparence pour permettre aux utilisateurs de vérifier la source de l'information fournie par Claude et de contrôler l'exactitude de son interprétation.</p>\n<p>Avantage pour l'interface = lorsqu'un utilisateur survole un contenu cité, une infobulle/superposition de citation peut être affichée, montrant le document source, le numéro de page et le texte exact cité.</p>\n<p>Cas d'usage clé = garantit que les utilisateurs peuvent examiner comment Claude a construit une réponse à partir du matériau source, plutôt que de donner l'impression de parler de mémoire, sans fondement.</p>\n<hr />", "id": "c1-45"}, {"level": 3, "title": "Prompt Caching", "children": [], "html": "<p>Prompt Caching = une fonctionnalité qui accélère les réponses de Claude et réduit le coût de génération de texte en réutilisant le travail de calcul d'une requête précédente.</p>\n<p>Flux de requête normal : l'utilisateur envoie un message → Claude traite l'entrée (création de structures de données internes, exécution de calculs) → Claude génère une sortie → Claude rejette tout le travail de traitement → prêt pour la requête suivante.</p>\n<p>Problème : lorsqu'une requête ultérieure contient les mêmes messages en entrée, Claude doit répéter tout le travail de calcul qu'il venait de rejeter, ce qui est inefficace.</p>\n<p>Solution : le prompt caching stocke les résultats du traitement des messages d'entrée dans un cache temporaire plutôt que de les rejeter. Lorsque la même entrée apparaît dans une requête ultérieure, Claude récupère le travail mis en cache plutôt que de le retraiter, ce qui accélère considérablement la génération de la réponse.</p>\n<p>Principal avantage : réutilise le travail de calcul précédent pour éviter un traitement redondant du contenu répété.</p>\n<hr />", "id": "c1-46"}, {"level": 3, "title": "Règles du Prompt Caching", "children": [], "html": "<p>Prompt Caching = un système qui sauvegarde le travail de traitement d'une requête initiale afin qu'il puisse être réutilisé dans des requêtes ultérieures ayant un contenu identique.</p>\n<p>Mécanisme central : requête initiale → Claude traite + sauvegarde le travail dans le cache → une requête ultérieure a un contenu identique → Claude récupère le travail depuis le cache plutôt que de le retraiter.</p>\n<p>Durée du cache = jusqu'à 1 heure.</p>\n<p>L'activation du cache nécessite d'ajouter manuellement un <code>cache breakpoint</code> (point de rupture de cache) aux blocs de message.</p>\n<p>Format des blocs de texte :<br />\n- Forme abrégée : <code>content = \"chaîne de texte\"</code> (impossible d'ajouter un contrôle de cache).<br />\n- Forme complète : <code>content = [{\"type\": \"text\", \"text\": \"contenu\", \"cache_control\": {...}}]</code> (requise pour la mise en cache).</p>\n<p>Portée du cache = tout ce qui précède le point de rupture, inclus, est mis en cache.</p>\n<p>Invalidation du cache = toute modification du contenu situé avant le point de rupture invalide l'intégralité du cache.</p>\n<p>Ordre de traitement du contenu = outils → prompt système → messages (concaténés ensemble).</p>\n<p>Options de placement du point de rupture de cache :<br />\n- Schéma d'outil.<br />\n- Prompt système.<br />\n- Blocs de message (texte, image, utilisation d'outil, résultat d'outil).</p>\n<p>Jusqu'à 4 points de rupture par requête.</p>\n<p>Plusieurs points de rupture = créent plusieurs couches de cache, permettant potentiellement des hits de cache partiels si seul le contenu ultérieur change.</p>\n<p>Seuil minimal de mise en cache = le contenu doit atteindre 1024 tokens pour être mis en cache.</p>\n<p>Meilleur cas d'usage = un contenu strictement identique entre les requêtes (prompt système, définitions d'outils, préfixes de message statiques).</p>\n<hr />", "id": "c1-47"}, {"level": 3, "title": "Le Prompt Caching en pratique", "children": [], "html": "<p>Implémentation du prompt caching = mettre automatiquement en cache les schémas d'outils et le prompt système afin de réduire la consommation de tokens.</p>\n<p>Configuration = modifier la fonction <code>chat</code> pour activer la mise en cache par défaut pour les outils et le prompt système.</p>\n<p>Mise en cache du schéma d'outil = ajouter un champ <code>cache_control</code> (de type \"ephemeral\") au dernier outil de la liste. Bonne pratique : créer une copie de la liste des outils, cloner le schéma du dernier outil, y ajouter le contrôle de cache, puis l'écraser, afin d'éviter de modifier le schéma d'origine.</p>\n<p>Mise en cache du prompt système = envelopper le prompt système dans un dictionnaire de bloc de texte avec un <code>cache_control</code> de type \"ephemeral\".</p>\n<p>Plusieurs points de rupture de cache = vous pouvez définir des points de cache à la fois pour les outils et pour le prompt système au sein d'une même requête.</p>\n<p>Ordre du cache = outils → prompt système → messages.</p>\n<p>Modèles de consommation de tokens :<br />\n- <code>cache_creation_input_tokens</code> = tokens écrits dans le cache lors de la première utilisation.<br />\n- <code>cache_read_input_tokens</code> = tokens lus depuis le cache lors de requêtes identiques ultérieures.<br />\n- Une lecture de cache partielle peut se produire lorsqu'une partie du contenu correspond aux données mises en cache.</p>\n<p>Invalidation du cache = toute modification du contenu mis en cache (outils ou prompt système) invalide le cache, forçant la création d'un nouveau cache.</p>\n<p>Cas d'usage = un contenu qui reste identique entre les requêtes - schémas d'outils identiques, prompts système identiques, ou séquences de messages identiques.</p>\n<hr />", "id": "c1-48"}, {"level": 3, "title": "Exécution de code et l'API Files", "children": [], "html": "<p><code>Files API</code> = permet de téléverser des fichiers à l'avance et de les référencer ultérieurement par un identifiant de fichier, plutôt que d'inclure les données brutes du fichier dans chaque requête. Téléverser un fichier → obtenir un objet de métadonnées de fichier avec un identifiant → utiliser cet identifiant dans les requêtes futures.</p>\n<p><code>Code Execution</code> = un outil côté serveur permettant à Claude d'exécuter du code Python dans un conteneur <code>Docker</code> isolé. Aucune implémentation n'est requise - il suffit d'inclure le schéma d'outil prédéfini. Claude peut exécuter du code plusieurs fois, interpréter les résultats, et produire une réponse finale.</p>\n<p>Limite clé : le conteneur <code>Docker</code> n'a pas d'accès réseau. L'entrée/sortie des données repose sur l'intégration avec la <code>Files API</code>.</p>\n<p>Flux de travail combiné : téléverser un fichier via la <code>Files API</code> → obtenir l'identifiant du fichier → inclure cet identifiant dans un bloc d'upload de conteneur → demander à Claude d'effectuer une analyse → Claude écrit/exécute du code pouvant accéder au fichier téléversé → renvoie l'analyse et les résultats.</p>\n<p>Claude peut générer des fichiers (comme des graphiques ou des rapports) à l'intérieur du conteneur, et ces fichiers peuvent être téléchargés via un identifiant de fichier renvoyé dans la réponse.</p>\n<p>Cas d'usage : analyse de données, traitement de fichiers, génération de code automatisée pour des tâches complexes. La réponse contient des blocs de code, des résultats d'exécution, et une analyse finale.</p>\n<p>Implémentation : utiliser un bloc d'upload de conteneur avec l'identifiant du fichier, inclure un prompt d'analyse, et Claude gère automatiquement l'exécution du code.</p>\n<hr />", "id": "c1-49"}, {"level": 3, "title": "Introduction au MCP", "children": [], "html": "<p>MCP = <code>Model Context Protocol</code>, une couche de communication qui fournit à Claude du contexte et des outils sans exiger que les développeurs écrivent du code fastidieux.</p>\n<p>Architecture : un <code>client MCP</code> se connecte à un <code>serveur MCP</code>. Le serveur contient en interne des outils, des ressources et des prompts en tant que composants.</p>\n<p>Problème résolu : il élimine la charge d'écrire/maintenir un grand nombre de schémas d'outils et de fonctions pour l'intégration de services. Par exemple : un chatbot GitHub devrait implémenter des outils pour les dépôts, les pull requests, les issues et les projets - ce qui demande beaucoup d'efforts de développement.</p>\n<p>Solution : le serveur <code>MCP</code> gère la définition et l'exécution des outils, plutôt que votre serveur applicatif. Serveur <code>MCP</code> = une interface vers un service externe qui encapsule des fonctionnalités sous forme d'outils prêts à l'emploi.</p>\n<p>Principal avantage : les développeurs n'ont pas à écrire eux-mêmes les schémas d'outils et les implémentations de fonctions.</p>\n<p>Questions fréquentes :<br />\n- Qui crée les serveurs <code>MCP</code> ? N'importe qui peut le faire, et généralement le fournisseur du service propose une implémentation officielle (comme AWS, etc.).<br />\n- Par rapport aux appels API directs ? <code>MCP</code> vous évite d'avoir à écrire vous-même les schémas/fonctions d'outils.<br />\n- Par rapport au tool calling ? <code>MCP</code> et le tool calling sont complémentaires - <code>MCP</code> détermine qui effectue le travail (le serveur vs. le développeur), mais les deux impliquent des outils.</p>\n<p>Valeur centrale : il déplace la charge d'intégration du développeur de l'application vers le mainteneur du serveur <code>MCP</code>.</p>", "id": "c1-50"}, {"level": 3, "title": "Client MCP", "children": [], "html": "<p>Client MCP = l'interface de communication entre votre serveur et le serveur <code>MCP</code>, qui donne accès aux outils du serveur.</p>\n<p>Agnostique au transport = le client et le serveur peuvent communiquer via plusieurs protocoles (<code>stdio</code>, <code>HTTP</code>, <code>WebSockets</code>).</p>\n<p>Configuration courante = le client et le serveur s'exécutent sur la même machine, en utilisant l'entrée/sortie standard.</p>\n<p>Communication = échange de messages défini par la spécification <code>MCP</code>.</p>\n<p>Types de messages clés :<br />\n- Requête <code>list tools</code> = le client demande au serveur la liste des outils disponibles.<br />\n- Résultat <code>list tools</code> = le serveur répond avec la liste des outils.<br />\n- Requête <code>call tool</code> = le client demande au serveur d'exécuter un outil avec des arguments.<br />\n- Résultat <code>call tool</code> = le serveur répond avec le résultat de l'exécution de l'outil.</p>\n<p>Flux typique :<br />\n1. L'utilisateur interroge le serveur.<br />\n2. Le serveur demande la liste des outils au client <code>MCP</code>.<br />\n3. Le client <code>MCP</code> envoie une requête <code>list tools</code> au serveur <code>MCP</code>.<br />\n4. Le serveur <code>MCP</code> répond avec un résultat <code>list tools</code>.<br />\n5. Le serveur envoie la requête ainsi que les outils à Claude.<br />\n6. Claude demande l'exécution d'un outil.<br />\n7. Le serveur demande au client <code>MCP</code> d'exécuter l'outil.<br />\n8. Le client <code>MCP</code> envoie une requête <code>call tool</code> au serveur <code>MCP</code>.<br />\n9. Le serveur <code>MCP</code> exécute l'outil (par exemple, un appel à l'API GitHub).<br />\n10. Le résultat remonte la chaîne : serveur <code>MCP</code> → client <code>MCP</code> → serveur → Claude → utilisateur.</p>\n<p>Objectif = permettre au serveur de déléguer l'exécution des outils à un serveur <code>MCP</code> spécialisé tout en conservant l'intégration avec Claude.</p>\n<hr />", "id": "c1-51"}, {"level": 3, "title": "Configuration du projet", "children": [], "html": "<p>Projet de chatbot en ligne de commande = enseigne l'interaction client-serveur <code>MCP</code> par la pratique.</p>\n<p>Composants du projet :<br />\n- Client <code>MCP</code> = se connecte à un serveur <code>MCP</code> personnalisé.<br />\n- Serveur <code>MCP</code> = fournit 2 outils (lire un document, modifier un document).<br />\n- Collection de documents = documents fictifs stockés uniquement en mémoire.</p>\n<p>Différence clé : un projet classique implémente soit le client, soit le serveur, mais pas les deux. Ce projet implémente les deux à des fins pédagogiques.</p>\n<p>Processus de configuration :<br />\n1. Téléchargez le code de démarrage <code>CLI_project.zip</code>.<br />\n2. Décompressez-le et ouvrez-le dans un éditeur de code.<br />\n3. Suivez les instructions de configuration dans <code>readme.md</code>.<br />\n4. Ajoutez votre clé API au fichier <code>.env</code>.<br />\n5. Installez les dépendances (avec ou sans UV).<br />\n6. Exécutez le projet : <code>uv run main.py</code> ou <code>python main.py</code>.<br />\n7. Testez-le avec des prompts de chat.</p>\n<p>Résultat attendu = une interface de chat fonctionnelle qui répond aux requêtes de base, prête à recevoir les fonctionnalités <code>MCP</code>.</p>\n<hr />", "id": "c1-52"}, {"level": 3, "title": "Définir des outils avec MCP", "children": [], "html": "<p>Lors de l'implémentation d'un serveur <code>MCP</code> avec le <code>Python SDK</code>, vous créez des outils via des décorateurs plutôt qu'en écrivant des schémas JSON à la main.</p>\n<p>MCP Python SDK = un package officiel qui génère automatiquement le schéma JSON d'un outil à partir de la définition d'une fonction Python, grâce au décorateur <code>@mcp.tool</code>.</p>\n<p>Syntaxe de définition d'un outil = <code>@mcp.tool(name=\"tool_name\", description=\"description\")</code> + une fonction avec des paramètres typés, en utilisant <code>Field()</code> pour décrire les paramètres.</p>\n<p>Les deux outils implémentés :<br />\n1. <code>read_doc_contents</code> = prend une chaîne <code>doc_id</code> en paramètre et renvoie le contenu du document depuis le dictionnaire <code>docs</code> en mémoire.<br />\n2. <code>edit_document</code> = prend les paramètres <code>doc_id</code>, <code>old_string</code> et <code>new_string</code> et effectue une opération de recherche/remplacement sur le contenu du document.</p>\n<p>Gestion des erreurs = vérifier si le <code>doc_id</code> existe dans le dictionnaire <code>docs</code> et lever une <code>ValueError</code> s'il n'est pas trouvé.</p>\n<p>Principal avantage = le SDK élimine le travail d'écriture manuelle des schémas JSON, en les générant automatiquement à partir des signatures de fonctions Python et des décorateurs.</p>\n<p>Imports requis = <code>Field</code> depuis <code>pydantic</code> pour les descriptions de paramètres, et le package <code>mcp</code> pour le serveur et les décorateurs d'outils.</p>\n<p>Modèle d'implémentation = le décorateur définit les métadonnées de l'outil, les paramètres de la fonction définissent les arguments de l'outil avec leurs types et descriptions, et le corps de la fonction contient la logique de l'outil.</p>\n<hr />", "id": "c1-53"}, {"level": 3, "title": "Inspecteur de serveur", "children": [], "html": "<p>MCP Inspector = un débogueur dans le navigateur permettant de tester des serveurs <code>MCP</code> sans les connecter à une application.</p>\n<p>Comment y accéder : exécutez <code>mcp dev [server_file.py]</code> dans le terminal → cela démarre le serveur sur un port → accédez à l'URL fournie dans le navigateur.</p>\n<p>Interface : un bouton de connexion dans la barre latérale gauche → un menu supérieur affichant les sections ressources/prompts/outils → la section outils liste les outils disponibles → cliquez sur un outil pour ouvrir une interface de test manuel dans le panneau de droite.</p>\n<p>Processus de test : connectez-vous au serveur → accédez aux outils → sélectionnez un outil spécifique → saisissez les arguments requis → cliquez sur run tool → vérifiez le résultat.</p>\n<p>Fonctionnalités clés : tests en direct pendant le développement, appels d'outils manuels, formulaires de saisie des paramètres, retour de succès/échec, tout cela sans intégration complète à une application.</p>\n<p>Remarque : l'interface évolue activement pendant le développement, mais les fonctionnalités de base restent similaires.</p>\n<p>Exemple d'utilisation : testez les outils de documents en saisissant un identifiant de document, vérifiez l'opération de lecture, testez l'opération de modification, puis enchaînez les opérations pour vérifier les changements.</p>\n<p>Principal avantage : déboguer efficacement votre implémentation de serveur <code>MCP</code> pendant la phase de développement.</p>\n<hr />", "id": "c1-54"}, {"level": 3, "title": "Implémenter le client", "children": [], "html": "<p>Implémentation du client MCP :</p>\n<p>Client MCP = une classe wrapper autour de la session client, pour le nettoyage des ressources et la gestion de la connexion avec le serveur <code>MCP</code>.</p>\n<p>Session client = la connexion réelle au serveur <code>MCP</code>, issue du <code>MCP Python SDK</code>, nécessitant un nettoyage des ressources à la fermeture.</p>\n<p>Objectif du client = exposer les fonctionnalités du serveur <code>MCP</code> au reste de la base de code, lui permettant de demander la liste des outils au serveur et d'exécuter des outils.</p>\n<p>Fonctions clés :<br />\n- <code>list_tools()</code> = <code>await self.session.list_tools()</code>, renvoie <code>result.tools</code>.<br />\n- <code>call_tool()</code> = <code>await self.session.call_tool(tool_name, tool_input)</code>.</p>\n<p>Flux d'utilisation = le client récupère les définitions des outils à envoyer à Claude, puis exécute ces outils lorsque Claude le demande.</p>\n<p>Modèle courant = encapsuler la session client dans une classe plus large pour la gestion des ressources, plutôt que d'utiliser directement la session.</p>\n<p>Test = vous pouvez exécuter directement le fichier client, en utilisant des outils de test pour vérifier la connexion au serveur et la récupération des outils.</p>\n<p>Intégration = le reste du code du projet appelle les fonctions du client pour interagir avec le serveur <code>MCP</code>, permettant à Claude d'inspecter/modifier des documents via les outils définis.</p>\n<hr />", "id": "c1-55"}, {"level": 3, "title": "Définir des ressources", "children": [], "html": "<p>Ressources MCP = un mécanisme permettant à un serveur <code>MCP</code> d'exposer des données au client pour des opérations de lecture.</p>\n<p>Types de ressources = deux types : direct (une <code>URI</code> statique, comme « docs://documents ») et paramétré (une <code>URI</code> paramétrée, comme « docs://documents/{doc_id} »).</p>\n<p><code>URI</code> = l'adresse/identifiant utilisé pour accéder à une ressource spécifique, défini lors de la création de la ressource.</p>\n<p>Flux des ressources = le client envoie une requête read resource avec une <code>URI</code> → le serveur associe l'<code>URI</code> à une fonction → le serveur exécute la fonction → il renvoie les données dans un résultat read resource.</p>\n<p>Implémentation = utiliser le décorateur <code>@mcp.resource</code> avec les paramètres <code>URI</code> et <code>MIME Types</code>.</p>\n<p><code>MIME Types</code> = une indication donnée au client sur le format des données renvoyées (<code>application/json</code> pour des données structurées, <code>text/plain</code> pour du texte brut).</p>\n<p>Ressources paramétrées = les paramètres de l'<code>URI</code> sont automatiquement analysés par le SDK et transmis en tant qu'arguments nommés à la fonction de traitement.</p>\n<p>Ressources vs. outils = les ressources fournissent activement des données (récupération du contenu d'un document lorsqu'il est mentionné avec @), tandis que les outils effectuent des actions de manière passive (lorsque Claude décide de les appeler).</p>\n<p>Renvoi des données = le SDK sérialise automatiquement les données renvoyées en une chaîne de caractères, et c'est au client de les désérialiser.</p>\n<p>Test = le <code>MCP</code> Inspector peut lister séparément les ressources directes et paramétrées, et permet de tester individuellement les appels aux ressources.</p>\n<hr />", "id": "c1-56"}, {"level": 3, "title": "Accéder aux ressources", "children": [], "html": "<p>Implémentation de l'accès aux ressources MCP :</p>\n<p>Fonction de lecture de ressource = une fonction du client utilisée pour demander et analyser une ressource depuis le serveur <code>MCP</code>.</p>\n<p>Argument de la fonction = <code>URI</code> (l'identifiant de la ressource).</p>\n<p>Étapes d'implémentation :<br />\n- Importer le module <code>json</code> ainsi que <code>AnyURL</code> depuis <code>pydantic</code>.<br />\n- Appeler <code>await self.session.read_resource(AnyURL(uri))</code>.<br />\n- Extraire le premier élément depuis <code>result.contents[0]</code>.<br />\n- Vérifier <code>resource.mime_type</code> pour déterminer la stratégie d'analyse.</p>\n<p>Logique d'analyse du contenu :<br />\n- Si <code>mime_type == \"application/json\"</code> → renvoyer <code>json.loads(resource.text)</code>.<br />\n- Sinon → renvoyer <code>resource.text</code> (texte brut).</p>\n<p>Structure de la réponse du serveur = une liste <code>result.contents</code> dont le premier élément contient les métadonnées <code>type/mime_type</code>.</p>\n<p>Intégration des ressources = la fonction du client <code>MCP</code> est appelée par d'autres composants de l'application pour récupérer le contenu des documents destiné aux prompts.</p>\n<p>Résultat final = le contenu du document est automatiquement inclus dans le prompt envoyé à Claude, sans appel d'outil.</p>\n<p>Point clé = les ressources exposent les informations du serveur directement au client via un modèle structuré de requête/réponse.</p>\n<hr />", "id": "c1-57"}, {"level": 3, "title": "Définir des prompts", "children": [], "html": "<p>Prompts MCP = des modèles de prompts prédéfinis et testés, qu'un serveur <code>MCP</code> expose aux applications clientes pour des tâches spécifiques.</p>\n<p>Objectif = l'auteur du serveur crée des prompts de haute qualité, évalués et adaptés au domaine de son serveur, plutôt que de laisser les utilisateurs écrire des prompts ad hoc.</p>\n<p>Implémentation = utiliser le décorateur <code>@mcpserver.prompt</code> avec un nom et une description, en définissant une fonction qui renvoie une liste de messages (messages utilisateur/assistant pouvant être envoyés directement à Claude).</p>\n<p>Exemple de cas d'usage = un prompt de mise en forme de document qui prend un identifiant de document et demande à Claude d'utiliser un outil pour lire le document, le reformater en markdown, puis enregistrer les modifications.</p>\n<p>Principaux avantages = une expertise spécifique au serveur, une qualité pré-testée, une réutilisabilité entre applications clientes, et de meilleurs résultats que des prompts générés par les utilisateurs.</p>\n<p>Structure des messages = renvoie des objets <code>base.UserMessage</code> contenant le texte du prompt formaté (avec les arguments interpolés).</p>\n<p>Intégration côté client = les prompts apparaissent comme des options d'autocomplétion (commandes slash) dans l'application cliente, invitant l'utilisateur à fournir les arguments requis, puis exécutant le workflow de prompt préconstruit.</p>\n<hr />", "id": "c1-58"}, {"level": 3, "title": "Les prompts côté client", "children": [], "html": "<p>Implémentation des prompts dans le client MCP :</p>\n<p>Lister les prompts = <code>await self.session.list_prompts()</code>, renvoie <code>result.prompts</code>.<br />\nRécupérer un prompt = <code>await self.session.get_prompt(prompt_name, arguments)</code>, renvoie <code>result.messages</code>.</p>\n<p>Processus des prompts :<br />\n1. Définir un prompt et ses arguments attendus dans le serveur <code>MCP</code> (par exemple, <code>document_id</code>).<br />\n2. Le client appelle <code>get_prompt</code> avec le nom du prompt et un dictionnaire d'arguments.<br />\n3. Les arguments sont transmis en tant qu'arguments nommés à la fonction du prompt.<br />\n4. La fonction interpole les arguments dans le texte du prompt.<br />\n5. Elle renvoie un tableau de messages pouvant être transmis directement au LLM.</p>\n<p>Concept clé : les prompts sont des modèles définis par le serveur, que le client peut invoquer avec des arguments spécifiques pour générer des instructions riches en contexte pour le LLM. Les arguments circulent depuis l'appel du client → la fonction du prompt → le texte du prompt avec les arguments interpolés → consommé par le LLM.</p>\n<hr />", "id": "c1-59"}, {"level": 3, "title": "Applications Anthropic", "children": [], "html": "<p>Applications Anthropic = deux applications déployées par Anthropic : Claude Code et Computer Use.</p>\n<p>Claude Code = un assistant de codage en ligne de commande, un exemple d'architecture agentique.</p>\n<p>Computer Use = un ensemble d'outils qui étend les capacités de Claude au-delà de la génération de texte.</p>\n<p>Objectif principal = ces applications illustrent le concept d'<code>agents</code> et fournissent des exemples concrets pour comprendre la conception et l'implémentation des agents.</p>\n<p>Processus de configuration = implique la configuration du terminal pour utiliser Claude Code sur un projet d'exemple.</p>\n<p>Lien avec les agents = les deux applications incarnent le fonctionnement des agents et servent de modèles d'apprentissage pour construire des agents efficaces.</p>\n<hr />", "id": "c1-60"}, {"level": 3, "title": "Configurer Claude Code", "children": [], "html": "<p>Claude Code = un programme assistant de codage en ligne de commande qui aide pour les tâches liées au code.</p>\n<p>Capacités principales = recherche/lecture/modification de fichiers + outils avancés (web scraping, accès au terminal) + prise en charge du client <code>MCP</code>, pour étendre les fonctionnalités via des serveurs <code>MCP</code>.</p>\n<p>Processus de configuration :<br />\n1. Installez <code>Node.js</code> (vérifiez avec la commande <code>npm help</code>).<br />\n2. Exécutez <code>npm install</code> pour installer Claude Code.<br />\n3. Exécutez la commande <code>claude</code> dans le terminal pour vous connecter à votre compte Anthropic.</p>\n<p>Guide de configuration complet = <code>docs.anthropic.com</code>.</p>\n<p>Capacité de client <code>MCP</code> = il peut consommer les outils de serveurs <code>MCP</code> pour étendre ses capacités au-delà des opérations de base sur les fichiers.</p>\n<hr />", "id": "c1-61"}, {"level": 3, "title": "Claude Code en action", "children": [], "html": "<p>Claude Code = un assistant de codage IA qui agit comme un ingénieur collaborateur sur un projet, et pas seulement comme un générateur de code.</p>\n<p>Principales capacités : configuration de projet, conception de fonctionnalités, écriture de code, tests, déploiement et correction de bugs en production.</p>\n<p>Processus de démarrage :<br />\n- Téléchargez le projet et ouvrez-le dans un éditeur.<br />\n- Exécutez la commande <code>claude</code> pour démarrer.<br />\n- Demandez à Claude de lire le README et de suivre les instructions de configuration.<br />\n- Exécutez la commande <code>init</code> = Claude analyse la base de code pour comprendre son architecture/son style de codage et crée un fichier <code>claude.md</code>.<br />\n- <code>claude.md</code> = contexte automatiquement inclus dans les requêtes futures.</p>\n<p>Types de mémoire : fichiers de mémoire de projet (partagés), locaux et utilisateur.</p>\n<p>Gestion du contexte :<br />\n- Utilisez le symbole # pour ajouter des notes spécifiques à la mémoire.<br />\n- Vous pouvez modifier manuellement <code>claude.md</code> ou relancer <code>init</code> pour le mettre à jour.<br />\n- Claude peut gérer les opérations <code>Git</code> (staging, commits).</p>\n<p>Stratégies de prompting efficaces :</p>\n<p>Approche 1 - Workflow en trois étapes :<br />\n1. Identifiez les fichiers pertinents et demandez à Claude de les analyser.<br />\n2. Décrivez la fonctionnalité et demandez à Claude de planifier une solution (sans encore écrire de code).<br />\n3. Demandez à Claude d'implémenter le plan.</p>\n<p>Approche 2 - Développement piloté par les tests (TDD) :<br />\n1. Fournissez le contexte pertinent.<br />\n2. Demandez à Claude de proposer des tests pour la fonctionnalité.<br />\n3. Sélectionnez et implémentez les tests choisis.<br />\n4. Demandez à Claude d'écrire du code jusqu'à ce que les tests passent.</p>\n<p>Principe fondamental : Claude Code = un multiplicateur d'efficacité. Des instructions plus détaillées = des résultats nettement meilleurs. Traitez-le comme un ingénieur collaborateur, et non comme un simple générateur de code.</p>\n<hr />", "id": "c1-62"}, {"level": 3, "title": "Étendre les capacités avec des serveurs MCP", "children": [], "html": "<p>Claude Code = un assistant IA doté d'un client <code>MCP</code> (Model Context Protocol) intégré, capable de se connecter à des serveurs <code>MCP</code> pour étendre ses fonctionnalités.</p>\n<p>Intégration d'un serveur <code>MCP</code> = connecter des outils/services externes à Claude Code via une commande : <code>claude mcp add [server-name] [startup-command]</code>.</p>\n<p>Exemple d'implémentation = un serveur de traitement de documents qui expose un outil « chemin de document vers Markdown », permettant à Claude Code de lire des documents PDF/Word en exécutant <code>uv run main.py</code>.</p>\n<p>Extension dynamique des capacités = les serveurs <code>MCP</code> peuvent ajouter de nouvelles fonctionnalités à Claude Code en temps réel, sans modifier son cœur.</p>\n<p>Cas d'usage courants = surveillance de la production (<code>Sentry</code>), gestion de projet (<code>Jira</code>), communication (<code>Slack</code>), et outils personnalisés pour le workflow de développement.</p>\n<p>Principal avantage = une flexibilité considérablement accrue dans les workflows de développement grâce à des connexions modulaires à des serveurs.</p>\n<p>Processus de configuration = 1) créer un serveur <code>MCP</code> avec des outils, 2) ajouter le serveur à Claude Code avec un nom et une commande de démarrage, 3) redémarrer Claude Code pour accéder aux nouvelles fonctionnalités.</p>\n<hr />", "id": "c1-63"}, {"level": 3, "title": "Paralléliser Claude Code", "children": [], "html": "<p>Paralléliser Claude Code = exécuter plusieurs instances de Claude simultanément pour accomplir différentes tâches en parallèle.</p>\n<p>Problème central = plusieurs instances de Claude modifiant les mêmes fichiers en même temps produisent des conflits et du code invalide.</p>\n<p>Solution = utiliser les worktrees <code>Git</code> pour donner à chaque instance de Claude un espace de travail isolé.</p>\n<p>Git worktree = une fonctionnalité qui crée une copie complète du projet dans un répertoire séparé, chacun correspondant à une branche <code>Git</code> différente.</p>\n<p>Workflow = créer un worktree → assigner une tâche à une instance de Claude → travailler dans l'environnement isolé → committer les modifications → fusionner dans la branche principale.</p>\n<p>Commandes personnalisées = automatiser la création/gestion des worktrees en utilisant des fichiers markdown dans le répertoire <code>.claude/commands</code>, avec le paramètre substituable <code>$ARGUMENTS</code> pour prendre en charge des valeurs dynamiques.</p>\n<p>Avantage de l'exécution parallèle = un seul développeur dirige une équipe virtuelle d'ingénieurs logiciels, et la productivité peut augmenter de manière spectaculaire, limitée uniquement par la capacité du développeur à gérer ces ingénieurs.</p>\n<p>Conflits de fusion = Claude résout automatiquement les conflits lors de la fusion des branches.</p>\n<p>Nettoyage = Claude se charge de supprimer les worktrees une fois une fonctionnalité terminée.</p>\n<p>Principal avantage = cela peut monter en charge vers un nombre illimité d'instances parallèles, en fonction de la capacité du développeur à gérer des tâches simultanées.</p>\n<hr />", "id": "c1-64"}, {"level": 3, "title": "Débogage automatisé", "children": [], "html": "<p>Débogage automatisé = utiliser l'IA (Claude) pour détecter, analyser et corriger automatiquement les bugs en production sans intervention humaine.</p>\n<p>Workflow principal :<br />\n1. Une <code>GitHub Action</code> s'exécute quotidiennement pour vérifier l'environnement de production.<br />\n2. Elle récupère les logs <code>CloudWatch</code> des 24 dernières heures.<br />\n3. Claude identifie les erreurs et les déduplique.<br />\n4. Claude analyse chaque erreur et génère un correctif.<br />\n5. Elle crée une pull request avec les solutions proposées.</p>\n<p>Composants clés :<br />\n- <code>GitHub Actions</code> pour la planification/l'automatisation.<br />\n- <code>AWS CLI</code> pour la récupération des logs.<br />\n- Claude Code pour l'analyse des erreurs et les corrections de code.<br />\n- <code>CloudWatch</code> pour la surveillance des erreurs en production.</p>\n<p>Avantages :<br />\n- Détecte les bugs qui n'apparaissent qu'en production (des problèmes absents en développement).<br />\n- Réduit le temps passé à parcourir manuellement les logs et à déboguer.<br />\n- Fournit des correctifs contextualisés, accompagnés d'explications.<br />\n- Crée une pull request avec les modifications, pour relecture.</p>\n<p>Cas d'usage courant : erreurs de configuration entre environnements (identifiants de modèles invalides, clés API, etc., qui fonctionnent en local mais échouent en production).</p>\n<p>Prérequis d'implémentation : accès au repository, un service de journalisation cloud, un assistant de codage IA, et une intégration au <code>CI/CD pipeline</code>.</p>\n<hr />", "id": "c1-65"}, {"level": 3, "title": "Computer Use", "children": [], "html": "<p>Computer Use = la capacité de Claude à interagir avec une interface informatique en observant visuellement et en contrôlant les opérations.</p>\n<p>Principales capacités :<br />\n- Prendre des captures d'écran d'applications/navigateurs.<br />\n- Cliquer sur des boutons, saisir du texte et naviguer dans les interfaces.<br />\n- Suivre de manière autonome des instructions à plusieurs étapes.<br />\n- Effectuer des tests QA et des tâches d'automatisation.</p>\n<p>Fonctionnement :<br />\n- Il s'exécute dans un environnement de conteneur <code>Docker</code> isolé.<br />\n- L'utilisateur fournit des instructions via une interface de chat.<br />\n- Claude observe visuellement l'écran et effectue des opérations.<br />\n- Il génère un rapport sur l'achèvement/les résultats de la tâche.</p>\n<p>Principaux cas d'usage :<br />\n- Tests QA automatisés d'applications web.<br />\n- Tests d'interaction avec l'interface utilisateur sur différents scénarios.<br />\n- Gagner du temps sur les tâches informatiques répétitives.<br />\n- Identifier des bugs grâce à des tests systématiques.</p>\n<p>Prérequis de configuration = une implémentation de référence est fournie pour les tests en local.</p>\n<p>Exemple de workflow : l'utilisateur décrit les exigences de test → Claude accède à l'application → exécute les cas de test → rapporte les résultats (succès/échec) avec des constats détaillés.</p>\n<hr />", "id": "c1-66"}, {"level": 3, "title": "Fonctionnement de Computer Use", "children": [], "html": "<p>Computer use = une implémentation de système d'outils qui permet à Claude d'interagir avec un environnement informatique.</p>\n<p>Flux d'utilisation des outils : l'utilisateur envoie un message accompagné d'un schéma d'outil → Claude répond avec une requête d'utilisation d'outil (ID, nom, entrée) → le serveur exécute du code → le résultat est renvoyé à Claude sous forme de résultat d'outil.</p>\n<p>Computer use suit le même flux :<br />\n- Envoyer à Claude un schéma d'outil spécial (un petit schéma qui se développe en une structure plus large en arrière-plan).<br />\n- Le schéma développé inclut une fonction <code>action</code> avec des paramètres : déplacement de la souris, clic gauche, capture d'écran, etc.<br />\n- Claude envoie une requête d'utilisation d'outil.<br />\n- Le développeur doit satisfaire cette requête via un environnement informatique (généralement un conteneur <code>Docker</code>).<br />\n- Le conteneur exécute les frappes clavier/mouvements de souris programmatiques.<br />\n- La réponse est renvoyée à Claude.</p>\n<p>Points clés :<br />\n- Claude ne manipule pas directement l'ordinateur.<br />\n- Computer use = un système d'outils + un environnement informatique fourni par le développeur.<br />\n- Anthropic fournit une implémentation de référence (un conteneur <code>Docker</code> avec du code d'exécution souris/clavier préconstruit).<br />\n- La configuration nécessite <code>Docker</code> et l'exécution d'une simple commande.<br />\n- Vous pouvez tester la fonctionnalité computer use de Claude via une interface de chat directe.</p>\n<p>Computer use = une couche d'abstraction où le système d'outils gère la communication avec Claude, tandis que le conteneur <code>Docker</code> gère l'interaction réelle avec l'ordinateur.</p>\n<hr />", "id": "c1-67"}, {"level": 3, "title": "Agents et workflows", "children": [], "html": "<p>Workflows et agents = des stratégies pour traiter des tâches utilisateur que Claude ne peut pas accomplir en une seule requête.</p>\n<p>Règle de décision : utilisez un workflow lorsque vous avez une compréhension précise de la tâche et connaissez exactement la séquence des étapes. Utilisez un agent lorsque les détails de la tâche sont flous.</p>\n<p>Workflow = une série d'appels à Claude pour un problème spécifique, avec une séquence d'étapes connue.</p>\n<p>Exemple de workflow : un convertisseur d'image en modèle 3D.<br />\n- Étape 1 : Claude décrit en détail l'image téléchargée.<br />\n- Étape 2 : Claude modélise l'objet à partir de la description, en utilisant la bibliothèque <code>Python</code> <code>CADQuery</code>.<br />\n- Étape 3 : un rendu du modèle est créé.<br />\n- Étape 4 : Claude compare le rendu à l'image originale.<br />\n- Étape 5 : si le résultat est imprécis, reprendre à partir de l'étape 2 avec le retour obtenu.</p>\n<p>Cela suit le modèle évaluateur-optimiseur :<br />\n- Producteur = génère le résultat (modélisation Claude + <code>CADQuery</code>).<br />\n- Évaluateur = évalue la qualité du résultat (l'étape de comparaison).<br />\n- La boucle se poursuit jusqu'à ce que l'évaluateur accepte le résultat.</p>\n<p>Point clé : les workflows sont des modèles d'implémentation que d'autres ingénieurs ont utilisés avec succès. Reconnaître un modèle de workflow ne l'implémente pas automatiquement — il faut tout de même écrire le code correspondant.</p>\n<hr />", "id": "c1-68"}, {"level": 3, "title": "Workflows de parallélisation", "children": [], "html": "<p>Workflows de parallélisation = découper une tâche complexe en plusieurs sous-tâches simultanées, puis agréger les résultats.</p>\n<p>Exemple : sélection d'un matériau pour une pièce.<br />\n- Alternative : plutôt qu'un seul prompt volumineux demandant à Claude de choisir entre métaux/polymères/céramiques/composites en fonction de tous les critères.<br />\n- L'approche utilisée : effectuer des requêtes parallèles distinctes, chacune évaluant la pertinence d'un matériau, puis comparer les résultats lors d'une étape d'agrégation finale.</p>\n<p>Structure : entrée → plusieurs sous-tâches parallèles → agrégateur → résultat final.</p>\n<p>Avantages :<br />\n- Focalisation = chaque sous-tâche traite une analyse spécifique, plutôt que de jongler avec plusieurs considérations à la fois.<br />\n- Modularité = les prompts individuels peuvent être améliorés/évalués indépendamment.<br />\n- Scalabilité = il est facile d'ajouter de nouvelles sous-tâches sans affecter celles existantes.<br />\n- Qualité = cela réduit la confusion causée par un prompt unique trop complexe.</p>\n<p>Principe fondamental : décomposer une décision complexe en analyses parallèles spécialisées, puis synthétiser les résultats.</p>\n<hr />", "id": "c1-69"}, {"level": 3, "title": "Workflows en chaîne", "children": [], "html": "<p>Workflows en chaîne = découper une tâche volumineuse en une série d'étapes séquentielles distinctes, plutôt qu'en un seul prompt complexe.</p>\n<p>Concept clé : plutôt qu'un seul prompt volumineux comportant de multiples exigences, le diviser en plusieurs appels indépendants, chacun centré sur une sous-tâche spécifique.</p>\n<p>Exemple de workflow : l'utilisateur saisit un sujet → recherche des sujets tendance → Claude choisit le plus intéressant → Claude effectue des recherches sur le sujet → Claude rédige un script → une vidéo est générée → elle est publiée sur les réseaux sociaux.</p>\n<p>Principal avantage : cela permet à l'IA de se concentrer sur une seule tâche plutôt que de jongler avec plusieurs contraintes à la fois.</p>\n<p>Principal cas d'usage : lorsque Claude ignore systématiquement certaines contraintes dans un prompt complexe malgré des rappels répétés. C'est fréquent dans les prompts longs contenant de nombreuses exigences du type « ne fais pas X ».</p>\n<p>Scénario problématique : un long prompt avec des contraintes (aucune mention de l'IA, pas d'emojis, ton professionnel) → Claude enfreint certaines contraintes, peu importe le nombre de fois où vous les répétez.</p>\n<p>Solution : Étape 1 - envoyer le prompt initial et accepter le résultat imparfait. Étape 2 - envoyer un prompt de suivi demandant à Claude de réécrire le texte en fonction des violations spécifiques constatées.</p>\n<p>Point clé à retenir : même des workflows en apparence simples deviennent essentiels lorsqu'il s'agit de prompts chargés de contraintes que l'IA a du mal à respecter entièrement en une seule passe.</p>\n<hr />", "id": "c1-70"}, {"level": 3, "title": "Workflows de routage", "children": [], "html": "<p>Workflows de routage = un modèle de workflow qui classe l'entrée de l'utilisateur pour déterminer le pipeline de traitement approprié.</p>\n<p>Mécanisme clé : envoyer une requête initiale à Claude pour classer l'entrée de l'utilisateur selon des types/catégories prédéfinis. En fonction de la réponse de classification, le système oriente la requête vers un pipeline de traitement spécialisé, avec des prompts/outils adaptés.</p>\n<p>Exemple de flux :<br />\n1. L'utilisateur saisit un sujet (par exemple, « les fonctions Python »).<br />\n2. Claude classe le sujet (par exemple, « éducatif »).<br />\n3. Le système utilise un modèle de prompt spécifique à l'éducation.<br />\n4. Claude génère le script avec un ton et une structure éducatifs.</p>\n<p>Avantages : cela garantit que le résultat correspond à la nature du sujet. Les sujets de programmation bénéficient d'un traitement éducatif avec définitions/explications. Les sujets de divertissement bénéficient d'un langage tendance et d'accroches engageantes.</p>\n<p>Structure : une étape de routage → plusieurs pipelines de traitement spécialisés → chaque pipeline disposant de prompts/outils adaptés à une catégorie spécifique.</p>\n<p>Cas d'usage : génération de scripts vidéo pour les réseaux sociaux, où différents sujets nécessitent différents tons et approches.</p>\n<hr />", "id": "c1-71"}, {"level": 3, "title": "Agents et outils", "children": [], "html": "<p>Agents = des systèmes d'IA qui élaborent un plan pour accomplir une tâche à l'aide des outils fournis, très efficaces lorsque les étapes exactes sont inconnues. Les <code>workflows</code> = un meilleur choix lorsque les étapes précises sont connues.</p>\n<p>Principale différence : les workflows nécessitent des étapes prédéterminées, tandis que les agents planifient dynamiquement en utilisant les outils disponibles.</p>\n<p>Avantages des agents : la capacité à résoudre une grande variété de tâches avec le même ensemble d'outils, et la capacité à combiner les outils de façon inattendue.</p>\n<p>Principe d'abstraction des outils : fournir des outils généraux/abstraits plutôt que des outils hautement spécialisés. Par exemple, Claude Code utilise <code>bash</code>, <code>web_fetch</code>, <code>file_write</code> (abstraits) plutôt que <code>refactor_tool</code>, <code>install_dependencies</code> (spécialisés).</p>\n<p>Exemple de composition d'outils : <code>get_current_datetime</code> + <code>add_duration</code> + <code>set_reminder</code> peuvent résoudre une grande variété de tâches liées au temps grâce à différentes combinaisons.</p>\n<p>Comportement de l'agent : il peut demander des informations supplémentaires en cas de besoin, combiner les outils de façon créative pour atteindre un objectif, et fonctionne mieux avec un petit ensemble d'outils flexibles.</p>\n<p>Approche de conception : donner aux agents des outils abstraits qu'ils peuvent assembler entre eux, plutôt que des outils spécialisés à usage unique. Cela permet une résolution dynamique des problèmes et des cas d'usage inattendus.</p>\n<hr />", "id": "c1-72"}, {"level": 3, "title": "Inspection de l'environnement", "children": [], "html": "<p>Inspection de l'environnement = un agent évaluant son environnement et les résultats de ses actions pour comprendre sa progression et gérer les erreurs.</p>\n<p>Concept clé : après chaque action, l'agent a besoin d'un mécanisme de retour d'information — au-delà de la simple valeur de retour de l'outil — pour comprendre le nouvel état de l'environnement.</p>\n<p>Exemple avec computer use : Claude prend une capture d'écran après chaque action (saisie, clic) pour voir comment l'environnement a changé, car il ne peut pas prédire le résultat exact d'une action telle qu'un clic sur un bouton.</p>\n<p>Exemple avec l'édition de code : avant de modifier un fichier, l'agent doit lire le contenu actuel du fichier pour comprendre l'état existant.</p>\n<p>Application à un agent de vidéos pour réseaux sociaux :<br />\n- Utiliser <code>Whisper CPP</code> via <code>bash</code> pour générer des sous-titres horodatés, en vérifiant le positionnement des dialogues.<br />\n- Utiliser <code>FFmpeg</code> pour extraire des captures d'écran de la vidéo à intervalles réguliers, en vérifiant les visuels.<br />\n- Vérifier que la création de la vidéo correspond aux attentes avant publication.</p>\n<p>Principal avantage : l'inspection de l'environnement permet à l'agent d'évaluer l'avancement de la tâche, de détecter les erreurs et de s'adapter à des résultats inattendus, plutôt que d'opérer à l'aveugle.</p>\n<hr />", "id": "c1-73"}, {"level": 3, "title": "Workflows vs. agents", "children": [], "html": "<p>Les <code>workflows</code> = une série prédéfinie d'appels à Claude avec des étapes connues. Les <code>agents</code> = une approche flexible qui utilise Claude pour combiner des outils de base afin d'accomplir des tâches inconnues.</p>\n<p>Principales différences :</p>\n<p>Découpage des tâches : les workflows décomposent une tâche volumineuse en sous-tâches plus petites et plus spécifiques, permettant une plus grande concentration et une meilleure précision. Les agents traitent de manière créative une variété de défis sans étapes prédéterminées.</p>\n<p>Tests/évaluation : les workflows sont plus faciles à tester car la séquence d'exécution est connue. Les agents sont plus difficiles à tester car le chemin d'exécution est imprévisible.</p>\n<p>Expérience utilisateur : les workflows nécessitent des entrées spécifiques. Les agents créent leurs propres entrées à partir de la requête de l'utilisateur et peuvent demander des informations supplémentaires si nécessaire.</p>\n<p>Taux de réussite : les workflows ont un taux d'accomplissement des tâches plus élevé grâce à leur approche structurée. Les agents ont un taux d'accomplissement plus faible car la complexité leur est déléguée.</p>\n<p>Recommandation : privilégiez les workflows pour la fiabilité. N'utilisez des agents que lorsque la flexibilité est réellement nécessaire. Les utilisateurs veulent un produit qui fonctionne 100 % du temps, pas un agent sophistiqué.</p>\n<p>Principe fondamental : résoudre le problème de manière fiable passe avant l'innovation.</p>\n<hr />", "id": "c1-74"}]}, {"num": 2, "title": "Leçon 2 : AI Fluency : cadres conceptuels et fondations", "introHtml": "<blockquote>\n<p>Apprenez à collaborer avec les systèmes d'IA de manière efficace, sûre et responsable<br />\nLien du cours : <a href=\"https://anthropic.skilljar.com/ai-fluency-framework-foundations\">AI Fluency: Frameworks and Foundations</a> | 15 leçons au total</p>\n</blockquote>\n<hr />", "tree": [{"level": 2, "title": "Introduction à l'AI Fluency", "children": [{"level": 3, "title": "Introduction à l'AI Fluency", "children": [{"level": 4, "title": "Points clés à retenir", "children": [], "html": "<ul>\n<li>Ce cours porte sur la collaboration humain-IA, et pas seulement sur la compréhension de l'IA en tant que technologie</li>\n<li>L'AI Fluency signifie interagir avec les systèmes d'IA de manière efficace, efficiente, éthique et sûre</li>\n<li>Le cadre AI Fluency s'articule autour des compétences « 4D » : Délégation (Delegation), Description, Discernement (Discernment) et Diligence</li>\n<li>L'objectif est de développer des compétences durables qui restent pertinentes à mesure que la technologie de l'IA évolue</li>\n<li>Une collaboration efficace avec l'IA exige à la fois des compétences pratiques et un changement fondamental dans notre manière de penser le travail avec l'IA</li>\n</ul>", "id": "c2-0-0-0"}, {"level": 4, "title": "Exercice", "children": [], "html": "<p><strong>Mettez-le en pratique</strong></p>\n<p>Vous aurez besoin d'accéder à un modèle de langage (5-10 minutes)</p>\n<p>Tout au long de ce cours, vous mettrez en pratique ce que vous apprenez en travaillant directement avec un modèle de langage. Bien que nos exemples utilisent Claude (l'assistant IA d'Anthropic), vous êtes libre d'utiliser le modèle de langage de votre choix. Les principes et compétences que nous explorons s'appliquent à différents systèmes d'IA.</p>\n<p>Commencer est simple et gratuit :</p>\n<ul>\n<li><strong>Claude</strong> : rendez-vous sur claude.ai pour créer un compte gratuit</li>\n<li>Aucun abonnement payant n'est nécessaire pour réaliser les activités du cours</li>\n<li>Vous pouvez également utiliser d'autres chatbots IA si vous le préférez</li>\n</ul>\n<p>Vous ne connaissez pas Claude ? Ne vous inquiétez pas ! Nous fournirons des consignes claires à chaque exercice pour vous aider à démarrer.</p>", "id": "c2-0-0-1"}, {"level": 4, "title": "Réflexion", "children": [], "html": "<p>Avant de continuer, prenez un moment pour réfléchir à vos propres expériences avec l'IA :</p>\n<ul>\n<li>Quelles difficultés avez-vous rencontrées en utilisant l'IA pour obtenir un résultat précis ?</li>\n<li>Quelles possibilités de collaboration avec l'IA vous enthousiasment le plus ?</li>\n<li>Qu'espérez-vous retirer de ce cours ?</li>\n</ul>", "id": "c2-0-0-2"}, {"level": 4, "title": "Prochaines étapes", "children": [], "html": "<p>Dans la prochaine leçon, nous explorerons pourquoi l'AI Fluency est essentielle dans le paysage technologique en évolution rapide d'aujourd'hui. Nous présenterons les trois grandes façons de collaborer avec l'IA (Automatisation, Augmentation et Agentivité) ainsi que les compétences fondamentales du cadre AI Fluency : les « 4D » — Délégation, Description, Discernement et Diligence.</p>", "id": "c2-0-0-3"}, {"level": 4, "title": "Retours sur ce cours", "children": [], "html": "<p>Au fil de votre progression dans ce cours, nous aimerions beaucoup connaître votre avis sur la façon dont vous utilisez les concepts du cours dans votre vie, votre travail ou en classe, ainsi que tout autre retour que vous souhaiteriez partager. Partagez votre avis ici.</p>", "id": "c2-0-0-4"}, {"level": 4, "title": "Remerciements et licence", "children": [], "html": "<p>Copyright 2025 Rick Dakan, Joseph Feller et Anthropic. Publié sous licence CC BY-NC-SA 4.0. Ce cours s'appuie sur le cadre AI Fluency de Dakan et Feller. Soutien partiel fourni par la Higher Education Authority of Ireland, via le National Forum for the Enhancement of Teaching and Learning.</p>\n<hr />", "id": "c2-0-0-5"}], "html": "<p>(4 minutes)</p>\n<p>Bienvenue ! Cette vidéo présente l'objectif central de ce cours : une collaboration significative avec le développement de l'intelligence artificielle (IA), et pas seulement l'apprentissage de la technologie de l'IA. Nous expliquons comment ce cours explore la construction d'un cadre durable pour travailler avec les systèmes d'IA — un cadre qui va au-delà de simples astuces temporaires. Nous précisons ce que nous entendons par AI Fluency : la capacité à collaborer avec l'IA de manière efficace, efficiente, éthique et sûre. Nous présentons également la structure du cours, qui couvre chacune des compétences fondamentales de l'AI Fluency (les « 4D ») ainsi que des concepts techniques et pratiques clés. À la fin du cours, vous disposerez d'un cadre réfléchi pour l'interaction avec l'IA, de la confiance nécessaire pour choisir quand et comment collaborer efficacement avec elle, de la maîtrise de compétences de collaboration pratiques, et de la capacité à évaluer et partager de façon responsable un travail assisté par l'IA.</p>", "id": "c2-0-0"}], "html": "<p>Durée estimée pour ce module : 10-15 minutes</p>\n<p>À la fin de cette leçon, vous serez capable de :</p>\n<ul>\n<li>Comprendre l'objectif et la structure de ce cours</li>\n<li>Reconnaître l'importance de l'AI Fluency dans le monde actuel</li>\n<li>Identifier les composantes clés du parcours d'apprentissage à venir</li>\n<li>Poser des attentes claires sur ce que vous retirerez de ce cours</li>\n</ul>", "id": "c2-0"}, {"level": 2, "title": "Pourquoi avons-nous besoin de l'AI Fluency ?", "children": [{"level": 3, "title": "Pourquoi avons-nous besoin de l'AI Fluency ?", "children": [], "html": "<p>Cette vidéo explore ce que signifie réellement être « fluent » en IA et pourquoi cela compte. Nous expliquons comment l'AI Fluency implique de développer les compétences pratiques, les connaissances, les intuitions et les valeurs qui vous aident à interagir avec les systèmes d'IA de manière efficace, efficiente, éthique et sûre. Nous présentons également trois façons dont les personnes interagissent avec l'IA :</p>\n<ul>\n<li><strong>Automatisation</strong> : l'IA réalise une tâche précise selon vos instructions.</li>\n<li><strong>Augmentation</strong> : vous collaborez avec l'IA comme partenaire dans la réflexion créative et l'exécution des tâches.</li>\n<li><strong>Agentivité</strong> : vous configurez l'IA pour qu'elle travaille de manière autonome en votre nom, en définissant ses connaissances et ses schémas de comportement, plutôt qu'en lui confiant simplement des tâches précises.</li>\n</ul>", "id": "c2-1-0"}, {"level": 3, "title": "Retours", "children": [], "html": "<p>Au fil de votre progression dans ce cours, nous aimerions beaucoup connaître votre avis sur la façon dont vous utilisez les concepts du cours dans votre vie, votre travail ou en classe, ainsi que tout autre retour que vous souhaiteriez partager.</p>\n<p>Partagez votre avis ici.</p>", "id": "c2-1-1"}, {"level": 3, "title": "Remerciements et licence", "children": [], "html": "<p>Copyright 2025 Rick Dakan, Joseph Feller et Anthropic. Publié sous licence CC BY-NC-SA 4.0. Ce cours s'appuie sur le cadre AI Fluency de Dakan et Feller. Soutien partiel fourni par la Higher Education Authority of Ireland, via le National Forum for the Enhancement of Teaching and Learning.</p>\n<hr />", "id": "c2-1-2"}], "html": "<p><strong>Ce que vous allez apprendre</strong></p>\n<p>À la fin de cette leçon, vous serez capable de :</p>\n<ul>\n<li>Comprendre ce que signifie l'AI Fluency et pourquoi elle compte dans le paysage technologique en évolution rapide d'aujourd'hui</li>\n<li>Reconnaître les trois façons émergentes de collaborer avec l'IA : Automatisation, Augmentation et Agentivité</li>\n</ul>", "id": "c2-1"}, {"level": 2, "title": "Le cadre des 4D", "children": [{"level": 3, "title": "Le cadre des 4D", "children": [{"level": 4, "title": "Points clés à retenir", "children": [], "html": "<ul>\n<li>L'AI Fluency signifie interagir avec l'IA de manière efficace, efficiente, éthique et sûre</li>\n<li>Il existe trois grandes façons d'interagir avec l'IA :<ul>\n<li><strong>Automatisation</strong> : l'IA réalise une tâche précise selon vos instructions</li>\n<li><strong>Augmentation</strong> : vous collaborez avec l'IA comme partenaire dans la réflexion créative et l'exécution des tâches</li>\n<li><strong>Agentivité</strong> : vous guidez l'IA pour qu'elle travaille de manière autonome en votre nom, en façonnant ses connaissances et son comportement plutôt que des actions précises</li>\n</ul>\n</li>\n<li>Le cadre AI Fluency se compose de quatre compétences fondamentales (les 4D) :<ul>\n<li><strong>Délégation</strong> : décider quel travail confier à l'IA en collaboration et quel travail réaliser soi-même</li>\n<li><strong>Description</strong> : communiquer efficacement avec les systèmes d'IA</li>\n<li><strong>Discernement</strong> : évaluer de façon critique les résultats produits par l'IA</li>\n<li><strong>Diligence</strong> : veiller à une collaboration responsable avec l'IA</li>\n</ul>\n</li>\n<li>Ces compétences s'appliquent aux trois façons de travailler avec l'IA</li>\n<li>Développer ces compétences vous prépare à l'évolution des capacités de l'IA</li>\n</ul>", "id": "c2-2-0-0"}, {"level": 4, "title": "Exercice", "children": [], "html": "<p><strong>Exercice 1 : appliquer les 4D</strong></p>\n<p>Durée estimée : 5 minutes</p>\n<p>Choisissez l'un des scénarios de collaboration suivants et réfléchissez à la façon dont vous appliqueriez le cadre des 4D :</p>\n<p><strong>Projet de communication</strong></p>\n<p>Vous travaillez avec un assistant IA pour rédiger une série d'e-mails destinés à une campagne marketing.</p>\n<ul>\n<li><strong>Délégation</strong> : quels aspects de ce projet géreriez-vous vous-même, et lesquels feriez-vous en collaboration avec l'IA ?</li>\n<li><strong>Description</strong> : comment transmettriez-vous à l'IA votre vision du ton, de l'objectif et des critères de réussite de la campagne ?</li>\n<li><strong>Discernement</strong> : quels critères vous aideraient à évaluer si les e-mails rédigés par l'IA répondent à vos besoins ?</li>\n<li><strong>Diligence</strong> : en matière de transparence et de responsabilité, quelles considérations sont importantes ?</li>\n</ul>\n<p><strong>Projet de recherche</strong></p>\n<p>Vous utilisez l'IA pour analyser un large jeu de données dans le cadre d'un article de recherche.</p>\n<ul>\n<li><strong>Délégation</strong> : comment répartiriez-vous le travail d'analyse entre vous et l'IA ?</li>\n<li><strong>Description</strong> : de quelles informations de contexte sur votre question de recherche l'IA a-t-elle besoin pour bien faire son travail ?</li>\n<li><strong>Discernement</strong> : comment vérifieriez-vous l'exactitude de l'analyse produite par l'IA ?</li>\n<li><strong>Diligence</strong> : quelles questions éthiques pourraient se poser lors de la publication d'une recherche assistée par l'IA ?</li>\n</ul>\n<p><strong>Projet créatif</strong></p>\n<p>Vous travaillez avec l'IA pour développer des concepts de personnages pour une histoire.</p>\n<ul>\n<li><strong>Délégation</strong> : quels éléments créatifs souhaitez-vous explorer en collaboration avec l'IA, et lesquels souhaitez-vous développer de façon autonome ?</li>\n<li><strong>Description</strong> : comment guideriez-vous l'IA pour qu'elle génère des personnages adaptés à l'univers de votre histoire ?</li>\n<li><strong>Discernement</strong> : comment décideriez-vous quels éléments suggérés par l'IA conserver, modifier ou écarter ?</li>\n<li><strong>Diligence</strong> : comment reconnaîtriez-vous la contribution de l'IA à votre travail créatif ?</li>\n</ul>\n<p><strong>Exercice 2 : explorez un sujet que vous aimez</strong></p>\n<p>Durée estimée : 5-10 minutes</p>\n<p>Passez 5 à 10 minutes à discuter avec Claude d'un sujet qui vous passionne et que vous connaissez très bien. Nous utiliserons Claude pour le reste des exercices de ce cours, mais vous pouvez aussi utiliser une autre IA pour les réaliser. Vous pourriez même essayer de faire les exercices du cours avec plusieurs assistants IA pour vous rendre compte de leurs différences.</p>\n<p><strong>Consignes :</strong></p>\n<ol>\n<li>Choisissez un sujet que vous connaissez très bien et que vous aimez aborder, comme un loisir, un intérêt professionnel, une série de livres préférée, etc.</li>\n<li>Ayez une conversation naturelle avec Claude sur ce sujet, tout comme vous le feriez avec quelqu'un qui partage cet intérêt.</li>\n<li>Essayez de repérer les moments où :<ul>\n<li>Claude enrichit votre réflexion</li>\n<li>Vous devez clarifier ou corriger la compréhension de Claude</li>\n<li>Votre expertise vous guide dans l'évaluation des réponses de Claude</li>\n</ul>\n</li>\n</ol>\n<p><strong>Exercice 3 : apprenez quelque chose de nouveau</strong></p>\n<p>Durée estimée : 5-10 minutes</p>\n<p>Passez 5 à 10 minutes à demander à Claude de vous enseigner un sujet que vous ne connaissez pas mais que vous souhaitez explorer. Observez en quoi cette expérience diffère du fait de parler d'un sujet que vous aimez et connaissez bien.</p>\n<p><strong>Consignes :</strong></p>\n<ol>\n<li>Choisissez un sujet que vous aimeriez approfondir.</li>\n<li>Engagez une conversation avec Claude pour vous aider à comprendre les bases de ce sujet. Ne vous préoccupez pas de savoir si vous formulez vos questions de la « mauvaise » ou de la « bonne » façon — demandez simplement à Claude de vous l'enseigner.</li>\n<li>Essayez de repérer les moments où :<ul>\n<li>Claude fournit des explications utiles</li>\n<li>Il propose des exemples qui rendent concrets des concepts abstraits</li>\n<li>Il répond naturellement aux questions que vous soulevez</li>\n<li>Il explique des points pour lesquels vous voudriez vérifier son explication</li>\n</ul>\n</li>\n</ol>", "id": "c2-2-0-1"}, {"level": 4, "title": "Réflexion", "children": [], "html": "<p>Avant de continuer, prenez un moment pour réfléchir :</p>\n<ul>\n<li>Parmi les 4D (Délégation, Description, Discernement, Diligence), laquelle maîtrisez-vous déjà le mieux ? Laquelle aurait besoin d'être davantage développée ?</li>\n<li>Pouvez-vous vous rappeler une interaction récente avec l'IA où ce cadre aurait pu vous aider ?</li>\n<li>Quelles compétences précises du cadre des 4D amélioreraient le plus votre travail ou vos projets personnels ?</li>\n</ul>", "id": "c2-2-0-2"}, {"level": 4, "title": "Prochaines étapes", "children": [], "html": "<p>Dans la prochaine leçon, l'approfondissement 1, « Qu'est-ce que l'IA générative ? », est une leçon technique en deux parties qui explique comment fonctionne fondamentalement l'IA moderne, en quoi elle diffère des technologies précédentes, ainsi que ses capacités et limites actuelles. Ces connaissances apporteront un contexte précieux pour les 4D, et renforceront tout particulièrement votre compétence de Délégation.</p>", "id": "c2-2-0-3"}, {"level": 4, "title": "Retours", "children": [], "html": "<p>Au fil de votre progression dans ce cours, nous aimerions beaucoup connaître votre avis sur la façon dont vous utilisez les concepts du cours dans votre vie, votre travail ou en classe, ainsi que tout autre retour que vous souhaiteriez partager. Partagez votre avis ici.</p>", "id": "c2-2-0-4"}, {"level": 4, "title": "Remerciements et licence", "children": [], "html": "<p>Copyright 2025 Rick Dakan, Joseph Feller et Anthropic. Publié sous licence CC BY-NC-SA 4.0. Ce cours s'appuie sur le cadre AI Fluency de Dakan et Feller.</p>\n<p>Soutien partiel fourni par la Higher Education Authority of Ireland, via le National Forum for the Enhancement of Teaching and Learning.</p>\n<hr />", "id": "c2-2-0-5"}], "html": "<p>(5 minutes)</p>\n<p>Cette vidéo présente les quatre compétences fondamentales de l'AI Fluency, les « 4D » : Délégation, Description, Discernement et Diligence.</p>\n<ul>\n<li><strong>Délégation</strong> : décider de façon réfléchie quel travail confier à l'IA en collaboration et quel travail réaliser soi-même</li>\n<li><strong>Description</strong> : communiquer clairement avec les systèmes d'IA</li>\n<li><strong>Discernement</strong> : évaluer d'un œil critique les résultats et le comportement de l'IA</li>\n<li><strong>Diligence</strong> : veiller à ce que vos interactions avec l'IA soient responsables</li>\n</ul>\n<p>Nous explorons la manière dont ces compétences s'articulent entre elles selon les différentes façons d'interagir avec l'IA, et pourquoi développer ces compétences vous prépare aux développements futurs de l'IA.</p>", "id": "c2-2-0"}], "html": "<p><strong>Ce que vous allez apprendre</strong></p>\n<p>À la fin de cette leçon, vous serez capable de :</p>\n<ul>\n<li>Expliquer le cadre fondamental de l'AI Fluency et ses « 4D » centrales : Délégation, Description, Discernement et Diligence</li>\n</ul>", "id": "c2-2"}, {"level": 2, "title": "Fondations de l'IA générative", "children": [{"level": 3, "title": "Fondations de l'IA générative", "children": [], "html": "<p>(6 minutes)</p>\n<p>Cette vidéo présente le concept d'IA générative, en mettant l'accent sur sa capacité à créer du contenu nouveau plutôt qu'à simplement analyser du contenu déjà existant. Nous détaillons le fonctionnement réel des grands modèles de langage (LLM, pour large language models) tels que Claude, ainsi que le parcours technologique qui les a rendus possibles — des percées algorithmiques comme l'architecture Transformer aux jeux de données d'entraînement massifs et à la puissance de calcul considérable. Nous expliquons également comment ces systèmes apprennent grâce au pré-entraînement et à l'affinage (fine-tuning), et abordons des notions telles que les fenêtres de contexte et les capacités émergentes.</p>", "id": "c2-3-0"}, {"level": 3, "title": "Retours", "children": [], "html": "<p>Au fil de votre progression dans ce cours, nous aimerions beaucoup connaître votre avis sur la façon dont vous utilisez les concepts du cours dans votre vie, votre travail ou en classe, ainsi que tout autre retour que vous souhaiteriez partager. Partagez votre avis ici.</p>", "id": "c2-3-1"}, {"level": 3, "title": "Remerciements et licence", "children": [], "html": "<p>Copyright 2025 Rick Dakan, Joseph Feller et Anthropic. Publié sous licence CC BY-NC-SA 4.0. Ce cours s'appuie sur le cadre AI Fluency de Dakan et Feller. Soutien partiel fourni par la Higher Education Authority of Ireland, via le National Forum for the Enhancement of Teaching and Learning.</p>\n<hr />", "id": "c2-3-2"}], "html": "<p><strong>Ce que vous allez apprendre</strong></p>\n<p>À la fin de cette leçon, vous serez capable de :</p>\n<ul>\n<li>Définir l'IA générative et expliquer en quoi elle diffère des autres types d'IA</li>\n<li>Reconnaître les caractéristiques clés et les fondations techniques de l'IA générative</li>\n</ul>", "id": "c2-3"}, {"level": 2, "title": "Capacités et limites", "children": [{"level": 3, "title": "Capacités et limites", "children": [{"level": 4, "title": "Points clés à retenir", "children": [], "html": "<ul>\n<li>L'IA générative crée du contenu nouveau (texte, images, code) plutôt que de simplement analyser des données existantes</li>\n<li>Les systèmes modernes comme les LLM ont été rendus possibles par trois avancées majeures :<ul>\n<li>Des percées algorithmiques et architecturales (en particulier l'architecture Transformer)</li>\n<li>Des quantités massives de données d'entraînement numériques</li>\n<li>Une augmentation spectaculaire de la puissance de calcul</li>\n</ul>\n</li>\n<li>L'IA générative apprend en deux étapes : le pré-entraînement (l'analyse de motifs récurrents à travers des milliards d'exemples) et l'affinage, ou fine-tuning (l'apprentissage à suivre des instructions et à fournir des réponses utiles)</li>\n<li>Les capacités actuelles incluent la polyvalence entre les tâches, la conscience conversationnelle, et la capacité à se connecter à des outils externes</li>\n<li>Les limites actuelles incluent les dates de coupure des connaissances, le risque d'halluciner, les limites de la fenêtre de contexte, et les difficultés face à un raisonnement complexe</li>\n<li>Les applications les plus efficaces combinent les forces des humains et de l'IA, les humains apportant l'esprit critique, le jugement, la créativité et la supervision éthique</li>\n</ul>", "id": "c2-4-0-0"}, {"level": 4, "title": "Exercice", "children": [], "html": "<p><strong>Réflexion</strong></p>\n<p>Avant de continuer, prenez un moment pour réfléchir :</p>\n<ul>\n<li>En quoi la compréhension des fondations techniques de l'IA générative (comme les données d'entraînement et le pré-entraînement/fine-tuning) change-t-elle votre façon de penser le travail avec ces systèmes ?</li>\n<li>Après avoir découvert comment ces systèmes fonctionnent et quelles sont leurs limites actuelles, quelles questions éthiques vous viennent à l'esprit ?</li>\n</ul>", "id": "c2-4-0-1"}, {"level": 4, "title": "Prochaines étapes", "children": [], "html": "<p>Dans la prochaine leçon, nous examinerons de plus près la première des compétences 4D : la Délégation. Vous apprendrez à prendre des décisions stratégiques pour répartir le travail entre vous et l'IA, en vous appuyant sur votre compréhension de vos objectifs et des capacités de l'IA. Cette base vous aidera à décider de façon réfléchie quand et comment intégrer l'IA dans vos processus créatifs et de résolution de problèmes.</p>", "id": "c2-4-0-2"}, {"level": 4, "title": "Retours", "children": [], "html": "<p>Au fil de votre progression dans ce cours, nous aimerions beaucoup connaître votre avis sur la façon dont vous utilisez les concepts du cours dans votre vie, votre travail ou en classe, ainsi que tout autre retour que vous souhaiteriez partager. Partagez votre avis ici.</p>", "id": "c2-4-0-3"}, {"level": 4, "title": "Remerciements et licence", "children": [], "html": "<p>Copyright 2025 Rick Dakan, Joseph Feller et Anthropic. Publié sous licence CC BY-NC-SA 4.0. Ce cours s'appuie sur le cadre AI Fluency de Dakan et Feller. Soutien partiel fourni par la Higher Education Authority of Ireland, via le National Forum for the Enhancement of Teaching and Learning.</p>\n<hr />", "id": "c2-4-0-4"}], "html": "<p>(7 minutes)</p>\n<p>Cette vidéo explore ce que l'IA générative peut et ne peut pas faire efficacement aujourd'hui. Nous mettons en avant la polyvalence de l'IA générative sur les tâches linguistiques, sa capacité à maintenir la fluidité d'une conversation, et sa capacité à passer d'une tâche à l'autre sans entraînement supplémentaire. Nous abordons également ses limites, notamment les dates de coupure des connaissances, les hallucinations (résultats factuellement incorrects), les limites de la fenêtre de contexte et les difficultés de raisonnement. Nous soulignons que ce domaine évolue rapidement, et expliquons que les applications les plus efficaces combinent les forces complémentaires des humains et de l'IA.</p>", "id": "c2-4-0"}], "html": "<p><strong>Ce que vous allez apprendre</strong></p>\n<p>À la fin de cette leçon, vous serez capable de :</p>\n<ul>\n<li>Identifier les principales capacités et limites de l'IA générative actuelle</li>\n</ul>", "id": "c2-4"}, {"level": 2, "title": "Un regard approfondi sur la Délégation", "children": [{"level": 3, "title": "Un regard approfondi sur la Délégation", "children": [{"level": 4, "title": "Points clés à retenir", "children": [], "html": "<ul>\n<li>La Délégation consiste à décider de façon réfléchie quel travail réaliser soi-même, quel travail faire ensemble avec l'IA, ou quel travail laisser l'IA gérer de façon autonome, et comment répartir ces tâches.</li>\n<li>La Conscience du problème signifie bien comprendre votre objectif et la nature du travail avant de faire intervenir l'IA.</li>\n<li>La Conscience de la plateforme implique de comprendre les capacités et les limites des différents systèmes d'IA.</li>\n<li>La Délégation des tâches est le processus qui consiste à répartir de façon réfléchie le travail entre l'humain et l'IA afin de tirer parti des forces de chacun.</li>\n<li>Une délégation efficace exige une expertise du domaine et une compréhension des capacités de l'IA.</li>\n<li>L'objectif n'est pas de tout automatiser, mais de créer le partenariat humain-IA le plus efficace possible pour une tâche ou un objectif donné.</li>\n</ul>", "id": "c2-5-0-0"}, {"level": 4, "title": "Exercice", "children": [], "html": "<p><strong>Analyser une tâche avec un assistant IA</strong></p>\n<p><strong>Consignes :</strong></p>\n<ol>\n<li>Choisissez une tâche simple de votre vie professionnelle ou personnelle (comme rédiger un e-mail, préparer une présentation, ou organiser une réunion ou un événement).</li>\n<li>Démarrez une conversation avec Claude.</li>\n<li>Partagez avec Claude la tâche que vous envisagez de réaliser.<ul>\n<li>Par exemple : « Bonjour Claude, je m'apprête à réfléchir à la manière de [insérer la tâche], et j'aimerais en discuter avec toi pour élaborer un plan de délégation — afin de déterminer quelles parties je devrais déléguer à une IA comme toi, et lesquelles je ne devrais pas déléguer. Peux-t
