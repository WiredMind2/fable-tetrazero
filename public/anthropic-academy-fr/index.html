iscernement = un affinement puissant grâce à une itération porteuse de sens</p>\n<hr />", "id": "c3-2"}]}, {"num": 4, "title": "Leçon 4 : Maîtrise de l'IA pour les étudiants", "introHtml": "<blockquote>\n<p>Formation aux compétences de collaboration avec l'IA pour les étudiants<br />\nLien du cours : <a href=\"https://anthropic.skilljar.com/ai-fluency-for-students\">Maîtrise de l'IA pour les étudiants</a> | 6 leçons au total</p>\n</blockquote>\n<hr />", "tree": [{"level": 3, "title": "Leçon 1 : Introduction à la maîtrise de l'IA et au cadre des 4D", "children": [], "html": "<p>Maîtrise de l'IA = utiliser l'IA de manière efficace, efficiente, éthique et sûre grâce à des principes durables, plutôt qu'à des astuces ou des outils temporaires</p>\n<p>Cadre des 4D = quatre compétences interconnectées qui constituent ensemble la maîtrise de l'IA : la Délégation, la Description, le Discernement et la Diligence</p>\n<p>Augmentation vs Automatisation :<br />\n- Augmentation = l'IA vous aide à mieux faire votre travail (l'approche privilégiée dans l'apprentissage)<br />\n- Automatisation = l'IA fait le travail à votre place, sans réflexion approfondie (nuisible à l'apprentissage)</p>\n<p>Humain dans la boucle = prendre des décisions responsables et utiliser l'IA de manière réfléchie tout en conservant la maîtrise du processus</p>\n<p>DÉLÉGATION = décider quel travail doit être réalisé par les humains, par l'IA, ou par les deux ensemble</p>\n<p>Trois types de conscience de la délégation :<br />\n- Conscience du problème = clarifier l'objectif réel avant d'utiliser l'IA<br />\n- Conscience de la plateforme = comprendre les capacités et les limites des différentes IA, afin de choisir le bon outil<br />\n- Délégation des tâches = répartir le travail pour tirer parti des forces humaines (créativité, jugement, compréhension du contexte) et des forces de l'IA (rapidité, cohérence, traitement de l'information)</p>\n<p>DESCRIPTION = comment avoir une conversation collaborative avec l'IA, plutôt que de simplement poser des questions</p>\n<p>Trois dimensions de la Description :<br />\n- Description du produit = préciser les détails du résultat final (longueur, messages clés, public, style, format)<br />\n- Description du processus = guider l'approche de l'IA (« réfléchis étape par étape », « envisage plusieurs perspectives »)<br />\n- Description de la performance = définir le comportement de l'IA pendant l'interaction (jouer le rôle d'un éditeur critique, d'un partenaire de brainstorming bienveillant)</p>\n<p>DISCERNEMENT = reconnaître les bons et les mauvais résultats grâce à une évaluation critique, et ajuster en conséquence</p>\n<p>Trois niveaux de Discernement :<br />\n- Discernement du produit = évaluer l'exactitude, l'utilité et la nouveauté de perspective du résultat produit par l'IA<br />\n- Discernement du processus = examiner le raisonnement, les hypothèses et les étapes logiques de l'IA<br />\n- Discernement de la performance = évaluer si l'IA se montre utile dans le rôle qu'on lui a demandé de jouer</p>\n<p>Boucle Description-Discernement = une boucle de rétroaction continue dans laquelle vous décrivez vos besoins, évaluez les résultats, puis affinez votre description de manière itérative</p>\n<p>DILIGENCE = assumer la responsabilité de l'utilisation de l'IA à travers des pratiques éthiques, transparentes et responsables</p>\n<p>Trois types de Diligence :<br />\n- Diligence de création = choisir les systèmes d'IA de manière réfléchie, en tenant compte de la confidentialité, de la sécurité et de la pertinence<br />\n- Diligence de transparence = rendre compte honnêtement de sa collaboration avec l'IA auprès des professeurs, des coéquipiers et des employeurs<br />\n- Diligence de déploiement = assumer la responsabilité des résultats produits avec l'aide de l'IA, en vérifiant leur exactitude et en s'assurant de leur pertinence</p>\n<p>Document de contexte d'apprentissage = un document de référence personnalisé permettant d'établir son parcours académique, ses objectifs d'apprentissage, les limites d'usage de l'IA et ses préférences de collaboration pour les futures sessions avec l'IA</p>\n<p>Éléments clés du contexte d'apprentissage :<br />\n- Parcours académique (filière, cours, forces/faiblesses, objectifs)<br />\n- Style d'apprentissage et difficultés rencontrées<br />\n- Expérience avec l'IA et limites d'utilisation<br />\n- Type de soutien préféré (recherche de conseils vs réalisation de tâches)<br />\n- Considérations d'intégrité académique</p>\n<p>Principe fondamental = les compétences de maîtrise de l'IA sont indépendantes de l'évolution technologique, car elles portent sur la pensée stratégique, la communication, l'évaluation et la responsabilité éthique, et non sur des outils spécifiques</p>\n<hr />", "id": "c4-0"}, {"level": 3, "title": "Leçon 3 : Appliquer l'IA à la planification de carrière", "children": [], "html": "<p>Appliquer l'IA à la planification de carrière = utiliser l'IA comme partenaire de réflexion pour l'exploration de carrière, le développement de compétences et la recherche d'emploi, tout en préservant son authenticité</p>\n<p>Principe fondamental = l'IA se charge de la collecte d'informations et de l'orientation, les humains pilotent la stratégie, les décisions et les valeurs</p>\n<p>Processus d'exploration de carrière :<br />\n- Forces de l'IA = recherche sectorielle, analyse des tendances, identification des écarts de compétences, informations sur les salaires, planification de trajectoire de carrière, brainstorming de métiers<br />\n- Responsabilités humaines = conscience de soi, valeurs, compromis, objectifs de vie, intuition<br />\n- Processus en deux étapes = collecte d'informations (IA) + réflexion personnelle (humain)</p>\n<p>Tâches d'exploration de carrière avec l'IA :<br />\n- Recherche sectorielle = « Dans la technologie durable, quels métiers émergents combinent sciences de l'environnement et analyse de données ? »<br />\n- Analyse des écarts de compétences = « En quoi les compétences attendues par les employeurs pour un designer UX diffèrent-elles de celles enseignées dans les bootcamps ? »<br />\n- Informations sur le marché = « Par ville, quelle est la progression salariale réelle pour les consultants débutants ? »<br />\n- Trajectoire de carrière = « Quels sont les parcours possibles pour passer d'un poste d'enseignant à la formation en entreprise ? »<br />\n- Brainstorming de métiers = « Quels métiers valorisent des compétences journalistiques tout en étant plus stables ? »<br />\n- Clarification des valeurs = l'IA pose des questions pour aider à clarifier les objectifs et les valeurs de carrière</p>\n<p>Utiliser l'IA pour le développement de compétences :<br />\n- Clarifier ses besoins d'apprentissage = plutôt que « aide-moi à apprendre l'analyse de données », dites « en tant que responsable marketing, j'ai besoin d'apprendre l'analyse d'enquêtes clients, en commençant par les tableaux croisés dynamiques Excel »<br />\n- L'IA comme coach = créer des mises en situation, donner un retour sur des exemples, mener des jeux de rôle<br />\n- Vérifications actives d'apprentissage = évaluer régulièrement si vous progressez réellement ou si vous vous contentez d'exécuter les gestes</p>\n<p>Applications pour la recherche d'emploi :<br />\n- Règle de base = l'IA se charge du brainstorming, de l'orientation et de la rédaction ; les humains présentent leur véritable personne<br />\n- Tâches de l'IA = identifier les compétences transférables, s'entraîner aux questions d'entretien, trouver des angles originaux pour la lettre de motivation<br />\n- Responsabilités humaines = expertise, objectifs de carrière, identité personnelle authentique, les documents finaux</p>\n<p>Le problème du contenu générique produit par l'IA = les recruteurs reconnaissent immédiatement les CV et lettres de motivation générés par l'IA et les considèrent comme non valables</p>\n<p>Parcours de développement de carrière :<br />\nPartie 1 - Exploration de carrière (15 minutes) :<br />\n- Partagez votre parcours avec l'IA<br />\n- Recherchez des métiers utilisant des compétences similaires, des rôles émergents, la progression salariale, le contenu du travail quotidien<br />\n- Engagez avec l'IA une réflexion personnelle guidée sur vos sources d'énergie, vos compromis, vos valeurs et votre définition de la réussite<br />\n- Créez une carte de carrière avec 2 à 3 métiers cibles et les écarts de compétences correspondants</p>\n<p>Partie 2 - Amélioration du CV (15 minutes) :<br />\n- Étape 1 : l'IA examine votre CV actuel de manière critique par rapport à une offre d'emploi précise<br />\n- Étape 2 : l'IA recueille des informations pour combler les points à améliorer<br />\n- Étape 3 : révisez le CV avec un langage plus percutant, en vous appuyant sur votre expérience réelle</p>\n<p>Partie 3 - Préparation à l'entretien (15 minutes) :<br />\n- L'IA analyse le poste et pose 5 questions réalistes<br />\n- Une question à la fois, avec des relances<br />\n- Entraînez-vous avec des exemples concrets<br />\n- L'IA fournit un retour sur le contenu, la clarté et la pertinence</p>\n<p>Consignes clés :<br />\n- L'IA vous aide à vous entraîner et à vous préparer, mais dans les situations réelles, les humains doivent rester authentiques<br />\n- Ne récitez pas un script ; comprenez vos propres expériences afin de pouvoir en parler avec souplesse<br />\n- Les employeurs veulent vous engager vous, pas une version IA de vous<br />\n- La maîtrise de l'IA est en elle-même une compétence de carrière précieuse à mettre en avant<br />\n- Documentez vos interactions avec l'IA et soyez transparent sur son assistance lorsque cela est pertinent</p>\n<p>Principe d'authenticité = l'IA peut vous aider à mieux raconter votre histoire, mais cette histoire commence et se termine avec votre propre expertise</p>\n<hr />", "id": "c4-1"}, {"level": 3, "title": "Leçon 4 : Être l'humain dans la boucle", "children": [], "html": "<p><strong>Leçon 4 : Être l'humain dans la boucle</strong></p>\n<p><strong>Concept central</strong><br />\nHumain dans la boucle = dans toutes les interactions avec l'IA, l'humain conserve le pouvoir de décision. Vous décidez ce qu'il faut demander, vous évaluez l'exactitude et la pertinence du résultat produit par l'IA, et vous jugez si ce résultat est utilisable. Apportez votre jugement, votre créativité et vos considérations éthiques à chaque interaction.</p>\n<p><strong>Principes clés</strong><br />\n- Maîtrise de l'IA = collaborer avec l'IA de manière sûre, efficiente, efficace et responsable<br />\n- Les leaders de demain = ceux qui sauront collaborer de manière réfléchie avec les systèmes d'IA<br />\n- Votre humanité = unique et précieuse (talents, expériences, connaissances, perspectives)<br />\n- L'IA renforce les capacités humaines, mais ne peut pas remplacer l'intuition, le jugement et l'attention humaine</p>\n<p><strong>Composantes essentielles de la maîtrise de l'IA</strong><br />\n- Déléguer de manière réfléchie<br />\n- Décrire ses besoins clairement<br />\n- Réfléchir de manière critique aux résultats produits<br />\n- Assurer un suivi rigoureux</p>\n<p><strong>Structure d'une stratégie personnelle de collaboration avec l'IA</strong></p>\n<p><strong>Partie 1 : Limites d'utilisation</strong><br />\n- Définir dans quels cas il est approprié d'utiliser l'IA (entraînement, exploration, construction de la compréhension)<br />\n- Définir dans quels cas vous devez travailler de manière autonome (examens, démonstration de la maîtrise, réflexion originale)<br />\n- Identifier les contextes professionnels où l'IA peut apporter de la valeur<br />\n- Fixer des « lignes rouges » = des situations où vous n'utiliserez jamais l'IA</p>\n<p><strong>Partie 2 : Applications pédagogiques</strong><br />\n- Utiliser l'IA comme tuteur/coach, et non comme exécutant des devoirs<br />\n- Conserver la capacité d'expliquer tout ce que vous rendez<br />\n- Utiliser l'IA pour approfondir sa compréhension, non pour la contourner<br />\n- Documenter les stratégies spécifiques qui fonctionnent</p>\n<p><strong>Partie 3 : Normes de transparence</strong><br />\n- Quand divulguer spontanément le recours à l'IA<br />\n- Comment documenter les contributions de l'IA<br />\n- Le niveau de détail à fournir<br />\n- La gestion des situations ambiguës</p>\n<p><strong>Partie 4 : Maintien des compétences</strong><br />\n- Les compétences fondamentales qui doivent être pratiquées sans IA<br />\n- Des périodes de travail « sans IA » programmées régulièrement<br />\n- Des méthodes pour vérifier que l'apprentissage se poursuit<br />\n- Les signaux d'alerte d'une dépendance excessive (et d'une sous-utilisation)</p>\n<p><strong>Partie 5 : Lignes directrices éthiques</strong><br />\n- Responsabilité de l'exactitude et de la vérification des faits<br />\n- Respect du travail et des idées d'autrui<br />\n- Considérations relatives à la confidentialité et aux données<br />\n- Les impacts plus larges de l'usage de l'IA/des ordinateurs</p>\n<p><strong>Partie 6 : Croissance continue</strong><br />\n- Se tenir informé des capacités de l'IA<br />\n- Des moments réguliers de réflexion<br />\n- Un processus d'ajustement de sa stratégie<br />\n- Partager ses connaissances avec les autres</p>\n<p><strong>Questions de réflexion clés</strong><br />\n- Mes interactions avec l'IA m'aident-elles à progresser ?<br />\n- Suis-je en train de développer les compétences dont j'aurai besoin à l'avenir, ou me contente-je d'accomplir des tâches ?<br />\n- Suis-je honnête sur le rôle de l'IA dans mon travail ?<br />\n- La façon dont j'utilise l'IA est-elle alignée avec mes valeurs ?</p>\n<p><strong>Consignes de mise en œuvre</strong><br />\n- Gardez une stratégie réaliste, en tenant compte des contextes et contraintes spécifiques<br />\n- La stratégie doit être suffisamment concise pour être réellement consultée<br />\n- Incluez une date de création et un plan de mise à jour<br />\n- Enregistrez-la dans plusieurs endroits facilement accessibles<br />\n- Entraînez-vous à l'appliquer dans des situations réelles<br />\n- Partagez-la et discutez-en avec d'autres afin de renforcer votre engagement</p>\n<p><strong>Éléments de fin de cours</strong><br />\n- Le cadre des 4D pour une interaction réfléchie avec l'IA<br />\n- Une approche d'apprentissage enrichie par l'IA conçue pour renforcer le talent plutôt que le remplacer<br />\n- Un état d'esprit de carrière enrichi par l'IA qui préserve l'authenticité<br />\n- Une stratégie personnelle d'IA qui reflète vos valeurs personnelles<br />\n- Une base pour devenir un leader de l'IA</p>\n<p><strong>Prochaines étapes</strong><br />\n- Mettez en œuvre votre stratégie dès maintenant<br />\n- Partagez vos apprentissages avec vos pairs<br />\n- Ajoutez la « maîtrise de l'IA » à votre CV, avec des preuves à l'appui<br />\n- Restez curieux quant à l'évolution de l'IA<br />\n- Contribuez à façonner un usage positif de l'IA au sein de votre communauté</p>\n<hr />", "id": "c4-2"}, {"level": 3, "title": "Leçon 2 : L'IA comme partenaire d'apprentissage", "children": [], "html": "<p><strong>Le cadre de l'IA comme partenaire d'apprentissage</strong></p>\n<p>Distinction centrale = utiliser l'IA pour faire le travail vs utiliser l'IA pour apprendre<br />\n- L'IA qui fait le travail = intelligence empruntée qui affaiblit la pensée critique<br />\n- L'IA comme partenaire d'apprentissage = construire des connaissances et renforcer ses capacités</p>\n<p><strong>Conséquences de la dépendance à l'IA</strong><br />\n- Échouer aux examens sans le soutien de l'IA<br />\n- Avoir du mal à expliquer son raisonnement lors d'entretiens d'embauche<br />\n- Être incapable d'évaluer la qualité des suggestions de l'IA<br />\n- Une capacité inadéquate à résoudre des problèmes du monde réel</p>\n<p><strong>Le cadre des 4D dans un contexte d'apprentissage</strong></p>\n<p><strong>Délégation (axée sur l'apprentissage)</strong><br />\nConscience du problème = avant d'utiliser l'IA, demandez-vous : Que veux-je apprendre ? Quels sont mes objectifs d'apprentissage ?<br />\nRépartition des tâches = conservez les tâches essentielles à l'apprentissage (comme rédiger une argumentation), déléguez les tâches de soutien (comme jouer le rôle d'un partenaire de débat)<br />\nSélection de la plateforme = choisissez des systèmes d'IA conçus pour l'apprentissage plutôt que pour donner des réponses rapides</p>\n<p><strong>Description (configuration pour l'apprentissage)</strong><br />\nComportement par défaut de l'IA = conçu pour donner des réponses directement (peu utile pour l'apprentissage)<br />\nPrompts d'apprentissage = configurer l'IA comme un tuteur/coach plutôt que comme un fournisseur de réponses<br />\nDescriptions efficaces :<br />\n- « Pose-moi des questions au lieu de m'expliquer directement »<br />\n- « Guide-moi vers la solution, mais ne la résous pas directement »<br />\n- « Aide-moi à approfondir ma compréhension »</p>\n<p><strong>Résultats d'apprentissage utiles produits par l'IA :</strong><br />\n- Indices/pistes pour les problèmes difficiles<br />\n- Questions qui testent la compréhension<br />\n- Retours critiques sous différents angles<br />\n- Ré-expliquer des concepts avec de nouveaux exemples<br />\n- Exercices pratiques progressifs<br />\n- Jouer le rôle de l'élève afin que vous puissiez lui enseigner</p>\n<p><strong>Discernement (évaluation de l'apprentissage)</strong><br />\nQuestions de vérification de l'apprentissage :<br />\n- Puis-je expliquer ce concept à quelqu'un d'autre ?<br />\n- Sans l'IA, puis-je résoudre un problème similaire ?<br />\n- Comprends-je le « pourquoi », et pas seulement le fait que « ça fonctionne » ?</p>\n<p>Compréhension véritable vs simple suivi = faites confiance à votre sentiment intérieur de compréhension<br />\nVérification de l'information = recouper le contenu d'apprentissage de l'IA avec des sources non liées à l'IA</p>\n<p><strong>Diligence (intégrité académique)</strong><br />\nDiligence de création = respectez la politique de votre établissement en matière d'IA, utilisez des systèmes approuvés<br />\nDiligence de transparence = documentez vos interactions avec l'IA, développez des compétences de divulgation<br />\nDiligence de déploiement = vous devez être capable d'expliquer chaque partie d'un devoir rendu, et d'appliquer les concepts à de nouvelles situations</p>\n<p><strong>Structure de l'exercice</strong></p>\n<p><strong>Partie 1 : Mise en place d'un partenaire d'apprentissage IA (15-30 minutes)</strong><br />\nÉtapes de configuration :<br />\n- Partagez le contexte d'apprentissage de la Leçon 1<br />\n- Partagez des transcriptions vidéo pour aider l'IA à comprendre<br />\n- Clarifiez vos objectifs d'apprentissage par rapport aux objectifs de simple réalisation du devoir<br />\n- Définissez une approche par questionnement plutôt qu'une approche de réponse directe</p>\n<p>Protocoles d'apprentissage à la demande :<br />\n- Résolution de problèmes = ne fournir que des indices/questions<br />\n- Révision de concepts = tests de difficulté progressive<br />\n- Préparation aux examens = donner des quiz et expliquer les réponses erronées<br />\n- Rédaction = développer des arguments par le questionnement<br />\n- Lecture = expliquer les concepts avec ses propres mots<br />\n- Planification de devoirs = tester la compréhension des consignes</p>\n<p><strong>Partie 2 : Journal d'apprentissage dynamique (15-30 minutes)</strong><br />\nStructure du journal :<br />\n- Résumé hebdomadaire des concepts appris<br />\n- Évaluation de la clarté de la compréhension<br />\n- Enregistrement de l'utilisation de l'IA pour l'apprentissage<br />\n- Identification des stratégies d'apprentissage efficaces<br />\n- Identification des besoins de pratique<br />\n- Notes sur le développement de compétences spécifiques</p>\n<p>Système de suivi :<br />\n- Journal hebdomadaire recommandé<br />\n- Analyse mensuelle complète pour repérer des tendances<br />\n- Annoter le travail assisté par l'IA par rapport au travail réalisé de manière autonome<br />\n- Enregistrer les « moments de révélation »<br />\n- Renforcer son engagement grâce à des invites de réflexion</p>\n<p><strong>Résultats clés</strong><br />\nBénéfices à long terme = compréhension véritable, capacité de résolution de problèmes, confiance en entretien, capacité à évaluer les suggestions de l'IA, valeur sur le marché du travail<br />\nMentalité d'investissement = développer des capacités de réflexion, d'apprentissage et d'adaptation qui vont au-delà de la simple réalisation des devoirs<br />\nAvantage compétitif = dans un monde où l'IA est à portée de main, posséder des compétences d'intelligence, de créativité et de jugement humaines</p>\n<hr />", "id": "c4-3"}]}, {"num": 5, "title": "Leçon 5 : La maîtrise de l'IA pour les associations", "introHtml": "<blockquote>\n<p>Maîtrise de l'IA et guide pratique pour les associations<br />\nLien du cours : <a href=\"https://anthropic.skilljar.com/ai-fluency-for-nonprofits\">La maîtrise de l'IA pour les associations</a> | 10 leçons au total</p>\n</blockquote>\n<hr />", "tree": [{"level": 2, "title": "Bienvenue dans « La maîtrise de l'IA pour les associations »", "children": [], "html": "<p>Ce que vous allez apprendre</p>\n<p>Durée estimée : 20 minutes</p>\n<p>À la fin de cette leçon, vous serez capable de :</p>\n<ul>\n<li>Définir ce que signifie la maîtrise de l'IA</li>\n<li>Formuler vos valeurs et vos contraintes afin de collaborer plus efficacement avec l'IA</li>\n<li>Identifier vos objectifs pour intégrer les outils et les capacités de l'IA dans votre travail</li>\n</ul>\n<p>Bienvenue dans « La maîtrise de l'IA pour les associations »</p>\n<p>(3 minutes)</p>\n<p>Cette vidéo présente notre cours « La maîtrise de l'IA pour les associations ». Elle reconnaît l'écart existant dans le secteur entre l'enthousiasme pour l'IA et sa mise en œuvre concrète, et introduit le concept de maîtrise de l'IA : la capacité à collaborer avec les systèmes d'IA de manière efficace, efficiente, éthique et sûre. La vidéo présente le cadre des 4D qui constitue le socle du cours — Délégation, Description, Discernement et Diligence — et souligne qu'une réflexion centrée sur la mission doit guider toutes les applications de l'IA au sein d'une association.</p>\n<p>Points clés à retenir<br />\n- La maîtrise de l'IA est la capacité à utiliser l'IA de manière efficiente, efficace, éthique et sûre. Elle combine compétences pratiques, connaissances, discernement et valeurs pour vous aider à vous adapter à l'évolution des technologies d'IA tout en restant fidèle à la mission de votre association.<br />\n- Le cadre des 4D comprend quatre compétences interconnectées : Délégation, Description, Discernement et Diligence.<br />\n- La boucle Délégation-Diligence favorise des choix réfléchis et responsables sur le moment et la manière d'utiliser l'IA.<br />\n- La boucle Description-Discernement vous permet de tirer davantage parti de vos interactions avec l'IA grâce à des échanges itératifs.<br />\n- Pour les associations, tout gain d'efficacité obtenu grâce à l'IA doit, en définitive, se traduire par un impact accru pour les communautés que vous servez.</p>\n<p>Exercice<br />\nDéfinir les valeurs, la mission et les objectifs de votre organisation pour l'utilisation de l'IA</p>\n<p>Cet exercice vous aidera à préciser l'objectif de votre collaboration avec l'IA dans votre travail. Cette base vous permettra d'évaluer les opportunités liées à l'IA à travers le prisme de votre mission.</p>\n<p>Partie 1 : Auto-réflexion (à réaliser seul)</p>\n<p>Répondez aux questions suivantes :</p>\n<ul>\n<li>Quelle est la mission et la vision de votre organisation ?</li>\n<li>Décrivez votre environnement de travail et votre rôle spécifique — contraintes, forces, opportunités, etc.</li>\n<li>Quelles sont les valeurs fondamentales et la philosophie qui structurent votre travail ?</li>\n<li>« Si l'IA pouvait m'aider à <strong><em>_</em></strong>, je pourrais consacrer plus de temps à <strong><em>_</em></strong>. » Concentrez-vous sur la manière dont l'efficacité apportée par l'IA peut vous libérer pour vous engager dans des activités plus impactantes et centrées sur l'humain.</li>\n</ul>\n<p>Partie 2 : Collaboration (avec l'IA)</p>\n<p>Engagez une conversation avec Claude (ou tout autre assistant IA de votre choix) :</p>\n<p>Ouvrez la conversation :</p>\n<ul>\n<li>Expliquez que vous êtes un professionnel du secteur associatif souhaitant créer un résumé réutilisable pour votre organisation et votre travail.</li>\n<li>Indiquez à l'IA que ce document permettra d'établir une compréhension commune pour de futures collaborations.</li>\n<li>Précisez que vous souhaitez que l'IA vous aide à examiner tous les aspects pertinents de votre travail.</li>\n<li>Vous pouvez demander à l'IA de vous interviewer sur votre travail, ou</li>\n<li>Vous pouvez simplement commencer à partager des informations et demander à l'IA quelles autres informations utiles il serait bon de connaître.</li>\n</ul>\n<p>Prenez votre temps. L'objectif est d'avoir une conversation itérative qui fait émerger un contexte important.</p>\n<p>Points essentiels à aborder (l'IA devrait vous aider à explorer ces aspects) :</p>\n<ul>\n<li>La mission, la vision et les valeurs de votre organisation</li>\n<li>Le périmètre habituel des missions liées à votre rôle</li>\n<li>Les défis habituels auxquels votre organisation est confrontée</li>\n<li>Le contexte institutionnel et les contraintes</li>\n<li>Les opportunités d'amélioration</li>\n<li>Les points de friction courants dans votre travail</li>\n<li>Les objectifs d'intégration de l'IA dans votre travail</li>\n<li>Tout élément propre à votre rôle ou à votre organisation</li>\n</ul>\n<p>Facilitez la conversation :</p>\n<ul>\n<li>Vous n'êtes pas obligé de tout partager d'un coup.</li>\n<li>Encouragez l'IA à poser des questions de suivi.</li>\n<li>Partagez des exemples concrets lorsqu'ils aident à illustrer votre contexte (en gardant à l'esprit la confidentialité et les données sensibles).</li>\n<li>Il est tout à fait normal de réfléchir à voix haute et d'affiner progressivement vos idées au fil de la conversation.</li>\n</ul>\n<p>Créez un document réutilisable :</p>\n<ul>\n<li>Demandez à l'IA de consolider la conversation en un document de contexte structuré que vous pourrez partager lors de futures conversations avec une IA.</li>\n<li>Relisez-le avec l'IA et ajoutez tout élément manquant et/ou apportez des corrections.</li>\n<li>Demandez un format facile à copier et à réutiliser.</li>\n</ul>\n<p>Réflexion sur la leçon<br />\n- En quoi vos réponses aux questions d'auto-réflexion ont-elles influencé votre conversation avec l'IA ? De nouvelles priorités ou préoccupations sont-elles apparues ?<br />\n- En examinant votre document de contexte, quels aspects de votre travail associatif vous semblent le plus susceptibles de bénéficier d'une collaboration avec l'IA ?</p>\n<p>Prochaines étapes</p>\n<p>Dans la prochaine leçon, nous examinerons plus en détail le cadre des 4D, qui pose les fondations du reste de ce cours.</p>\n<p>Retour d'expérience</p>\n<p>Au fil de votre progression, nous aimerions savoir comment vous appliquez les concepts de ce cours à votre travail, ainsi que tout retour que vous souhaiteriez partager. Partagez votre retour d'expérience ici.</p>\n<p>Remerciements et licence</p>\n<p>Copyright 2025 Anthropic et Giving Tuesday. Basé sur le cadre de maîtrise de l'IA développé par le professeur Rick Dakan (Ringling College of Art and Design) et le professeur Joseph Feller (University College Cork). Publié sous licence CC BY-NC-SA 4.0.</p>\n<hr />", "id": "c5-0"}, {"level": 2, "title": "Le cadre des 4D", "children": [], "html": "<p>Ce que vous allez apprendre</p>\n<p>Durée estimée : 30 minutes</p>\n<p>À la fin de cette leçon, vous serez capable de :</p>\n<ul>\n<li>Expliquer comment le cadre de maîtrise de l'IA (4D) s'applique au travail associatif</li>\n<li>Définir chacun des quatre D — Délégation, Description, Discernement et Diligence</li>\n</ul>\n<p>Le cadre des 4D</p>\n<p>(6 minutes)</p>\n<p>Cette vidéo présente les quatre compétences interconnectées qui constituent le socle de la maîtrise de l'IA : le cadre des 4D. Vous découvrirez deux schémas d'interaction : la boucle Délégation-Diligence pour décider quand et si utiliser l'IA, et la boucle Description-Discernement pour utiliser l'IA efficacement au quotidien. Chaque compétence est décomposée en trois sous-composantes, accompagnées d'exemples concrets pour les associations.</p>\n<p>Points clés à retenir<br />\n- La <strong>boucle Délégation-Diligence</strong> guide les décisions de plus haut niveau sur le moment d'utiliser l'IA.<br />\n  - La <strong>Délégation</strong> consiste à décider quel travail doit être réalisé par des humains et lequel par l'IA. Elle inclut la <strong>Conscience du problème</strong> (comprendre vos objectifs), la <strong>Conscience de la plateforme</strong> (comprendre les capacités et les limites de vos outils) et la <strong>Délégation des tâches</strong> (répartir le travail de manière réfléchie).<br />\n  - La <strong>Diligence</strong> signifie assumer la responsabilité de votre usage de l'IA. Elle inclut la <strong>Diligence de création</strong> (choisir consciemment quels outils utiliser), la <strong>Diligence de transparence</strong> (être honnête sur le rôle de l'IA) et la <strong>Diligence de déploiement</strong> (vérifier les résultats et en assumer la responsabilité).<br />\n- La <strong>boucle Description-Discernement</strong> guide les interactions efficaces au quotidien.<br />\n  - La <strong>Description</strong> est la manière dont vous communiquez efficacement avec les systèmes d'IA. Elle inclut la <strong>Description du produit</strong> (définir le résultat attendu), la <strong>Description du processus</strong> (guider la démarche) et la <strong>Description de la performance</strong> (façonner le comportement de l'IA pendant la collaboration).<br />\n  - Le <strong>Discernement</strong> signifie évaluer de manière critique le travail de l'IA. Il inclut le <strong>Discernement du produit</strong> (évaluer la qualité), le <strong>Discernement du processus</strong> (évaluer comment l'IA est arrivée au résultat) et le <strong>Discernement de la performance</strong> (évaluer le comportement de l'IA).</p>\n<p>Exercice</p>\n<p>Exercice n° 1 : Cartographier vos besoins en IA</p>\n<p>Pourquoi ? Cet exercice révèle les compétences de la maîtrise de l'IA que vous avez déjà en tête et celles qui nécessitent votre attention, afin que vous puissiez investir votre effort là où il compte le plus.</p>\n<ul>\n<li><strong>Auto-réflexion</strong> : Notez la liste de vos questions et préoccupations concernant l'utilisation de l'IA.</li>\n<li><strong>Collaboration</strong> : Engagez une conversation avec l'IA. Demandez-lui : « Peux-tu m'aider à comprendre à quelle partie du cadre des 4D de la maîtrise de l'IA appartient chacune de ces questions et préoccupations ? »</li>\n<li><strong>Réflexion</strong> : Sous laquelle des 4 compétences la majorité de vos questions et préoccupations se classent-elles ?</li>\n<li>Ce schéma révèle votre point de focalisation actuel. S'agit-il du domaine que vous devez le plus développer, ou évitez-vous une compétence plus difficile qui pourrait débloquer davantage de progrès ?</li>\n<li>En fonction de la compétence que vous décidez de prioriser en premier, quelle est une chose précise que vous ferez différemment la prochaine fois que vous utiliserez l'IA ?</li>\n</ul>\n<p>Exercice n° 2 : Identifier un défi transversal aux compétences (objectif de dépassement)</p>\n<p>Objectif de dépassement = comprendre que chaque fois que vous interagissez avec l'IA, vous mobilisez (ou devriez mobiliser) chacune de ces compétences de manière interconnectée.</p>\n<p>Après avoir associé vos questions aux 4D, identifiez un domaine où vous devez développer plusieurs compétences simultanément afin d'avancer efficacement.</p>\n<p>Par exemple :</p>\n<ul>\n<li>« Je réalise que j'ai besoin à la fois de compétences en <strong>Délégation</strong> (décider si l'IA doit aider à la communication avec les bénévoles) et en <strong>Diligence</strong> (garantir la protection de la vie privée des bénévoles) avant de pouvoir avancer. »</li>\n<li>« Mes préoccupations en matière de <strong>Discernement</strong> concernant l'exactitude n'ont pas d'importance avant que je développe d'abord des compétences en <strong>Description</strong> pour obtenir de meilleurs résultats. »</li>\n</ul>\n<p>Réflexion sur la leçon<br />\n- En observant les questions et préoccupations que vous avez cartographiées, avez-vous été surpris par la compétence dominante ? Que cela révèle-t-il éventuellement sur votre relation actuelle avec l'IA ?<br />\n- En quoi les deux boucles (Délégation-Diligence et Description-Discernement) auraient-elles pu changer une de vos interactions récentes avec l'IA ?</p>\n<p>Prochaines étapes</p>\n<p>Dans la prochaine leçon, nous mettrons en pratique la Description et le Discernement, et vous apprendrez à faire des recherches et à rédiger efficacement avec l'IA — des compétences directement applicables aux demandes de subvention, aux communications avec les donateurs et aux supports de programme.</p>\n<p>Retour d'expérience</p>\n<p>Au fil de votre apprentissage, nous aimerions savoir comment vous appliquez les concepts de ce cours à votre travail, ainsi que tout retour que vous souhaiteriez partager. Partagez votre retour d'expérience ici.</p>\n<p>Remerciements et licence</p>\n<p>Copyright 2025 Anthropic et Giving Tuesday. Basé sur le cadre de maîtrise de l'IA développé par le professeur Rick Dakan (Ringling College of Art and Design) et le professeur Joseph Feller (University College Cork). Publié sous licence CC BY-NC-SA 4.0.</p>\n<hr />", "id": "c5-1"}, {"level": 2, "title": "Faire des recherches avec l'IA", "children": [], "html": "<p>Ce que vous allez apprendre</p>\n<p>Durée estimée : 50 minutes</p>\n<p>À la fin de cette leçon, vous serez capable de :</p>\n<ul>\n<li>Utiliser la compétence de Description pour élaborer des invites efficaces qui guident l'IA dans la collecte et la synthèse d'informations pertinentes pour votre travail associatif.</li>\n<li>Utiliser la compétence de Discernement pour évaluer les recherches générées par l'IA en termes d'exactitude, de pertinence et d'adéquation avec le contexte de votre association.</li>\n</ul>\n<p>Faire des recherches avec l'IA</p>\n<p>(7 minutes)</p>\n<p>Cette vidéo illustre la boucle Description-Discernement en action à travers un scénario de recherche. Vous suivrez Maria, directrice exécutive, alors qu'elle étend son association œuvrant dans le logement de Portland à Seattle, en utilisant l'IA pour étudier le contexte politique, les opportunités de financement et les exigences de conformité. La vidéo montre comment élaborer des invites informatives, évaluer de manière critique les résultats de l'IA, et itérer pour obtenir des résultats utiles.</p>\n<p>Points clés à retenir<br />\n- <strong>Une Description efficace fournit du contexte</strong> : ne vous contentez pas de poser des questions générales — expliquez qui vous êtes, qui vous servez et ce que vous avez précisément besoin de savoir. Ce contexte aide l'IA à fournir des informations pertinentes et exploitables.<br />\n- <strong>Le Discernement n'est pas optionnel</strong> : vous devez évaluer de manière critique le résultat produit par l'IA, en particulier lorsque l'exactitude est essentielle. Signalez les affirmations précises qui nécessitent une vérification, notez les lacunes d'information, et interrogez-vous sur l'actualité des informations.<br />\n- <strong>La boucle Description-Discernement est itérative</strong> : votre première invite fournit rarement tout ce dont vous avez besoin. Utilisez ce que vous apprenez en évaluant chaque réponse pour élaborer des questions de suivi meilleures et plus ciblées.<br />\n- <strong>L'IA accélère la recherche mais ne remplace pas l'expertise</strong> : l'IA peut vous aider à démarrer rapidement, mais vous restez le décideur et devez appliquer votre jugement professionnel à chaque livrable dont vous êtes responsable.</p>\n<p>Exercice 1 : Suivi des politiques et de la législation</p>\n<p>Cet exercice vous aide à pratiquer l'utilisation de la Description et du Discernement pour rechercher un domaine politique pertinent pour votre travail associatif.</p>\n<p>Partie 1 : Auto-réflexion</p>\n<p>Choisissez un domaine politique pertinent pour votre travail (politique du logement, financement de l'éducation, accès aux soins de santé, réglementation environnementale, etc.). Élaborez une invite de recherche qui comprend :</p>\n<ul>\n<li>La politique ou la législation spécifique sur laquelle vous souhaitez vous informer</li>\n<li>Le contexte de votre association (qui vous servez, pourquoi cela importe pour votre mission)</li>\n<li>Ce que vous avez besoin de savoir (impact sur les bénéficiaires, implications en matière de financement, exigences de conformité, opportunités de plaidoyer)</li>\n<li>Un horizon temporel ou un périmètre géographique</li>\n</ul>\n<p>Partie 2 : Collaboration</p>\n<p>Partagez votre invite avec l'IA et examinez la réponse. Appliquez le Discernement :</p>\n<ul>\n<li>Identifiez au moins 2 affirmations nécessitant une vérification.</li>\n<li>Signalez toute perspective manquante pertinente pour votre communauté.</li>\n<li>Repérez toute information qui semble obsolète ou trop générale.</li>\n</ul>\n<p>Partie 3 : Réflexion</p>\n<ul>\n<li>Votre invite initiale a-t-elle fourni à l'IA un contexte suffisamment utile ?</li>\n<li>Quels changements apporteriez-vous à votre invite lors d'une deuxième tentative ?</li>\n<li>Quelles étapes de vérification entreprendriez-vous avant d'utiliser cette information dans votre travail ?</li>\n</ul>\n<p><strong>Objectif de dépassement</strong> : demandez à l'IA de retracer une affirmation clé de son résumé jusqu'à sa source d'origine, et comparez la fidélité avec laquelle elle a représenté cette source.</p>\n<p>Exercice 2 : Recherche de donateurs ou de prospects de subvention</p>\n<p>Cet exercice applique la Description et le Discernement à la recherche de financement — un domaine à forts enjeux où l'exactitude est essentielle.</p>\n<p>Partie 1 : Auto-réflexion</p>\n<p>Choisissez le sujet de votre recherche (par exemple : des opportunités de subvention pour un programme spécifique, des donateurs d'entreprise de votre région dont les priorités philanthropiques sont pertinentes, ou des fondations susceptibles de financer des organisations comme la vôtre). Élaborez une invite de recherche qui comprend :</p>\n<ul>\n<li>La mission de votre organisation et le programme/besoin spécifique en recherche de financement</li>\n<li>Les caractéristiques de votre association (taille du budget, zone géographique, populations servies)</li>\n<li>Les paramètres de financement (montant de la subvention, dépenses éligibles, calendrier de candidature)</li>\n<li>Ce qui constitue une « bonne adéquation » au-delà de l'alignement thématique (valeurs, historique de dons, accessibilité)</li>\n</ul>\n<p>Partie 2 : Collaboration</p>\n<p>Partagez votre invite avec l'IA et examinez la réponse. Appliquez le Discernement :</p>\n<ul>\n<li>Vérifiez si les financeurs suggérés financent réellement des organisations de votre taille/type.</li>\n<li>Vérifiez les échéances de candidature actuelles et les conditions d'éligibilité.</li>\n<li>Identifiez toute information obsolète (programmes clos, priorités modifiées).</li>\n<li>Notez quels prospects s'alignent avec vos valeurs, et non seulement avec vos besoins budgétaires.</li>\n</ul>\n<p>Partie 3 : Réflexion</p>\n<ul>\n<li>L'IA a-t-elle compris ce qui fait qu'un financeur est « aligné » avec votre mission, et non simplement pertinent sur le plan thématique ?</li>\n<li>Quels détails essentiels devriez-vous vérifier avant d'investir du temps dans une candidature ?</li>\n<li>Quelles informations manquent à cette recherche que seul vous (ou votre réseau) sauriez ?</li>\n</ul>\n<p><strong>Objectif de dépassement</strong> : choisissez un financeur suggéré et demandez à l'IA de vous aider à rechercher ses subventions récentes, afin de comprendre ses pratiques de don réelles par rapport à ses priorités affichées.</p>\n<p>Réflexion sur la leçon<br />\n- Comparé à une invite plus générique, en quoi le fait de fournir du contexte sur votre association a-t-il changé la qualité des résultats de recherche de l'IA ?<br />\n- Quelles habitudes de vérification allez-vous intégrer à votre flux de travail lorsque vous utilisez l'IA pour la recherche ?</p>\n<p>Prochaines étapes</p>\n<p>Dans la prochaine leçon, nous explorerons les mêmes compétences de Description et de Discernement dans un contexte différent : la rédaction avec l'IA. Vous verrez comment cette boucle fonctionne lorsque vous créez du contenu plutôt que de collecter des informations.</p>\n<p>Retour d'expérience</p>\n<p>Au fil de votre apprentissage, nous aimerions savoir comment vous appliquez les concepts de ce cours à votre travail, ainsi que tout retour que vous souhaiteriez partager. Partagez votre retour d'expérience ici.</p>\n<p>Remerciements et licence</p>\n<p>Copyright 2025 Anthropic et Giving Tuesday. Basé sur le cadre de maîtrise de l'IA développé par le professeur Rick Dakan (Ringling College of Art and Design) et le professeur Joseph Feller (University College Cork). Publié sous licence CC BY-NC-SA 4.0.</p>\n<hr />", "id": "c5-2"}, {"level": 2, "title": "Rédiger avec l'IA", "children": [], "html": "<p>Ce que vous allez apprendre</p>\n<p>Durée estimée : 50 minutes</p>\n<p>À la fin de cette leçon, vous serez capable de :</p>\n<ul>\n<li>Appliquer la compétence de Description pour élaborer des invites claires et informatives qui guident l'IA dans la création ou l'amélioration de supports écrits adaptés à la mission de votre association et aux besoins de votre public.</li>\n<li>Appliquer la compétence de Discernement pour évaluer les supports écrits générés par l'IA en termes d'exactitude, de pertinence et d'alignement avec les valeurs et les normes de communication de votre organisation.</li>\n</ul>\n<p>Rédiger avec l'IA</p>\n<p>(7 minutes)</p>\n<p>Cette vidéo illustre la boucle Description-Discernement appliquée à la rédaction, avec un accent particulier sur le maintien de l'authenticité et du lien humain. Vous suivrez James, qui dirige une petite organisation de justice environnementale, alors qu'il utilise l'IA pour rédiger une demande de subvention urgente sous une contrainte de 48 heures. La vidéo montre comment fournir un contexte riche en téléchargeant des fichiers, comment guider l'approche de l'IA avec des instructions précises, et comment itérer grâce au Discernement pour finalement produire une proposition dont il peut être fier.</p>\n<p>Points clés à retenir<br />\n- <strong>Téléchargez vos travaux antérieurs réussis</strong> pour aider l'IA à comprendre la voix et l'approche de votre organisation — cela fait gagner du temps et améliore l'authenticité.<br />\n- <strong>Injectez des détails que l'IA ne connaît pas</strong> : votre bilan, vos partenariats, l'expertise de votre équipe et vos véritables relations communautaires.<br />\n- <strong>Soyez précis lors des révisions</strong> : au lieu de dire « rends cela plus persuasif », dites « ajoute ces détails précis sur nos relations communautaires ».<br />\n- <strong>Laissez votre expertise guider chaque révision</strong> : l'IA vous aide à écrire plus vite, mais c'est vous qui façonnez le fond du contenu.<br />\n- <strong>Construisez un environnement cognitif</strong> : les échanges entre l'humain et l'IA aident l'outil à s'aligner progressivement sur vos besoins spécifiques.<br />\n- <strong>Assumez la responsabilité du résultat final</strong> : lorsque vous soumettez un travail assisté par l'IA, vous devez être capable de défendre chaque mot, car vous avez appliqué le Discernement à chaque étape du processus.</p>\n<p>Exercice 1 : Demande de subvention</p>\n<p>Cet exercice vous aide à pratiquer l'utilisation de la Description et du Discernement pour créer un contenu de collecte de fonds à forts enjeux qui représente authentiquement votre organisation.</p>\n<p>Partie 1 : Auto-réflexion</p>\n<p>Choisissez un projet ou une initiative pour lequel vous avez besoin de financement. Élaborez une invite de rédaction qui comprend :</p>\n<ul>\n<li>L'opportunité de subvention et ce à quoi le financeur attache de l'importance</li>\n<li>Les détails clés de votre projet (qui, quoi, où, résultats)</li>\n<li>Le style et les valeurs de votre organisation</li>\n<li>Des exigences précises (limite de mots, éléments requis, ton)</li>\n<li>Ce qui rend votre approche unique ou efficace</li>\n</ul>\n<p>Partie 2 : Collaboration</p>\n<p>Partagez votre invite avec l'IA et examinez le brouillon. Appliquez le Discernement :</p>\n<ul>\n<li>Vérifiez que toutes les données et résultats mentionnés sont exacts.</li>\n<li>Vérifiez si le langage reflète le style authentique de votre organisation, ou s'il paraît générique.</li>\n<li>Identifiez tout cadrage à partir de manques ou tout langage problématique concernant les bénéficiaires.</li>\n<li>Évaluez si le texte répond aux priorités du financeur, ou s'il se contente de décrire votre programme.</li>\n<li>Signalez ce qui manque sur votre travail que seul vous savez.</li>\n</ul>\n<p>Partie 3 : Réflexion</p>\n<ul>\n<li>Quel contexte aviez-vous initialement oublié d'inclure et qui aurait pu améliorer le brouillon ?</li>\n<li>Quels changements apporteriez-vous à votre invite pour mieux saisir l'approche unique de votre organisation ?</li>\n<li>Quelles parties du brouillon de l'IA sont utilisables, et lesquelles doivent être entièrement récrites ?</li>\n</ul>\n<p><strong>Objectif de dépassement</strong> : pour un problème de ton ou de cadrage que vous avez identifié, itérez sur votre invite avec un retour précis, puis comparez les deux versions pour voir comment la Description améliorée a influencé la qualité du résultat.</p>\n<p>Exercice 2 : Publication sur les réseaux sociaux</p>\n<p>Cet exercice applique la Description et le Discernement à un contenu qui doit refléter la voix authentique de votre organisation auprès du public.</p>\n<p>Partie 1 : Auto-réflexion</p>\n<p>Choisissez votre objectif de contenu :</p>\n<ul>\n<li>Mettre en avant l'impact d'un programme ou une réussite</li>\n<li>Promouvoir un événement ou une campagne à venir</li>\n<li>Partager un contenu éducatif lié à votre mission</li>\n<li>Remercier les donateurs ou les bénévoles</li>\n</ul>\n<p>Élaborez une invite de rédaction qui comprend :</p>\n<ul>\n<li>La plateforme et le format (carrousel Instagram, publication LinkedIn, story Facebook, etc.)</li>\n<li>Votre public et ce qui le motive</li>\n<li>Le message clé et l'appel à l'action</li>\n<li>Le style de votre organisation sur les réseaux sociaux (professionnel, ludique, militant, etc.)</li>\n<li>Tout élément visuel nécessaire (données pour infographie, visuels de citation, descriptions de photos)</li>\n<li>Les contraintes (limites de caractères, stratégie de hashtags, exigences d'accessibilité)</li>\n</ul>\n<p>Partie 2 : Collaboration</p>\n<p>Partagez votre invite avec l'IA et examinez le contenu. Appliquez le Discernement :</p>\n<ul>\n<li>Vérifiez si le ton correspond à la manière dont votre organisation communique réellement.</li>\n<li>Vérifiez que les statistiques ou affirmations sont exactes et actuelles.</li>\n<li>Évaluez si le langage respecte la dignité des personnes que vous servez.</li>\n<li>Évaluez l'accessibilité des suggestions visuelles (texte alternatif, contraste des couleurs, si applicable).</li>\n<li>Réfléchissez à la question de savoir si ce contenu résonnera avec vos abonnés réels, ou s'il paraît générique.</li>\n</ul>\n<p>Partie 3 : Réflexion</p>\n<ul>\n<li>Votre invite a-t-elle capturé ce qui rend distinctive la voix de votre organisation sur les réseaux sociaux ?</li>\n<li>Quels éléments du brouillon conserveriez-vous, et lesquels réécririez-vous entièrement ?</li>\n<li>Si vous avez demandé un contenu visuel, racontait-il la bonne histoire pour votre public ?</li>\n</ul>\n<p><strong>Objectif de dépassement</strong> : demandez à l'IA de créer 3 variations pour différentes plateformes (Instagram, LinkedIn, Twitter/X) et évaluez avec quelle pertinence elle adapte le message central aux normes et au public de chaque plateforme.</p>\n<p>Réflexion sur la leçon<br />\n- En quoi le fait de télécharger des travaux antérieurs ou de fournir un contexte détaillé a-t-il changé la qualité des résultats de rédaction de l'IA ?<br />\n- Quelles stratégies utiliserez-vous pour préserver la voix authentique de votre organisation lorsque vous rédigez avec l'IA ?</p>\n<p>Prochaines étapes</p>\n<p>Dans la prochaine leçon, nous explorerons la confidentialité liée à l'IA, en cherchant à mieux comprendre ce qui advient des données que vous partagez avec l'IA.</p>\n<p>Retour d'expérience</p>\n<p>Au fil de votre apprentissage, nous aimerions savoir comment vous appliquez les concepts de ce cours à votre travail, ainsi que tout retour que vous souhaiteriez partager. Partagez votre retour d'expérience ici.</p>\n<p>Remerciements et licence</p>\n<p>Copyright 2025 Anthropic et Giving Tuesday. Basé sur le cadre de maîtrise de l'IA développé par le professeur Rick Dakan (Ringling College of Art and Design) et le professeur Joseph Feller (University College Cork). Publié sous licence CC BY-NC-SA 4.0.</p>\n<hr />", "id": "c5-3"}, {"level": 2, "title": "Comprendre la confidentialité et les données", "children": [], "html": "<p>Ce que vous allez apprendre</p>\n<p>Durée estimée : 30 minutes</p>\n<p>À la fin de cette leçon, vous serez capable de :</p>\n<ul>\n<li>Formuler des préoccupations relatives à la confidentialité et évaluer les outils d'IA en fonction de leurs politiques de traitement des données</li>\n<li>Mettre en pratique des stratégies d'hygiène des données pour traiter les informations sensibles en toute sécurité</li>\n</ul>\n<p>Comprendre la confidentialité et les données</p>\n<p>(10 minutes)</p>\n<p>Cette vidéo aborde l'une des préoccupations les plus courantes des professionnels du secteur associatif concernant l'IA : la confidentialité des données. Vous apprendrez ce qui se passe réellement avec les données que vous partagez avec les outils d'IA, comment évaluer les protections de confidentialité des différentes plateformes et formules, et comment préparer des données sensibles pour une utilisation sûre de l'IA.</p>\n<p>Points clés à retenir<br />\n- <strong>L'IA introduit de nouvelles considérations en matière de confidentialité — notamment autour de l'entraînement</strong> : certains usages de l'IA utilisent vos données en entrée pour entraîner de futurs modèles, ce qui signifie que des schémas présents dans vos données pourraient influencer de futurs résultats.<br />\n- <strong>Les différents outils ont des règles différentes</strong> : l'IA gratuite que vous utilisez pour trouver des idées de thèmes de campagne est différente d'un compte payant avec des politiques de conservation des données strictes. Choisissez votre outil en fonction de votre tâche — les outils offrant des protections plus solides sont plus sûrs pour partager des données sensibles.<br />\n- <strong>Une utilisation sûre de l'IA ne consiste pas à l'éviter, mais à l'utiliser de manière responsable</strong> : appliquez la Conscience du problème et la Conscience de la plateforme avant de démarrer un nouveau projet. Souvent, vous pouvez tirer pleinement parti de l'IA sans partager d'informations sensibles en décomposant une tâche en plusieurs parties.<br />\n- <strong>Vous pouvez souvent supprimer entièrement les informations identifiantes</strong> : pour une analyse de tendances, il est très probable que vous n'ayez pas besoin des noms, coordonnées ou autres informations personnelles identifiables (IPI). Partez de votre objectif réel et remontez pour déterminer quelles données sont véritablement nécessaires.<br />\n- <strong>Si quelque chose ne va pas, vous avez des options</strong> : supprimez la conversation, demandez la suppression des données via le processus de confidentialité de la plateforme, et suivez les protocoles de votre organisation.</p>\n<p>Une remarque sur les paramètres de confidentialité de Claude</p>\n<p>Concernant Claude spécifiquement, vous trouverez des informations détaillées sur la politique de traitement des données sur privacy.anthropic.com et trust.anthropic.com. Vous pouvez ajuster vos paramètres de confidentialité directement dans l'application Claude, y compris refuser que vos conversations soient utilisées pour l'entraînement. Les autres fournisseurs d'IA devraient proposer des ressources similaires — si ce n'est pas le cas, cela peut être un signal d'alerte.</p>\n<p>Exercice 1 : Évaluer la sensibilité des données</p>\n<p>Cet exercice vous aide à développer votre jugement quant aux données qui peuvent être partagées en toute sécurité avec des outils d'IA.</p>\n<p>Partie 1 : Examiner un échantillon de données</p>\n<p>Choisissez l'un des scénarios suivants qui est le plus pertinent pour votre travail :</p>\n<ul>\n<li>Un tableau de l'historique des dons contenant des noms, des montants et des coordonnées</li>\n<li>Des réponses à une enquête auprès des participants d'un programme contenant des données démographiques</li>\n<li>Un brouillon de rapport de subvention contenant des témoignages de bénéficiaires et des données de résultats</li>\n</ul>\n<p>Partie 2 : Annoter la sensibilité</p>\n<p>Pour le scénario choisi, identifiez :</p>\n<ul>\n<li>Quels champs ou sections contiennent des informations personnelles identifiables (IPI) ?</li>\n<li>Quelles informations sont essentielles à l'analyse que vous souhaitez réaliser ?</li>\n<li>Quelles informations pourraient être supprimées ou anonymisées sans perte de valeur analytique ?</li>\n<li>Si ces données étaient divulguées, quel serait le pire scénario ?</li>\n</ul>\n<p>Partie 3 : Planifier votre approche</p>\n<ul>\n<li>Que retireriez-vous ou modifieriez-vous avant de partager ces données avec l'IA ?</li>\n<li>Quel outil/niveau de formule est approprié pour ce niveau de sensibilité ?</li>\n<li>Après avoir reçu l'analyse de l'IA, quelles étapes de vérification entreprendriez-vous ?</li>\n</ul>\n<p>Exercice 2 : Pratiquer l'hygiène des données</p>\n<p>Cet exercice vous offre une pratique concrète pour préparer des données sensibles à une utilisation sûre avec l'IA.</p>\n<p>Partie 1 : Choisir votre fichier</p>\n<p>Choisissez un fichier réel de votre travail contenant des informations sensibles (ou créez un échantillon réaliste). Cela peut être :</p>\n<ul>\n<li>Un rapport de projet contenant des détails sur des clients</li>\n<li>Un brouillon de communication à un donateur mentionnant des montants de don précis</li>\n<li>Un compte-rendu de réunion mentionnant des noms de membres du personnel ou de bénévoles</li>\n</ul>\n<p>Partie 2 : Nettoyer le fichier</p>\n<p>Parcourez le fichier et :</p>\n<ul>\n<li>Remplacez les noms par des identifiants génériques (tels que « Personne A », « Donateur 1 », etc.).</li>\n<li>Supprimez ou généralisez les détails de localisation s'ils ne sont pas importants.</li>\n<li>Supprimez entièrement les coordonnées.</li>\n<li>Réfléchissez à la question de savoir si les montants précis doivent être exacts, ou pourraient être exprimés sous forme de fourchettes.</li>\n</ul>\n<p>Partie 3 : Tester avec l'IA</p>\n<p>Partagez votre fichier nettoyé avec l'IA et posez une question pertinente pour votre travail. Réfléchissez :</p>\n<ul>\n<li>La suppression des informations identifiantes a-t-elle limité la capacité de l'IA à vous aider ?</li>\n<li>Quel contexte supplémentaire avez-vous dû fournir pour compenser ?</li>\n<li>Êtes-vous à l'aise avec le niveau d'information que vous avez partagé ?</li>\n</ul>\n<p>Réflexion sur la leçon<br />\n- Comment la confidentialité liée à l'IA se compare-t-elle à la façon dont vous pensez déjà à d'autres outils logiciels (e-mail, stockage cloud, CRM) ?<br />\n- Sur la base de cette leçon, quel est un changement que vous apporterez à votre approche du partage de données avec l'IA ?</p>\n<p>Prochaines étapes</p>\n<p>Dans la prochaine leçon, nous mettrons ces pratiques de confidentialité en application en explorant l'analyse de données avec l'IA — en apprenant à découvrir des tendances, générer des enseignements et renforcer vos programmes tout en protégeant les informations sensibles.</p>\n<p>Retour d'expérience</p>\n<p>Au fil de votre apprentissage, nous aimerions savoir comment vous appliquez les concepts de ce cours à votre travail, ainsi que tout retour que vous souhaiteriez partager. Partagez votre retour d'expérience ici.</p>\n<p>Remerciements et licence</p>\n<p>Copyright 2025 Anthropic et Giving Tuesday. Basé sur le cadre de maîtrise de l'IA développé par le professeur Rick Dakan (Ringling College of Art and Design) et le professeur Joseph Feller (University College Cork). Publié sous licence CC BY-NC-SA 4.0.</p>\n<hr />", "id": "c5-4"}, {"level": 2, "title": "Analyse de données avec l'IA", "children": [], "html": "<p>Ce que vous allez apprendre</p>\n<p>Durée estimée : 50 minutes</p>\n<p>À la fin de cette leçon, vous serez capable de :</p>\n<ul>\n<li>Utiliser la boucle Délégation-Diligence pour vérifier de manière systématique la capacité de l'IA à analyser votre travail spécifique.</li>\n<li>Appliquer la Description et le Discernement pour identifier des tendances dans les données tout en reconnaissant les limites de l'IA.</li>\n<li>Renforcer votre confiance dans l'analyse assistée par l'IA en la testant sur des données que vous comprenez déjà.</li>\n</ul>\n<p>Analyse de données avec l'IA</p>\n<p>(7 minutes)</p>\n<p>Cette vidéo aborde une question clé que se posent les professionnels du secteur associatif lorsqu'ils utilisent l'IA pour l'analyse de données : comment savoir si je peux faire confiance aux résultats ? Vous suivrez Rio, directeur de programme à Valley Veterans Services, qui utilise la boucle Délégation-Diligence pour exploiter systématiquement des données passées — dont il connaît déjà les réponses — afin de vérifier les capacités analytiques de l'IA. La vidéo montre comment renforcer la confiance par des tests, identifier les lacunes de capacité, et développer une approche que vous pouvez appliquer avec confiance à de nouvelles données.</p>\n<p>Points clés à retenir<br />\n- <strong>Testez l'IA avec des données que vous comprenez déjà</strong> : avant de faire confiance à l'IA pour une nouvelle analyse, vérifiez-la avec des données passées dont vous connaissez déjà les résultats corrects. Si l'IA peut retrouver vos résultats connus avec des consignes adaptées, vous pouvez l'utiliser en toute confiance pour des tâches similaires à l'avenir.<br />\n- <strong>Utilisez le Discernement pour identifier les lacunes dans le raisonnement de l'IA</strong> : au fil de vos tests, notez quel contexte important l'IA a manqué, et quelle Description supplémentaire vous devez fournir.<br />\n- <strong>Construisez une approche vérifiée, pas une confiance aveugle</strong> : chaque cycle de test vous indique ce que l'IA maîtrise bien et où elle a besoin de conseils. Documentez ce qui fonctionne afin de pouvoir le reproduire.<br />\n- <strong>L'IA peut aider même si vous n'êtes pas à l'aise avec l'analyse de données</strong> : si l'analyse de données ne vous est pas familière, l'IA peut vous aider à trouver des idées de solutions, à écrire des formules Excel et à reformater des données désordonnées — continuez simplement à demander des clarifications pour comprendre l'ensemble du processus.<br />\n- <strong>La vérification renforce la confiance mais ne supprime pas la responsabilité</strong> : vous restez responsable de vérifier que les résultats sont raisonnables et de faire preuve de transparence sur le rôle de l'IA.</p>\n<p>Exercice 1 : Analyse des messages</p>\n<p>Cet exercice utilise des données à moindre risque (vos propres communications publiques) pour pratiquer la boucle Description-Discernement en matière d'analyse de données.</p>\n<p>Partie 1 : Rassembler vos données</p>\n<p>Collectez 10 à 20 exemples des communications de votre organisation — publications sur les réseaux sociaux, objets d'e-mail, titres de newsletter ou annonces d'événements. Incluez certains que vous considérez comme performants et d'autres moins performants.</p>\n<p>Partie 2 : Analyser avec l'IA</p>\n<p>Partagez votre jeu de données avec l'IA et demandez-lui d'identifier des tendances :</p>\n<ul>\n<li>Quels thèmes ou sujets apparaissent dans votre contenu le plus performant ?</li>\n<li>Quels schémas de langage, de ton ou de mise en forme émergent ?</li>\n<li>Existe-t-il un écart entre ce que vous communiquez et ce qui trouve un écho ?</li>\n</ul>\n<p>Partie 3 : Appliquer le Discernement</p>\n<p>Évaluez l'analyse de l'IA :</p>\n<ul>\n<li>Les tendances identifiées correspondent-elles à votre perception de ce qui fonctionne ?</li>\n<li>Quel contexte sur votre public ou vos objectifs l'IA a-t-elle manqué ?</li>\n<li>Certaines des tendances identifiées par l'IA vous surprennent-elles ?</li>\n</ul>\n<p>Réfléchissez :</p>\n<ul>\n<li>Qu'espériez-vous apprendre de votre jeu de données ?</li>\n<li>En quoi le contenu le plus performant correspond-il à votre style authentique et aux valeurs de votre organisation ?</li>\n<li>Atteignez-vous le bon public ?</li>\n</ul>\n<p><strong>Objectif de dépassement</strong> : utilisez l'IA pour examiner comment vos messages se comparent à la mission et aux valeurs affichées de votre organisation, identifier les écarts, et créer un guide de communication basé sur cette analyse.</p>\n<p>Exercice 2 : Analyser les schémas de dons des donateurs</p>\n<p>Cet exercice applique les compétences d'analyse de données à des données de collecte de fonds à forts enjeux et s'appuie sur les pratiques d'hygiène des données de la leçon 5.</p>\n<p>Partie 1 : Préparer vos données</p>\n<p>Utilisez le jeu de données de donateurs que vous avez nettoyé dans la leçon 5, ou préparez-en un nouveau en supprimant les informations personnelles identifiables. Assurez-vous de disposer de données de dons historiques couvrant plusieurs périodes.</p>\n<p>Partie 2 : Analyser avec l'IA</p>\n<p>Demandez à l'IA d'identifier les tendances suivantes :</p>\n<ul>\n<li>Les taux de rétention des donateurs au fil du temps</li>\n<li>Les schémas de dons récurrents par rapport aux dons ponctuels</li>\n<li>Les comparaisons d'efficacité entre campagnes</li>\n<li>Les tendances de dons par tranche de montant</li>\n</ul>\n<p>Partie 3 : Appliquer le Discernement</p>\n<p>Évaluez de manière critique les conclusions de l'IA :</p>\n<ul>\n<li>Ces tendances correspondent-elles à ce que vous savez de votre communauté de donateurs ?</li>\n<li>L'IA se concentre-t-elle uniquement sur la valeur monétaire en ignorant les facteurs relationnels ?</li>\n<li>Quels schémas contribuent à renforcer les relations avec les donateurs, et pas seulement à maximiser les revenus ?</li>\n</ul>\n<p>Réfléchissez :</p>\n<ul>\n<li>Quel pourrait être le coût de la mise en œuvre d'une recommandation d'efficacité ? (Par exemple, si les conclusions suggèrent de privilégier les grands donateurs au détriment des petits donateurs, quel est l'impact sur la perception de la communauté ou la pérennité à long terme ?)</li>\n<li>Au-delà des montants de dons, quels schémas contribuent à renforcer les relations avec les donateurs ?</li>\n</ul>\n<p>Exercice 3 : Analyse de tendances pour anticiper les besoins de la communauté (objectif de dépassement)</p>\n<p>Cet exercice avancé combine plusieurs sources de données pour pratiquer l'analyse prédictive — une capacité très recherchée.</p>\n<p>Partie 1 : Rassembler des sources diversifiées</p>\n<p>Collectez les informations que vous utilisez déjà pour comprendre les besoins de la communauté :</p>\n<ul>\n<li>Vos propres données de programme et demandes de service</li>\n<li>Des rapports ou jeux de données externes sur votre communauté</li>\n<li>Des évolutions de l'actualité ou des politiques publiques affectant les personnes que vous servez</li>\n</ul>\n<p>Partie 2 : Analyser les tendances émergentes</p>\n<p>Demandez à l'IA de vous aider à identifier :</p>\n<ul>\n<li>Les tendances dans les types de soutien que les personnes demandent</li>\n<li>Les facteurs externes susceptibles d'augmenter ou de modifier la demande</li>\n<li>Les écarts entre les services actuels et les besoins émergents</li>\n</ul>\n<p>Partie 3 : Appliquer un Discernement rigoureux</p>\n<p>Cette analyse exige le niveau d'évaluation critique le plus élevé :</p>\n<ul>\n<li>Comment les prédictions de l'IA se comparent-elles à votre expérience directe de la communauté ?</li>\n<li>Quels facteurs systémiques ou contextuels locaux l'IA pourrait-elle négliger ?</li>\n<li>Quelles valeurs devez-vous garder à l'esprit pour anticiper les besoins de la communauté avec dignité et respect ?</li>\n</ul>\n<p>Réfléchissez :</p>\n<ul>\n<li>Comment gérerez-vous ce processus de manière responsable ?</li>\n<li>Quels facteurs et enjeux systémiques peuvent expliquer ou contextualiser ce que l'IA ne peut pas ?</li>\n</ul>\n<p>Réflexion sur la leçon<br />\n- En quoi le fait de tester l'IA sur des données que vous comprenez déjà a-t-il modifié votre confiance dans son utilisation pour de nouvelles analyses ?<br />\n- Quelles lacunes ou limites avez-vous identifiées qui influenceront la manière dont vous déléguerez des tâches d'analyse de données à l'avenir ?</p>\n<p>Prochaines étapes</p>\n<p>Dans la prochaine leçon, nous explorerons l'augmentation des flux de travail — comment appliquer ces mêmes principes lorsque l'IA prend en charge des tâches routinières pour votre compte, libérant ainsi votre temps pour un travail à plus fort impact.</p>\n<p>Retour d'expérience</p>\n<p>Au fil de votre apprentissage, nous aimerions savoir comment vous appliquez les concepts de ce cours à votre travail, ainsi que tout retour que vous souhaiteriez partager. Partagez votre retour d'expérience ici.</p>\n<p>Remerciements et licence</p>\n<p>Copyright 2025 Anthropic et Giving Tuesday. Basé sur le cadre de maîtrise de l'IA développé par le professeur Rick Dakan (Ringling College of Art and Design) et le professeur Joseph Feller (University College Cork). Publié sous licence CC BY-NC-SA 4.0.</p>\n<hr />", "id": "c5-5"}, {"level": 2, "title": "Augmentation des flux de travail", "children": [], "html": "<p>Ce que vous allez apprendre</p>\n<p>Durée estimée : 40 minutes</p>\n<p>À la fin de cette leçon, vous serez capable de :</p>\n<ul>\n<li>Combiner les quatre dimensions du cadre des 4D pour construire un processus reproductible avec l'IA.</li>\n</ul>\n<p>Automatisation des flux de travail</p>\n<p>(6 minutes)</p>\n<p>Cette vidéo réunit les quatre dimensions du cadre des 4D pour construire une automatisation de flux de travail concrète. Vous suivrez Emily, coordinatrice du développement, alors qu'elle se prépare pour le gala annuel de son organisation et construit un système de réponse aux e-mails assisté par l'IA. La vidéo montre comment catégoriser les tâches selon ce que l'IA devrait prendre en charge et ce qui nécessite une attention humaine, comment décrire précisément le comportement du système, et comment maintenir la Diligence par des tests et de la transparence.</p>\n<p>Points clés à retenir<br />\n- <strong>Commencez par la Conscience du problème</strong> : avant de toucher à un outil d'IA, analysez votre charge de travail réelle. Que demandent les gens ? Quels schémas émergent ? Établissez une liste concrète avant de décider quoi automatiser.<br />\n- <strong>La Délégation des tâches consiste à se demander « l'IA devrait-elle faire cela ? » et non simplement « l'IA peut-elle faire cela ? »</strong> : certaines tâches (comme répondre à des questions documentées) sont de bonnes candidates à l'automatisation. D'autres (comme le traitement de réclamations ou de demandes à forts enjeux) devraient être gérées par des humains.<br />\n- <strong>Testez de manière itérative avec des exemples réels</strong> : utilisez les e-mails que vous recevez réellement pour tester le système. Vous trouverez des lacunes dans votre description qui nécessitent des ajustements — c'est normal et nécessaire.<br />\n- <strong>Pratiquez les trois types de Diligence</strong> : la <strong>Diligence de création</strong> signifie décider consciemment quoi automatiser. La <strong>Diligence de déploiement</strong> signifie examiner le résultat avant sa publication (en particulier au début). La <strong>Diligence de transparence</strong> signifie être honnête sur le rôle de l'IA, en particulier lorsque quelque chose ne va pas.</p>\n<p>Exercice 1 : Planifier vos opportunités d'automatisation</p>\n<p>Cet exercice vous aide à identifier les tâches répétitives de votre travail qui sont de bonnes candidates à l'automatisation par l'IA.</p>\n<p>Partie 1 : Auditer vos tâches répétitives</p>\n<p>Passez en revue votre travail de la semaine écoulée. Listez 5 à 10 tâches qui vous paraissent répétitives ou chronophages. Pour chaque tâche, notez :</p>\n<ul>\n<li>À quelle fréquence cela se produit-il ? (Quotidienne, hebdomadaire, mensuelle)</li>\n<li>Combien de temps chacune prend-elle ?</li>\n<li>La réponse/le processus est-il globalement standardisé, ou varie-t-il beaucoup ?</li>\n</ul>\n<p>Partie 2 : Catégoriser selon l'adéquation avec l'IA</p>\n<p>Classez vos tâches en trois catégories :</p>\n<ul>\n<li><strong>L'IA peut le prendre en charge</strong> : réponses standardisées, informations documentées, processus clairs</li>\n<li><strong>L'IA peut assister, l'humain décide</strong> : tâches où l'IA peut rédiger ou préparer, mais que vous validez avant d'agir</li>\n<li><strong>Les humains devraient s'en charger</strong> : décisions à forts enjeux, situations émotionnelles, jugement complexe</li>\n</ul>\n<p>Partie 3 : Prioriser</p>\n<p>Parmi vos catégories « l'IA peut le prendre en charge » ou « l'IA peut assister », choisissez une tâche qui vous ferait gagner le plus de temps. Ce sera votre candidat à l'automatisation.</p>\n<p>Réfléchissez :</p>\n<ul>\n<li>Quels critères vous ont aidé à décider de la catégorie de chaque tâche ?</li>\n<li>Avez-vous été surpris par le nombre (élevé ou faible) de tâches adaptées à l'automatisation ?</li>\n</ul>\n<p>Exercice 2 : Construire la description de votre automatisation</p>\n<p>Cet exercice vous guide pour décrire un système d'automatisation en utilisant les trois types de Description.</p>\n<p>Partie 1 : Définir votre produit</p>\n<p>Pour la tâche identifiée dans l'exercice 1, rédigez une Description du produit claire :</p>\n<ul>\n<li>Quel est le résultat final que vous souhaitez ?</li>\n<li>Quelle entrée le système recevra-t-il ?</li>\n<li>Quel résultat devrait-il produire ?</li>\n</ul>\n<p>Partie 2 : Définir votre processus</p>\n<p>Rédigez une Description du processus décrivant les étapes :</p>\n<ul>\n<li>Que devrait faire le système en premier ?</li>\n<li>Quels points de décision existent ?</li>\n<li>Quand devrait-il escalader vers un humain ?</li>\n<li>À quelles informations doit-il avoir accès ?</li>\n</ul>\n<p>Partie 3 : Définir la performance</p>\n<p>Rédigez une Description de la performance définissant le comportement :</p>\n<ul>\n<li>Quel ton devrait-il utiliser ?</li>\n<li>Comment devrait-il gérer l'incertitude ?</li>\n<li>Que ne devrait-il absolument jamais faire ?</li>\n<li>Comment devrait-il répondre à la demande du demandeur ?</li>\n</ul>\n<p>Partie 4 : Tester avec des exemples réels</p>\n<p>Partagez votre description avec l'IA ainsi que 3 à 5 exemples réels de votre travail. Évaluez le résultat :</p>\n<ul>\n<li>A-t-il correctement classé les cas ?</li>\n<li>Les réponses sont-elles exactes et appropriées ?</li>\n<li>Quels ajustements votre description nécessite-t-elle ?</li>\n</ul>\n<p>Exercice 3 : Planifier la Diligence (objectif de dépassement)</p>\n<p>Cet exercice vous aide à réfléchir aux aspects de responsabilité de l'automatisation.</p>\n<p>Partie 1 : Diligence de création</p>\n<p>Répondez à ces questions concernant votre automatisation prévue :</p>\n<ul>\n<li>Pourquoi cette tâche est-elle adaptée à une prise en charge par l'IA ?</li>\n<li>Qu'est-ce qui pourrait mal se passer, et comment le détecterez-vous ?</li>\n<li>Si l'IA fait une erreur, quel est l'impact ?</li>\n</ul>\n<p>Partie 2 : Diligence de déploiement</p>\n<p>Planifiez votre processus de contrôle :</p>\n<ul>\n<li>Examinerez-vous chaque résultat, ou effectuerez-vous un échantillonnage périodique ?</li>\n<li>Comment surveillerez-vous les problèmes dans le temps ?</li>\n<li>Quels seraient les déclencheurs qui vous amèneraient à mettre l'automatisation en pause ?</li>\n</ul>\n<p>Partie 3 : Diligence de transparence</p>\n<p>Décidez de votre approche en matière de transparence :</p>\n<ul>\n<li>Qui doit savoir que l'IA est impliquée ?</li>\n<li>Comment divulguerez-vous le rôle de l'IA ?</li>\n<li>Quelles options de suivi proposerez-vous si quelqu'un souhaite un service humain ?</li>\n</ul>\n<p>Réflexion sur la leçon<br />\n- En quoi l'utilisation conjointe des quatre dimensions du cadre des 4D a-t-elle changé votre approche de cette tâche d'automatisation ?<br />\n- Qu'est-ce qui vous a surpris dans le processus de description précise d'un système d'automatisation, suffisamment détaillée pour que l'IA puisse l'exécuter ?</p>\n<p>Prochaines étapes</p>\n<p>Dans la prochaine leçon, nous aborderons la manière d'intégrer l'IA de façon réfléchie et durable dans votre organisation — depuis la prise en compte des préoccupations liées à la dépendance à l'IA jusqu'à l'élaboration d'une politique d'IA qui reflète vos valeurs.</p>\n<p>Retour d'expérience</p>\n<p>Au fil de votre apprentissage, nous aimerions savoir comment vous appliquez les concepts de ce cours à votre travail, ainsi que tout retour que vous souhaiteriez partager. Partagez votre retour d'expérience ici.</p>\n<p>Remerciements et licence</p>\n<p>Copyright 2025 Anthropic et Giving Tuesday. Basé sur le cadre de maîtrise de l'IA développé par le professeur Rick Dakan (Ringling College of Art and Design) et le professeur Joseph Feller (University College Cork). Publié sous licence CC BY-NC-SA 4.0.</p>\n<hr />", "id": "c5-6"}, {"level": 2, "title": "Intégration", "children": [], "html": "<p>Ce que vous allez apprendre</p>\n<p>Durée estimée : 45 minutes</p>\n<p>À la fin de cette leçon, vous serez capable de :</p>\n<ul>\n<li>Intégrer l'IA dans votre organisation de manière à renforcer les capacités humaines et à faire progresser votre mission</li>\n<li>Répondre aux préoccupations concernant la dépendance à l'IA et le maintien du lien humain</li>\n<li>Créer une politique organisationnelle d'IA qui reflète vos valeurs et garantit une utilisation durable de l'IA</li>\n</ul>\n<p>Intégration</p>\n<p>(5 minutes)</p>\n<p>Cette vidéo aborde les deux préoccupations les plus courantes des professionnels du secteur associatif concernant l'adoption organisationnelle de l'IA : comment éviter de devenir trop dépendant de l'IA ? Et comment équilibrer l'efficacité avec la dimension humaine ? La vidéo introduit le concept d'être un « humain dans la boucle » et ce que cela signifie concrètement pour les organisations guidées par une mission. Elle détaille ensuite les éléments clés d'une politique organisationnelle d'IA qui peut vous aider à promouvoir la maîtrise de l'IA au sein de votre équipe.</p>\n<p>Points clés à retenir<br />\n- <strong>Être un « humain dans la boucle » va au-delà d'une simple supervision</strong> : dans un contexte associatif, cela signifie s'assurer que l'IA sert votre mission — vous décidez quels problèmes l'IA doit aider à résoudre, vous évaluez si les solutions s'alignent avec vos valeurs, et vous préservez les relations et l'impact concret sur le terrain qui définissent le travail associatif.<br />\n- <strong>Évitez la dépendance par la compréhension, pas par l'évitement</strong> : réfléchissez régulièrement à vos processus et demandez-vous « pouvons-nous expliquer ce que fait l'IA ? ». Si oui, c'est une augmentation saine. Si non, redéfinissez votre processus jusqu'à pouvoir le faire.<br />\n- <strong>L'IA devrait vous donner plus de temps pour le travail humain, pas moins</strong> : au mieux, l'IA réduit le bruit afin que vous puissiez vous concentrer sur les cartes manuscrites, la sensibilisation personnalisée et le temps passé avec les individus de votre communauté. Au pire, elle automatise cette dimension humaine.<br />\n- <strong>Établissez tôt des normes culturelles autour de la productivité</strong> : lorsque vous introduisez l'IA dans votre organisation, discutez des attentes concernant l'usage du temps gagné, afin que tout le monde soit à l'aise avec un travail soutenu par l'IA.<br />\n- <strong>Une politique d'IA aide à diffuser votre compréhension</strong> : une politique documente vos décisions concernant les plateformes, la délégation des tâches, le contrôle de la qualité, la transparence et l'alignement des valeurs, afin que l'ensemble de l'organisation puisse travailler de manière cohérente.</p>\n<p>Exercice : Rédiger votre politique organisationnelle d'IA</p>\n<p>Cet exercice réunit tout ce que vous avez appris dans ce cours pour créer un document pratique pouvant guider l'utilisation de l'IA dans l'ensemble de votre organisation.</p>\n<p>Partie 1 : Conscience de la plateforme</p>\n<p>Répondez à ces questions pour élaborer vos lignes directrices technologiques :</p>\n<ul>\n<li>Quels outils d'IA votre organisation utilisera-t-elle ? Lesquels sont interdits ?</li>\n<li>Pour différents types de travail, quelles politiques de conservation des données et d'entraînement sont acceptables ?</li>\n<li>Quels outils ou garde-fous différents les différents niveaux de sensibilité requièrent-ils ?</li>\n<li>Comment vous tiendrez-vous informé à mesure que les outils et les politiques évoluent ?</li>\n</ul>\n<p>Partie 2 : Délégation des tâches</p>\n<p>Définissez les limites de l'utilisation de l'IA :</p>\n<ul>\n<li>Quels types de travail se prêtent à une assistance par l'IA ?</li>\n<li>Quel travail devrait être réalisé entièrement par des humains ? Pourquoi ?</li>\n<li>Qui décide si un nouveau cas d'usage est approprié ?</li>\n<li>Comment gérez-vous les zones grises ?</li>\n</ul>\n<p>Partie 3 : Attentes et capacités</p>\n<p>Abordez le volet humain de l'intégration de l'IA :</p>\n<ul>\n<li>Comment le temps gagné grâce à l'efficacité de l'IA sera-t-il réaffecté ?</li>\n<li>Quelles sont les attentes réalistes pour les différents rôles ?</li>\n<li>Comment développerez-vous la capacité en IA au sein de toute votre équipe (et non d'un seul « expert IA ») ?</li>\n<li>Que se passe-t-il lorsqu'un flux de travail basé sur l'IA échoue ?</li>\n</ul>\n<p>Partie 4 : Qualité et supervision</p>\n<p>Établissez la responsabilité :</p>\n<ul>\n<li>Qui examine les résultats de l'IA avant leur utilisation ou leur diffusion ?</li>\n<li>Quelles étapes de vérification sont nécessaires pour les différents types de contenu ?</li>\n<li>Que se passe-t-il lorsque l'IA fait une erreur ?</li>\n<li>Comment surveillerez-vous les problèmes dans le temps ?</li>\n</ul>\n<p>Partie 5 : Transparence</p>\n<p>Décidez comment vous communiquerez sur l'utilisation de l'IA :</p>\n<ul>\n<li>Que doivent savoir les parties prenantes, les financeurs et les personnes que vous servez concernant votre utilisation de l'IA ?</li>\n<li>Comment divulguerez-vous l'implication de l'IA dans des résultats spécifiques ?</li>\n<li>Quelle est votre position sur l'attribution de l'IA dans les demandes de subvention, les rapports et les communications ?</li>\n</ul>\n<p>Partie 6 : Alignement des valeurs</p>\n<p>Reliez l'utilisation de l'IA à votre mission :</p>\n<ul>\n<li>Comment vous assurez-vous que l'IA sert votre mission, et non l'inverse ?</li>\n<li>Quelles valeurs et principes éthiques guident vos décisions en matière d'IA ?</li>\n<li>Comment maintiendre
