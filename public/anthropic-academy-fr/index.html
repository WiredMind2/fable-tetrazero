<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow" />
<title>Anthropic Academy — Fondations &amp; AI Fluency (Édition française)</title>
<style>
  :root{
    --bg:#0f1115;
    --panel:#171a21;
    --panel-2:#1d212b;
    --border:#2a2f3a;
    --text:#e8eaed;
    --text-dim:#9aa3b2;
    --accent:#d97757;
    --accent-soft:rgba(217,119,87,0.15);
    --accent-2:#7ea6c9;
    --radius:10px;
    --mono:"SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;background:var(--bg);color:var(--text);font-family:var(--sans);}
  body{display:flex;height:100vh;overflow:hidden;font-size:15px;line-height:1.55;}

  /* ---------- Sidebar ---------- */
  #sidebar{
    width:340px;
    min-width:340px;
    background:var(--panel);
    border-right:1px solid var(--border);
    display:flex;
    flex-direction:column;
    height:100%;
  }
  #sidebar-header{
    padding:18px 16px 12px;
    border-bottom:1px solid var(--border);
  }
  #sidebar-header h1{
    font-size:15px;
    margin:0 0 2px;
    font-weight:700;
    letter-spacing:.2px;
  }
  #sidebar-header .subtitle{
    font-size:12px;
    color:var(--text-dim);
  }
  #search-wrap{
    padding:10px 14px;
    border-bottom:1px solid var(--border);
  }
  #search{
    width:100%;
    padding:8px 10px;
    border-radius:8px;
    border:1px solid var(--border);
    background:var(--panel-2);
    color:var(--text);
    font-size:13px;
    outline:none;
  }
  #search:focus{border-color:var(--accent);}
  #tree{
    flex:1;
    overflow-y:auto;
    padding:8px 6px 24px;
  }
  #tree::-webkit-scrollbar, #content::-webkit-scrollbar{width:9px;}
  #tree::-webkit-scrollbar-thumb, #content::-webkit-scrollbar-thumb{background:#333844;border-radius:6px;}

  .course-block{margin-bottom:4px;}
  .course-toggle{
    display:flex;
    align-items:center;
    gap:8px;
    width:100%;
    text-align:left;
    background:none;
    border:none;
    color:var(--text);
    font-family:inherit;
    font-size:13.5px;
    font-weight:600;
    padding:9px 10px;
    border-radius:8px;
    cursor:pointer;
  }
  .course-toggle:hover{background:var(--panel-2);}
  .course-toggle .num{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    width:20px;height:20px;
    font-size:11px;
    border-radius:50%;
    background:var(--accent-soft);
    color:var(--accent);
    flex:none;
    font-weight:700;
  }
  .course-toggle .chev{
    margin-left:auto;
    font-size:10px;
    color:var(--text-dim);
    transition:transform .15s;
    flex:none;
  }
  .course-block.open .course-toggle .chev{transform:rotate(90deg);}
  .course-children{
    display:none;
    padding-left:14px;
    border-left:1px solid var(--border);
    margin-left:19px;
  }
  .course-block.open .course-children{display:block;}

  .node{margin:1px 0;}
  .node-row{
    display:flex;
    align-items:flex-start;
    gap:6px;
    width:100%;
    text-align:left;
    background:none;
    border:none;
    color:var(--text-dim);
    font-family:inherit;
    font-size:13px;
    padding:6px 8px;
    border-radius:7px;
    cursor:pointer;
    line-height:1.35;
  }
  .node-row:hover{background:var(--panel-2);color:var(--text);}
  .node-row.active{background:var(--accent-soft);color:var(--accent);font-weight:600;}
  .node-row .twist{
    flex:none;width:14px;font-size:10px;color:var(--text-dim);
    transform:rotate(0deg);transition:transform .15s;margin-top:2px;
  }
  .node.open > .node-row .twist{transform:rotate(90deg);}
  .node-row .twist.empty{visibility:hidden;}
  .node-children{display:none;padding-left:10px;border-left:1px solid var(--border);margin-left:6px;}
  .node.open > .node-children{display:block;}
  .node-row.hidden-by-search, .course-block.hidden-by-search{display:none !important;}

  /* ---------- Main content ---------- */
  #main{flex:1;display:flex;flex-direction:column;height:100%;min-width:0;}
  #topbar{
    display:flex;
    align-items:center;
    gap:10px;
    padding:12px 28px;
    border-bottom:1px solid var(--border);
    background:var(--panel);
    flex:none;
  }
  #hamburger{
    display:none;
    background:none;border:none;color:var(--text);font-size:20px;cursor:pointer;
    padding:4px 8px;border-radius:6px;
  }
  #breadcrumb{
    font-size:12.5px;
    color:var(--text-dim);
    white-space:nowrap;
    overflow-x:auto;
    scrollbar-width:none;
  }
  #breadcrumb b{color:var(--text);font-weight:600;}
  #breadcrumb span.sep{margin:0 6px;color:#4b5160;}

  #content{
    flex:1;
    overflow-y:auto;
    padding:40px 56px 100px;
  }
  #content-inner{max-width:760px;margin:0 auto;}
  #content h1.page-title{
    font-size:26px;
    margin:0 0 6px;
    color:#fff;
    font-weight:700;
  }
  #content .page-kicker{
    font-size:12.5px;
    text-transform:uppercase;
    letter-spacing:.06em;
    color:var(--accent);
    font-weight:700;
    margin-bottom:10px;
  }
  #course-intro{
    font-size:14px;
    color:var(--text-dim);
    border-left:3px solid var(--accent);
    padding:2px 16px;
    margin:14px 0 26px;
  }
  #course-intro p{margin:6px 0;}
  #course-intro a{color:var(--accent-2);}

  .node-html{font-size:15.5px;}
  .node-html p{margin:0 0 14px;color:#dadde3;}
  .node-html strong{color:#fff;}
  .node-html ul, .node-html ol{margin:0 0 14px;padding-left:22px;color:#dadde3;}
  .node-html li{margin-bottom:6px;}
  .node-html a{color:var(--accent-2);text-decoration:none;border-bottom:1px solid rgba(126,166,201,.35);}
  .node-html a:hover{border-bottom-color:var(--accent-2);}
  .node-html hr{border:none;border-top:1px solid var(--border);margin:26px 0;}
  .node-html code{
    background:#252a35;color:#f0c987;padding:2px 6px;border-radius:5px;font-family:var(--mono);font-size:.88em;
  }
  .node-html pre{
    background:#12141a;border:1px solid var(--border);border-radius:8px;
    padding:14px 16px;overflow-x:auto;margin:0 0 16px;
  }
  .node-html pre code{background:none;padding:0;color:#c9d1d9;font-size:13px;line-height:1.5;}
  .node-html blockquote{
    margin:0 0 16px;padding:2px 16px;border-left:3px solid var(--border);color:var(--text-dim);
  }
  .node-html table{border-collapse:collapse;width:100%;margin:0 0 18px;font-size:13.5px;}
  .node-html th,.node-html td{border:1px solid var(--border);padding:7px 10px;text-align:left;}
  .node-html th{background:var(--panel-2);color:#fff;}

  .children-nav{
    margin-top:30px;
    padding-top:22px;
    border-top:1px solid var(--border);
  }
  .children-nav .label{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--text-dim);margin-bottom:10px;font-weight:700;}
  .children-nav a{
    display:block;
    padding:11px 14px;
    margin-bottom:6px;
    border:1px solid var(--border);
    border-radius:8px;
    color:var(--text);
    text-decoration:none;
    font-size:13.5px;
    background:var(--panel-2);
  }
  .children-nav a:hover{border-color:var(--accent);color:var(--accent);}

  #pager{
    display:flex;
    justify-content:space-between;
    gap:12px;
    margin-top:36px;
    padding-top:20px;
    border-top:1px solid var(--border);
  }
  .pager-btn{
    flex:1;
    max-width:46%;
    border:1px solid var(--border);
    background:var(--panel-2);
    color:var(--text);
    border-radius:9px;
    padding:12px 14px;
    cursor:pointer;
    font-family:inherit;
    text-align:left;
  }
  .pager-btn:hover{border-color:var(--accent);}
  .pager-btn.next{text-align:right;}
  .pager-btn .pager-label{display:block;font-size:11px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.05em;margin-bottom:3px;}
  .pager-btn .pager-title{font-size:13.5px;font-weight:600;}
  .pager-btn:disabled{opacity:.35;cursor:default;}
  .pager-spacer{flex:1;max-width:46%;}

  #empty-state{
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    height:100%;color:var(--text-dim);text-align:center;padding:40px;
  }
  #empty-state .big{font-size:40px;margin-bottom:14px;}

  @media (max-width: 860px){
    #sidebar{
      position:fixed;left:0;top:0;bottom:0;z-index:20;
      transform:translateX(-100%);
      transition:transform .2s ease;
      box-shadow:2px 0 20px rgba(0,0,0,.4);
    }
    #sidebar.mobile-open{transform:translateX(0);}
    #hamburger{display:inline-block;}
    #content{padding:28px 20px 80px;}
    #topbar{padding:10px 14px;}
  }
  #overlay{
    display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:15;
  }
  #overlay.show{display:block;}
</style>
</head>
<body>

<div id="overlay"></div>

<aside id="sidebar">
  <div id="sidebar-header">
    <h1>Anthropic Academy 🇫🇷</h1>
    <div class="subtitle">Fondations &amp; AI Fluency — édition française</div>
  </div>
  <div id="search-wrap">
    <input id="search" type="text" placeholder="Rechercher une leçon…">
  </div>
  <nav id="tree"></nav>
</aside>

<main id="main">
  <div id="topbar">
    <button id="hamburger" aria-label="Menu">☰</button>
    <div id="breadcrumb"></div>
  </div>
  <div id="content">
    <div id="content-inner"></div>
  </div>
</main>

<script id="data" type="application/json">[{"num": 1, "title": "Leçon 1 : Guide de démarrage Claude 101", "introHtml": "<blockquote>\n<p>Apprenez à utiliser Claude à partir de zéro<br />\nLien du cours : <a href=\"https://anthropic.skilljar.com/claude-101\">Claude 101 Getting Started Guide</a> | 13 leçons au total</p>\n</blockquote>\n<hr />", "tree": [{"level": 3, "title": "Aperçu des modèles Claude", "children": [], "html": "<p>Claude propose trois familles de modèles, chacune optimisée pour des priorités différentes :</p>\n<p>Opus = le modèle le plus intelligent, adapté aux tâches complexes et multi-étapes qui nécessitent un raisonnement et une planification approfondis. La contrepartie est un coût et une latence plus élevés.</p>\n<p>Sonnet = un modèle équilibré qui offre de bonnes performances en intelligence, rapidité et rapport coût-efficacité. Il dispose de solides capacités de codage et de fonctions d'édition de code précises. C'est le meilleur choix pour la plupart des cas d'usage réels.</p>\n<p>Haiku = le modèle le plus rapide, optimisé pour la rapidité et le rapport coût-efficacité. Il n'a pas la capacité de raisonnement d'Opus/Sonnet. Il est le plus adapté aux interactions utilisateur en temps réel et au traitement à haut débit.</p>\n<p>Cadre de sélection : si l'intelligence est la priorité → Opus. Si la rapidité est la priorité → Haiku. Si vous avez besoin d'équilibre → Sonnet.</p>\n<p>Approche générale = utiliser plusieurs modèles au sein d'une même application en fonction des besoins spécifiques de chaque tâche, plutôt que de choisir un seul modèle.</p>\n<p>Tous les modèles partagent des capacités fondamentales : génération de texte, codage, analyse d'images. La principale différence réside dans leur axe d'optimisation.</p>\n<hr />", "id": "c1-0"}, {"level": 3, "title": "Accéder à l'API", "children": [], "html": "<p>Flux d'accès à l'API = un processus en 5 étapes, de la saisie utilisateur à l'affichage de la réponse.</p>\n<p>Étape 1 : le client envoie le texte de l'utilisateur au serveur du développeur (n'accédez jamais directement à l'Anthropic API depuis une application client, afin de garder la clé API confidentielle).</p>\n<p>Étape 2 : le serveur effectue une requête à l'Anthropic API à l'aide d'un SDK (Python, TypeScript, JavaScript, Go, Ruby) ou d'une simple requête HTTP. Paramètres requis = clé API + nom du modèle + liste de messages + limite <code>max_tokens</code> (nombre maximal de tokens générés).</p>\n<p>Étape 3 : le processus de génération de texte comporte 4 étapes :<br />\n- Tokenisation = découpage de l'entrée en tokens (mots / parties de mots / symboles / espaces).<br />\n- Embedding = conversion des tokens en une liste de nombres représentant tous les sens possibles du mot.<br />\n- Contextualisation = ajustement de l'embedding en fonction des tokens voisins pour déterminer le sens précis.<br />\n- Génération = la couche de sortie produit des probabilités pour le mot suivant, le modèle sélectionne en fonction de la probabilité + du hasard, ajoute le mot choisi, puis répète le processus.</p>\n<p>Étape 4 : le modèle s'arrête lorsqu'il atteint <code>max_tokens</code> ou génère un <code>end_of_sequence token</code> spécial.</p>\n<p>Étape 5 : l'API renvoie au serveur une réponse contenant le texte généré + les compteurs d'utilisation + la raison d'arrêt, que le serveur transmet ensuite au client pour affichage.</p>\n<p>Token = un fragment de texte (mot / partie / symbole).<br />\nEmbedding = une représentation numérique du sens d'un mot.<br />\nContextualisation = affinement du sens à l'aide des mots voisins.<br />\nMax_tokens = une limite sur la longueur de génération.<br />\nStop_reason = la raison pour laquelle le modèle a arrêté de générer.</p>\n<hr />", "id": "c1-1"}, {"level": 3, "title": "Effectuer une requête", "children": [], "html": "<p>Effectuer une requête API vers Anthropic = le processus comprend 4 étapes de configuration et nécessite de comprendre la structure des messages.</p>\n<p>Étapes de configuration :<br />\n1. Installer les packages = exécuter <code>pip install anthropic python-dotenv</code> dans un notebook Jupyter.<br />\n2. Stocker la clé API = créer un fichier <code>.env</code> contenant <code>ANTHROPIC_API_KEY=\"your_key\"</code> (et l'ignorer dans le contrôle de version).<br />\n3. Charger les variables d'environnement = utiliser <code>python-dotenv</code> pour charger la clé API de manière sécurisée.<br />\n4. Créer le client = initialiser le client Anthropic et définir une variable de modèle (<code>claude-3-sonnet</code>).</p>\n<p>Structure d'une requête API :<br />\n- Fonction = <code>client.messages.create()</code><br />\n- Paramètres requis = <code>model</code>, <code>max_tokens</code>, <code>messages</code><br />\n- Model = le nom du modèle Claude à utiliser.<br />\n- Max_tokens = une limite de sécurité sur la longueur de génération (pas une longueur cible).<br />\n- Messages = une liste contenant les échanges de la conversation.</p>\n<p>Types de messages :<br />\n- Message utilisateur = <code>{\"role\": \"user\", \"content\": \"your text\"}</code> (contenu rédigé par un humain).<br />\n- Message assistant = contient la réponse générée par le modèle.</p>\n<p>Accéder à la réponse :<br />\n- Réponse complète = contient des métadonnées et une structure imbriquée.<br />\n- Texte brut = <code>message.content[0].text</code> extrait uniquement le texte généré.</p>\n<p>Exemple de structure de requête : <code>client.messages.create(model=model, max_tokens=1000, messages=[{\"role\": \"user\", \"content\": \"What is quantum computing?\"}])</code></p>\n<hr />", "id": "c1-2"}, {"level": 3, "title": "Conversations multi-tours", "children": [], "html": "<p>Conversations multi-tours = des conversations qui comportent plusieurs échanges aller-retour tout en préservant le contexte.</p>\n<p>Limitation clé : l'Anthropic API ne stocke aucun message. Chaque requête est indépendante et n'a aucune mémoire des échanges précédents.</p>\n<p>La solution nécessite deux étapes :<br />\n1. Maintenir manuellement la liste des messages dans votre code.<br />\n2. Envoyer l'historique complet de la conversation à chaque requête suivante.</p>\n<p>Structure des messages = une liste de dictionnaires, chacun contenant un champ <code>role</code> (user/assistant) et un champ <code>content</code>.</p>\n<p>Flux de conversation :<br />\n- Envoyer le message utilisateur initial.<br />\n- Recevoir la réponse de l'assistant.<br />\n- Ajouter la réponse de l'assistant à l'historique des messages.<br />\n- Ajouter le nouveau message utilisateur à l'historique.<br />\n- Envoyer l'historique complet pour des échanges de suivi tenant compte du contexte.</p>\n<p>Des fonctions utilitaires sont nécessaires :<br />\n- <code>add_user_message(messages, text)</code> = ajoute un message utilisateur à l'historique.<br />\n- <code>add_assistant_message(messages, text)</code> = ajoute une réponse de l'assistant à l'historique.<br />\n- <code>chat(messages)</code> = envoie l'historique des messages à l'API et renvoie la réponse.</p>\n<p>Sans historique des messages = les réponses manquent de contexte et de continuité. Avec l'historique complet = Claude peut maintenir le contexte conversationnel et fournir des réponses de suivi pertinentes.</p>\n<hr />", "id": "c1-3"}, {"level": 3, "title": "Prompts système", "children": [], "html": "<p>Prompts système = une technique permettant de personnaliser le style et le ton des réponses de Claude en lui attribuant un rôle ou un modèle de comportement spécifique.</p>\n<p>Mise en œuvre = utiliser l'argument mot-clé <code>system</code>, en passant le prompt système sous forme de simple chaîne de caractères à la fonction <code>create</code>.</p>\n<p>Objectif = contrôle la manière dont Claude répond, pas le contenu de sa réponse. Par exemple, le rôle d'un tuteur de mathématiques amènera Claude à donner des indices plutôt que des réponses directes.</p>\n<p>Structure = la première ligne attribue généralement le rôle (« Tu es un tuteur de mathématiques patient »), suivie d'instructions comportementales spécifiques.</p>\n<p>Principe clé = le prompt système oriente l'approche de la réponse, pas son contenu. La même question sera traitée différemment selon le rôle attribué.</p>\n<p>Mise en œuvre technique = créer un dictionnaire <code>params</code>, ajouter conditionnellement la clé <code>system</code> si un prompt est fourni, puis passer <code>params</code> à la fonction <code>create</code> à l'aide du dépaquetage <code>**</code>. Gérer le cas <code>None</code> en excluant complètement le paramètre <code>system</code>.</p>\n<p>Exemple de cas d'usage = un tuteur de mathématiques qui fournit des indications/indices plutôt que des solutions complètes, encourageant l'étudiant à réfléchir plutôt que de lui donner directement la réponse.</p>\n<hr />", "id": "c1-4"}, {"level": 3, "title": "Température", "children": [], "html": "<p>Temperature = un paramètre compris entre 0 et 1 qui contrôle le caractère aléatoire de la génération de texte de Claude en influençant la probabilité de sélection des tokens.</p>\n<p>Processus de génération de texte : texte d'entrée → tokenisation → attribution de probabilités aux tokens suivants possibles → sélection d'un token en fonction de la probabilité → répétition.</p>\n<p>Effets de la température :<br />\n- Une température de 0 = sortie déterministe, sélectionnant toujours le token ayant la probabilité la plus élevée.<br />\n- Une température plus élevée = augmente la probabilité de sélectionner des tokens moins probables, produisant une sortie plus créative/inattendue.</p>\n<p>Recommandations d'utilisation :<br />\n- Une température basse (proche de 0) = pour l'extraction de données et les tâches factuelles qui exigent de la cohérence.<br />\n- Une température élevée (proche de 1) = pour les tâches créatives telles que le brainstorming, l'écriture, les blagues et le marketing.</p>\n<p>Mise en œuvre : ajouter le paramètre <code>temperature</code> à l'appel API du modèle. Une valeur plus élevée ne garantit pas une sortie différente, elle ne fait qu'augmenter la probabilité de variation.</p>\n<p>Point clé : la température manipule directement la distribution de probabilité pour la sélection du prochain token, renforçant ou affaiblissant la dominance des tokens à forte probabilité dans le processus de sélection.</p>\n<hr />", "id": "c1-5"}, {"level": 3, "title": "Le streaming des réponses", "children": [], "html": "<p>Le streaming des réponses = une technique qui affiche la réponse de l'IA morceau par morceau au fur et à mesure de sa génération, plutôt que d'attendre la réponse complète.</p>\n<p>Le problème qu'il résout : les réponses de l'IA peuvent prendre 10 à 30 secondes. Les utilisateurs attendent un retour immédiat, pas seulement une animation de chargement.</p>\n<p>Comment ça fonctionne :<br />\n1. Le serveur envoie le message de l'utilisateur à Claude.<br />\n2. Claude envoie immédiatement une réponse initiale (pas de texte, juste un accusé de réception).<br />\n3. Cela est suivi d'un flux d'événements, chacun contenant un fragment de texte.<br />\n4. Le serveur transmet ces fragments de texte au frontend pour un affichage en temps réel.</p>\n<p>Types d'événements :<br />\n- <code>message_start</code> = l'accusé de réception initial.<br />\n- <code>content_block_start</code> = la génération de texte commence.<br />\n- <code>content_block_delta</code> = contient le fragment de texte réel (le plus important).<br />\n- <code>content_block_stop</code>/<code>message_stop</code> = la génération est terminée.</p>\n<p>Mise en œuvre :<br />\nVersion basique : <code>client.messages.create(stream=True)</code> renvoie un itérateur d'événements.<br />\nVersion simplifiée : <code>client.messages.stream()</code> et son attribut <code>text_stream</code> extraient uniquement le texte.<br />\nMessage final : <code>stream.get_final_message()</code> assemble tous les fragments de texte pour le stockage.</p>\n<p>Principaux avantages : améliore l'expérience utilisateur (UX) grâce à la visibilité immédiate de la réponse, et permet de capturer le message complet pour le stockage en base de données.</p>\n<hr />", "id": "c1-6"}, {"level": 3, "title": "Contrôler la sortie du modèle", "children": [], "html": "<p><strong>Contrôler la sortie du modèle = deux techniques clés au-delà de la modification du prompt</strong></p>\n<p><strong>Pré-remplissage des messages assistant = ajout manuel d'un message assistant à la fin de la conversation pour orienter la direction de la réponse</strong></p>\n<p>Comment ça fonctionne :<br />\n- Assembler une liste de messages contenant le prompt utilisateur + un message assistant ajouté manuellement.<br />\n- Claude traite ce message assistant comme un contenu déjà rédigé.<br />\n- Claude poursuit la réponse précisément à partir de la fin du texte pré-rempli.<br />\n- La réponse est orientée dans la direction du pré-remplissage.</p>\n<p>Point clé : Claude reprend exactement à la fin du pré-remplissage, pas au début d'une phrase complète. Vous devez concaténer la partie pré-remplie avec la réponse générée.</p>\n<p>Exemple : pré-remplissage « Le café est meilleur parce que » → Claude poursuivra avec des arguments en faveur du café.</p>\n<p><strong>Stop Sequences (séquences d'arrêt) = forcer Claude à s'arrêter de générer lorsqu'une chaîne de caractères spécifique apparaît</strong></p>\n<p>Comment ça fonctionne :<br />\n- Fournir une chaîne de séquence d'arrêt dans la fonction de chat.<br />\n- Lorsque Claude génère exactement cette chaîne, la réponse s'arrête immédiatement.<br />\n- Le texte de la séquence d'arrêt généré n'est pas inclus dans la sortie finale.</p>\n<p>Exemple : prompt « Count from 1 to 10 » + séquence d'arrêt « five » → la sortie s'arrête à « four, » (« five » n'est pas inclus).</p>\n<p>Optimisation : définir la séquence d'arrêt sur « , five » → produit la sortie propre « one, two, three, four ».</p>\n<p>Ces deux techniques offrent un contrôle précis sur la direction et la longueur de la réponse sans modifier le prompt principal.</p>\n<hr />", "id": "c1-7"}, {"level": 3, "title": "Données structurées", "children": [], "html": "<p>Génération de données structurées = une technique qui combine le pré-remplissage des messages assistant et les séquences d'arrêt pour obtenir une sortie brute, sans les en-têtes/pieds de page explicatifs que Claude ajoute naturellement.</p>\n<p>Problème = lors de la génération de JSON/code/contenu structuré, Claude ajoute automatiquement du formatage markdown, des titres et des commentaires. Les utilisateurs veulent souvent simplement les données brutes pour un copier-coller facile.</p>\n<p>Schéma de solution :<br />\n1. Message utilisateur = demander des données structurées.<br />\n2. Pré-remplissage du message assistant = utiliser un délimiteur de début (par ex., \"```json\").<br />\n3. Séquence d'arrêt = utiliser un délimiteur de fin (par ex., \"```\").</p>\n<p>Comment ça fonctionne = Claude voit le message pré-rempli, présume qu'il a déjà commencé la réponse, et génère donc uniquement le contenu demandé, puis s'arrête lorsqu'il rencontre le délimiteur.</p>\n<p>Résultat = obtenir une sortie de données structurées brute, sans formatage ni commentaires supplémentaires.</p>\n<p>Application = applicable à tout type de données structurées (JSON, code Python, listes, etc.), pas seulement au JSON. Elle peut être utilisée chaque fois que vous avez besoin d'une sortie propre et analysable, sans texte explicatif.</p>\n<p>Principal avantage = la sortie peut être utilisée/copiée directement, sans avoir à sélectionner ou extraire manuellement le texte indésirable.</p>\n<hr />", "id": "c1-8"}, {"level": 3, "title": "Évaluation des prompts", "children": [], "html": "<p>Prompt Engineering = la technique consistant à rédiger/modifier des prompts pour aider Claude à comprendre la demande et la réponse attendue.</p>\n<p>Évaluation des prompts = tester automatiquement les prompts à l'aide de métriques objectives pour mesurer leur efficacité.</p>\n<p>Trois voies possibles après la rédaction d'un prompt :<br />\n1. Tester une ou deux fois, puis déployer en production (un piège).<br />\n2. Tester avec des entrées personnalisées et ajuster pour les cas limites (un piège).<br />\n3. Le faire passer par un pipeline d'évaluation pour obtenir des scores objectifs (recommandé).</p>\n<p>Point clé à retenir : les ingénieurs testent généralement trop peu leurs prompts. Vous devriez utiliser un pipeline d'évaluation pour obtenir des scores de performance objectifs avant d'itérer sur les prompts et de les déployer.</p>\n<hr />", "id": "c1-9"}, {"level": 3, "title": "Un workflow d'évaluation typique", "children": [], "html": "<p>Un workflow d'évaluation typique = un processus itératif en 6 étapes pour améliorer les prompts.</p>\n<p>Étape 1 : rédiger une première ébauche de prompt - créer un prompt de référence à optimiser.</p>\n<p>Étape 2 : créer un dataset d'évaluation - un ensemble d'entrées de test (cela peut être 3 exemples ou des milliers, écrits à la main ou générés par un LLM).</p>\n<p>Étape 3 : générer des variantes de prompt - insérer chaque entrée du dataset dans le template de prompt.</p>\n<p>Étape 4 : obtenir les réponses du LLM - soumettre chaque variante de prompt à Claude et collecter les sorties.</p>\n<p>Étape 5 : noter les réponses - utiliser un système de notation pour noter chaque réponse (par ex., sur une échelle de 1 à 10) et calculer le score moyen pour évaluer la performance globale du prompt.</p>\n<p>Étape 6 : itérer - réviser le prompt en fonction des scores, répéter l'ensemble du processus et comparer différentes versions.</p>\n<p>Points clés : il n'existe actuellement aucune méthode standard. De nombreux outils open source/payants sont disponibles. Vous pouvez commencer avec une implémentation personnalisée simple. La complexité de la notation varie. La notation objective permet une amélioration systématique des prompts grâce à la comparaison A/B.</p>\n<hr />", "id": "c1-10"}, {"level": 3, "title": "Générer un dataset de test", "children": [], "html": "<p>Un workflow d'évaluation de prompt personnalisé = construire le prompt + générer un dataset de test + évaluer la performance.</p>\n<p>Objectif = un prompt d'assistance au code AWS qui ne produit que du Python, de la configuration JSON ou des expressions régulières, sans aucune explication.</p>\n<p>Approche de génération du dataset = assembler manuellement ou générer automatiquement avec Claude (en utilisant un modèle rapide comme Haiku pour la génération).</p>\n<p>Structure du dataset = un tableau d'objets JSON, chacun contenant une propriété <code>task</code> décrivant une demande utilisateur.</p>\n<p>Processus de génération = demander à Claude de créer des cas de test → utiliser le pré-remplissage du message assistant \"```json\" → définir la séquence d'arrêt \"```\" → analyser la réponse en tant que JSON → enregistrer dans un fichier.</p>\n<p>Mise en œuvre clé = la fonction <code>generate_dataset()</code>, qui envoie un prompt à Claude, obtient une réponse JSON structurée (contenant les tâches de test), et l'enregistre dans un fichier <code>dataset.json</code> pour une utilisation ultérieure dans l'évaluation.</p>\n<p>Le dataset de test permet une évaluation systématique en mesurant la constance de la performance lors de l'exécution du prompt sur une variété de scénarios d'entrée.</p>\n<hr />", "id": "c1-11"}, {"level": 3, "title": "Exécuter l'évaluation", "children": [], "html": "<p>Le processus d'exécution de l'évaluation = fusionner les cas de test avec le prompt, les faire passer par le LLM, et noter les sorties.</p>\n<p>Cas de test = un seul enregistrement du dataset (un objet JSON).</p>\n<p>Trois fonctions principales :<br />\n- <code>run_prompt</code> = fusionne un cas de test avec le prompt, l'envoie à Claude, et renvoie la sortie.<br />\n- <code>run_test_case</code> = appelle <code>run_prompt</code>, note le résultat, et renvoie un dictionnaire récapitulatif.<br />\n- <code>run_eval</code> = itère sur le dataset, appelle <code>run_test_case</code> pour chacun, et agrège les résultats.</p>\n<p>Structure de prompt basique = \"Please solve the following task: [test_case_task]\" (le point de départ de la v1).</p>\n<p>Limitations actuelles = aucune instruction de formatage de sortie, notation codée en dur (score=10), et les réponses de Claude sont verbeuses.</p>\n<p>Temps d'exécution = l'exécution sur l'ensemble du dataset avec le modèle Haiku prend environ 31 secondes.</p>\n<p>Format de sortie = un tableau d'objets, chacun contenant la sortie de Claude, le cas de test original, et le score.</p>\n<p>Prochaine étape = mettre en œuvre un véritable système de notation pour remplacer le score codé en dur.</p>\n<p>Le cœur du pipeline d'évaluation = dataset + prompt + LLM + grader (évaluateur), avec une complexité de code minimale.</p>\n<hr />", "id": "c1-12"}, {"level": 3, "title": "Notation basée sur un modèle", "children": [], "html": "<p>Notation basée sur un modèle = un système d'évaluation qui prend la sortie du modèle et lui attribue un score objectif (généralement de 1 à 10, où 10 correspond à la meilleure qualité).</p>\n<p>Trois types de graders (évaluateurs) :<br />\n- Grader par code = des vérifications programmatiques (longueur, présence de mots, validation syntaxique, score de lisibilité).<br />\n- Grader par modèle = un appel API supplémentaire pour évaluer la sortie du modèle original ; très flexible pour évaluer la qualité / le respect des instructions.<br />\n- Grader humain = un humain évalue la réponse ; le plus flexible mais chronophage et fastidieux.</p>\n<p>Exigence clé : doit renvoyer un signal objectif (généralement un score numérique). Définir les critères d'évaluation à l'avance.</p>\n<p>Schéma de mise en œuvre pour un grader par modèle :<br />\n- Créer un prompt détaillé demandant les points forts/points faibles/raisonnement/score (pas seulement un score, afin d'éviter un score moyen par défaut).<br />\n- Utiliser un format de réponse JSON avec pré-remplissage du message assistant et une séquence d'arrêt.<br />\n- Extraire le score et le raisonnement du JSON renvoyé.<br />\n- Calculer le score moyen sur l'ensemble des cas de test comme métrique finale.</p>\n<p>Un grader par modèle offre un haut degré de flexibilité mais peut manquer de cohérence. Malgré cela, il fournit toujours une base de référence objective pour l'optimisation des prompts.</p>\n<hr />", "id": "c1-13"}, {"level": 3, "title": "Notation basée sur le code", "children": [], "html": "<p>Notation basée sur le code = un système de validation automatisé pour les sorties de LLM contenant du code, du JSON, ou des expressions régulières.</p>\n<p>Mise en œuvre principale :<br />\n- <code>validate_json()</code> = tente d'analyser le JSON, renvoie 10 si valide, 0 en cas d'erreur.<br />\n- <code>validate_python()</code> = tente un <code>AST parsing</code>, renvoie 10 si valide, 0 en cas d'erreur.<br />\n- <code>validate_regex()</code> = tente de compiler l'expression régulière, renvoie 10 si valide, 0 en cas d'erreur.</p>\n<p>Exigences du dataset :<br />\n- Doit inclure une clé « format » spécifiant le type de sortie attendu (JSON/Python/RegEx).<br />\n- Mise à jour en modifiant le template de prompt pour permettre la génération automatisée du dataset.</p>\n<p>Prompt engineering :<br />\n- Instruire le modèle de répondre uniquement avec du code/JSON/regex brut.<br />\n- Aucun commentaire, explication, ou remarque.<br />\n- Utiliser un pré-remplissage du message assistant et un bloc ```code```.<br />\n- Ajouter une séquence d'arrêt pour extraire une sortie propre.</p>\n<p>Système de notation :<br />\n- Score final = (score du modèle + score de syntaxe) / 2.<br />\n- Combine l'évaluation sémantique avec la validation syntaxique.<br />\n- Permet de mesurer à la fois l'exactitude et la validité technique.</p>\n<p>Limitation clé = le format attendu doit être connu à l'avance afin de sélectionner le bon validateur.</p>\n<hr />", "id": "c1-14"}, {"level": 3, "title": "Prompt Engineering", "children": [], "html": "<p>Prompt Engineering = la technique consistant à améliorer les prompts pour obtenir une sortie plus fiable et de meilleure qualité d'un modèle de langage.</p>\n<p>Structure du module : partir d'un prompt initial médiocre → appliquer progressivement des techniques de prompt engineering → évaluer l'amélioration après l'application de chaque technique → observer comment la performance augmente au fil du temps.</p>\n<p>Objectif d'exemple : générer un plan de repas d'une journée pour un athlète en fonction de sa taille, de son poids, de ses objectifs sportifs et de ses restrictions alimentaires.</p>\n<p>Configuration technique :<br />\n- Le pipeline d'évaluation a été mis à jour avec une classe d'évaluateur de prompt flexible.<br />\n- Prend en charge la <code>concurrency</code> (ajuster <code>max_concurrent_tasks</code> en fonction des limites de débit).<br />\n- La méthode <code>generate_dataset()</code> crée des cas de test en fonction des entrées spécifiées.<br />\n- La fonction <code>run_prompt()</code> traite chaque cas de test individuellement.</p>\n<p>Composants clés :<br />\n- <code>prompt_input_spec</code> = un dictionnaire définissant les entrées de prompt requises.<br />\n- <code>extra_criteria</code> = des exigences de validation supplémentaires pour la notation par modèle.<br />\n- <code>output.html</code> = un rapport d'évaluation formaté affichant les résultats des cas de test et les scores.</p>\n<p>Processus : rédiger le prompt initial → insérer les entrées des cas de test → exécuter l'évaluation → appliquer des techniques d'ingénierie → réévaluer → répéter jusqu'à ce que la performance soit satisfaisante.</p>\n<p>Résultats initiaux : pour le prompt basique, attendez-vous à un score médiocre (par ex., 2,32), en particulier lors de l'utilisation d'un modèle moins performant. Au fur et à mesure que les techniques sont appliquées, le score s'améliorera.</p>\n<hr />", "id": "c1-15"}, {"level": 3, "title": "Soyez clair et direct", "children": [], "html": "<p>Soyez clair et direct = utilisez un langage simple et direct ainsi que des verbes d'action dès la première ligne du prompt pour spécifier clairement la tâche.</p>\n<p>Importance de la première ligne = la partie la plus critique du prompt, qui pose les fondations de la réponse de l'IA.</p>\n<p>Structure = verbe + description claire de la tâche + spécification de la sortie.</p>\n<p>Exemples :<br />\n- \"Rédige trois paragraphes sur le fonctionnement des panneaux solaires.\"<br />\n- \"Trouve trois pays qui utilisent l'énergie géothermique, et inclus des statistiques de production d'électricité pour chacun.\"<br />\n- \"Génère un plan de repas d'une journée pour un athlète qui respecte ses restrictions alimentaires.\"</p>\n<p>Composants clés = un verbe en début de phrase + un énoncé de tâche direct + les détails de la sortie attendue.</p>\n<p>Résultat = amélioration de la performance du prompt (l'exemple montre le score passer de 2,32 à 3,92).</p>\n<hr />", "id": "c1-16"}, {"level": 3, "title": "Être précis", "children": [], "html": "<p>Être précis = ajouter des consignes ou des étapes pour orienter la sortie du modèle dans une direction particulière.</p>\n<p>Deux types de consignes :<br />\nType A (attributs) = lister les qualités/attributs que la sortie attendue doit avoir (longueur, structure, format).<br />\nType B (étapes) = fournir au modèle des étapes spécifiques à suivre pendant son processus de raisonnement.</p>\n<p>Le type A contrôle les caractéristiques de la sortie. Le type B contrôle la manière dont le modèle arrive à la réponse.</p>\n<p>Ces deux techniques sont souvent combinées dans les prompts professionnels.</p>\n<p>Quand les utiliser :<br />\n- Type A (attributs) : recommandé pour presque tous les prompts.<br />\n- Type B (étapes) : pour les problèmes complexes, lorsque vous voulez que le modèle envisage une perspective plus large ou des points de vue alternatifs qu'il ne considérerait pas naturellement.</p>\n<p>Exemple d'amélioration : après l'ajout de consignes, le score du prompt de plan de repas est passé de 3,92 à 7,86, démontrant que la précision peut considérablement améliorer la qualité.</p>\n<hr />", "id": "c1-17"}, {"level": 3, "title": "Structurer avec des balises XML", "children": [], "html": "<p>Structurer un prompt avec des <code>XML Tags</code> = utiliser des balises XML pour organiser et délimiter différentes sections de contenu au sein d'un prompt afin d'améliorer la compréhension de l'IA.</p>\n<p>Objectif = lors de l'insertion de grandes quantités de contenu dans un prompt, les balises XML aident le modèle d'IA à distinguer les différents types d'informations et à comprendre les regroupements de texte.</p>\n<p>Mise en œuvre = envelopper les sections de contenu dans des balises XML descriptives telles que <code>&lt;document&gt;</code> ou <code>&lt;example&gt;</code>, plutôt que d'empiler directement du texte non structuré.</p>\n<p>Nommage des balises = utiliser des noms de balises descriptifs et spécifiques (par ex., « sales_records » est préférable à « data ») pour fournir du contexte sur la nature du contenu.</p>\n<p>Exemple de cas d'usage = un prompt de débogage contenant un mélange de code et de documentation devient beaucoup plus clair lorsqu'il est séparé à l'aide des balises <code>&lt;source_code&gt;</code> et <code>&lt;documentation&gt;</code>.</p>\n<p>Avantages = rend la structure du prompt évidente pour l'IA, réduisant la confusion sur les limites du contenu et améliorant la qualité de la sortie, même pour de petits fragments de contenu.</p>\n<p>Application = vous pouvez envelopper n'importe quel contenu inséré, comme <code>&lt;user_input&gt;</code>, pour le marquer clairement comme une entrée externe à prendre en compte, même lorsque le contenu est court.</p>\n<hr />", "id": "c1-18"}, {"level": 3, "title": "Fournir des exemples", "children": [], "html": "<p>One-shot/Multi-shot prompting = fournir des exemples dans le prompt pour guider le comportement du modèle. One-shot = un seul exemple, multi-shot = plusieurs exemples.</p>\n<p>Mise en œuvre : structurer les exemples à l'aide de balises XML contenant des exemples d'entrées et de sorties idéales. Toujours envelopper les exemples clairement pour les distinguer du contenu réel du prompt.</p>\n<p>Principales applications :<br />\n- Gestion des cas limites (détection du sarcasme, scénarios limites).<br />\n- Formatage complexe de la sortie (structures JSON, formats spécifiques).<br />\n- Clarification de la qualité/du style de réponse attendu.</p>\n<p>Bonnes pratiques :<br />\n- Ajouter du contexte pour les cas limites (« prête une attention particulière au sarcasme »).<br />\n- Inclure un raisonnement expliquant pourquoi la sortie est idéale.<br />\n- Utiliser les exemples ayant obtenu les meilleurs scores lors de l'évaluation des prompts comme modèles.<br />\n- Placer les exemples après les instructions/consignes principales.</p>\n<p>Amélioration de l'efficacité : combiner les exemples avec des explications sur les raisons pour lesquelles ils sont idéaux afin de renforcer les caractéristiques de sortie souhaitées.</p>\n<hr />", "id": "c1-19"}, {"level": 3, "title": "Introduction à l'utilisation des outils (Tool Use)", "children": [], "html": "<p>Tool use = un moyen de donner à Claude accès à des informations externes au-delà de ses données d'entraînement.</p>\n<p>Limitation par défaut : Claude ne connaît que les informations contenues dans ses données d'entraînement et manque d'informations actuelles/en temps réel.</p>\n<p>Flux d'utilisation des outils :<br />\n1. Envoyer à Claude une requête initiale + des instructions pour accéder aux données externes.<br />\n2. Claude évalue si des données externes sont nécessaires et demande des informations spécifiques.<br />\n3. Le serveur exécute du code pour récupérer les données demandées à partir d'une source externe.<br />\n4. Envoyer à Claude une requête de suivi contenant les données récupérées.<br />\n5. Claude génère la réponse finale en utilisant le prompt original + les données externes.</p>\n<p>Exemple météo : l'utilisateur demande la météo actuelle → Claude demande les données météo → le serveur appelle une API météo → Claude reçoit les données météo → Claude fournit une réponse météo informée.</p>\n<p>Concept clé : les outils permettent à Claude d'enrichir ses réponses avec des informations en temps réel/actuelles en orchestrant la récupération de données externes entre les requêtes de Claude.</p>\n<hr />", "id": "c1-20"}, {"level": 3, "title": "Aperçu du projet", "children": [], "html": "<p><strong>Aperçu du projet</strong></p>\n<p>Objectif = mettre en œuvre, avec des outils dans un notebook Jupyter, l'apprentissage à Claude de la mise en place de rappels basés sur le temps.</p>\n<p>Interaction cible = Utilisateur : « Mets-moi un rappel pour mon rendez-vous chez le médecin jeudi prochain » → Claude : « Je te le rappellerai à ce moment-là. »</p>\n<p><strong>Trois problèmes fondamentaux qui nécessitent des outils pour être résolus :</strong></p>\n<ol>\n<li>Lacune de connaissance temporelle = Claude connaît la date actuelle mais pas l'heure exacte.</li>\n<li>Erreurs de calcul temporel = Claude calcule parfois mal les additions basées sur le temps (par ex., 379 jours à partir du 13 janvier 1973).</li>\n<li>Absence de mécanisme de rappel = Claude comprend le concept de rappel mais n'a pas la capacité d'en mettre un en place.</li>\n</ol>\n<p><strong>Trois outils correspondants qui doivent être construits :</strong></p>\n<ol>\n<li>Outil de date-heure actuelle = récupère la date + l'heure actuelles.</li>\n<li>Outil d'ajout de durée = ajoute une durée à une date-heure (par ex., date actuelle + 20 jours).</li>\n<li>Outil de création de rappel = met effectivement en place le rappel.</li>\n</ol>\n<p>Approche de mise en œuvre = construire un outil à la fois, en parvenant progressivement à une coordination multi-outils.</p>\n<hr />", "id": "c1-21"}, {"level": 3, "title": "Fonctions d'outil (Tool Functions)", "children": [], "html": "<p>Tool Functions = des fonctions Python qui sont exécutées automatiquement lorsque Claude a besoin d'informations supplémentaires pour aider l'utilisateur.</p>\n<p>Principales caractéristiques :<br />\n- Des fonctions Python ordinaires que Claude appelle lorsqu'il détermine qu'il a besoin de données supplémentaires.<br />\n- Doivent utiliser des noms de fonction et de paramètre descriptifs.<br />\n- Doivent valider les entrées et lever des erreurs avec des messages significatifs en cas d'entrées invalides.<br />\n- Les messages d'erreur sont visibles par Claude, ce qui lui permet de réessayer avec des paramètres corrigés.</p>\n<p>Bonnes pratiques :<br />\n1. Des fonctions et des paramètres bien nommés.<br />\n2. Valider les entrées invalides et lever des erreurs immédiatement.<br />\n3. Des messages d'erreur significatifs qui guident les corrections.</p>\n<p>Exemple de schéma de mise en œuvre :</p>\n<pre><code>def get_current_datetime(date_format=&quot;%Y%m%d %H:%M:%S&quot;):\n    if not date_format:\n        raise ValueError(&quot;date format cannot be empty&quot;)\n    return datetime.now().strftime(date_format)\n</code></pre>\n<p>Flux d'une fonction d'outil : Claude identifie un besoin d'information → appelle la fonction d'outil → reçoit le résultat ou une erreur → si une erreur se produit, il peut réessayer avec des paramètres corrigés.</p>\n<p>Objectif : étendre les capacités de Claude au-delà de ses données d'entraînement en lui donnant accès à des informations en temps réel (comme la date-heure actuelle, la météo, etc.).</p>\n<hr />", "id": "c1-22"}, {"level": 3, "title": "Schémas d'outil (Tool Schemas)", "children": [], "html": "<p>Tool Schemas = des spécifications de schéma JSON qui décrivent les fonctions d'outil et leurs paramètres, destinées à être utilisées par le modèle de langage.</p>\n<p><code>JSON Schema</code> = une spécification de validation de données (non spécifique au machine learning) utilisée pour valider des données JSON, que la communauté du machine learning a adoptée pour le tool use.</p>\n<p>Structure d'un schéma d'outil :<br />\n- <code>name</code> : l'identifiant de l'outil.<br />\n- <code>description</code> : 3 à 4 phrases expliquant ce que fait l'outil, quand l'utiliser, et quelles données il renvoie.<br />\n- <code>input_schema</code> : le schéma JSON proprement dit décrivant les paramètres de la fonction, y compris les types et les descriptions.</p>\n<p>Conseils pour générer un schéma :<br />\n1. Fournir la fonction d'outil à Claude.ai.<br />\n2. Prompt : « Écris une spécification de schéma JSON valide pour cette fonction destinée au tool use, en suivant les bonnes pratiques de la documentation ci-jointe. »<br />\n3. Joindre la page sur le tool use de la documentation de l'Anthropic API.<br />\n4. Copier le schéma généré.</p>\n<p>Schéma de mise en œuvre :<br />\n- Nommer la fonction de manière descriptive.<br />\n- Nommer le schéma [function_name]_schema.<br />\n- Importer <code>ToolParam</code> depuis <code>anthropic.types</code>.<br />\n- Envelopper le dictionnaire de schéma dans <code>ToolParam()</code> pour éviter les erreurs de type.</p>\n<p>Objectif = informer Claude des outils disponibles, des paramètres requis, et du contexte d'utilisation, via un format de validation JSON standardisé.</p>\n<hr />", "id": "c1-23"}, {"level": 3, "title": "Gérer les blocs de message", "children": [], "html": "<p><strong>Requêtes Claude avec prise en charge des outils</strong></p>\n<p>Étape 3 : effectuer une requête à Claude avec des outils = dans la requête, en plus du message utilisateur, inclure le schéma d'outil (contenant la spécification de schéma JSON) à l'aide de l'argument mot-clé <code>tools</code>.</p>\n<p><strong>Messages multi-blocs</strong></p>\n<p>Changement de structure du contenu = le message contient désormais plusieurs blocs, et non plus un simple bloc de texte.</p>\n<p>Format de réponse d'outil = le message assistant contient :<br />\n- Bloc de texte = une explication destinée à l'utilisateur.<br />\n- Bloc tool use = contient le nom de la fonction + les paramètres de l'exécution de l'outil.</p>\n<p><strong>Gestion de l'historique des messages</strong></p>\n<p>Exigence clé = maintenir manuellement l'historique de la conversation, puisque Claude ne stocke rien.</p>\n<p>Gestion multi-blocs = ajouter l'intégralité du <code>response.content</code> (tous les blocs) à la liste des messages, pas seulement le texte.</p>\n<p>Les fonctions utilitaires doivent être mises à jour = les fonctions <code>add_user_message</code> et <code>add_assistant_message</code> doivent prendre en charge plusieurs blocs, et non plus un seul bloc de texte.</p>\n<p>Flux de conversation = message utilisateur → réponse de l'assistant avec un bloc tool use → exécution de l'outil → réponse à Claude avec l'historique complet.</p>\n<hr />", "id": "c1-24"}, {"level": 3, "title": "Envoyer les résultats d'outil", "children": [], "html": "<p>Tool Results = les résultats obtenus à partir d'une fonction d'outil exécutée, renvoyés à Claude dans une requête de suivi.</p>\n<p>Processus : exécuter la fonction d'outil demandée par Claude → créer un <code>Tool Result Block</code> → envoyer une requête de suivi contenant l'historique complet de la conversation.</p>\n<p>Structure d'un bloc de résultat d'outil :<br />\n- <code>tool_use_id</code> = correspond à l'ID du bloc tool use original, afin d'associer la requête au résultat.<br />\n- <code>content</code> = la sortie de la fonction d'outil, convertie en chaîne de caractères (généralement du JSON).<br />\n- <code>is_error</code> = un indicateur booléen signalant une erreur d'exécution de la fonction (false par défaut).</p>\n<p>Objectif de <code>tool_use_id</code> = relier plusieurs requêtes d'outil aux résultats corrects lorsque Claude effectue plusieurs appels d'outil à la fois. Chaque tool use reçoit un ID unique, et le résultat d'outil doit référencer l'ID correspondant.</p>\n<p>Exigences de la requête de suivi :<br />\n- Inclure l'historique complet des messages (le message utilisateur original + le message tool use de l'assistant + le nouveau message utilisateur contenant le résultat d'outil).<br />\n- Le schéma d'outil original doit être inclus même si les outils ne sont plus utilisés.<br />\n- Le bloc de résultat d'outil se place dans un message utilisateur, pas dans un message assistant.</p>\n<p>Flux de conversation : requête utilisateur → réponse de l'assistant Claude (texte + bloc tool use) → le serveur exécute l'outil → message utilisateur contenant le bloc de résultat d'outil → réponse finale de Claude (intégrant le résultat).</p>\n<hr />", "id": "c1-25"}, {"level": 3, "title": "Conversations multi-tours avec des outils", "children": [], "html": "<p>Conversations multi-tours avec des outils = une conversation dans laquelle Claude utilise plusieurs outils de manière séquentielle pour répondre à une seule requête utilisateur.</p>\n<p>Le processus <code>Tool Chaining</code> = l'utilisateur pose une question → Claude demande le premier outil → l'outil s'exécute → renvoie le résultat → Claude demande le second outil → l'outil s'exécute → renvoie le résultat → Claude fournit la réponse finale.</p>\n<p>Exemple de flux = l'utilisateur demande « Quel jour sera-t-on dans 103 jours à partir d'aujourd'hui » → Claude appelle <code>get_current_datetime</code> → Claude appelle <code>add_duration_to_datetime</code> → Claude fournit la réponse.</p>\n<p>Pattern d'implémentation = utiliser une boucle <code>while</code> qui continue d'appeler Claude jusqu'à ce qu'il n'y ait plus de demande d'outil, en vérifiant à chaque réponse la présence d'un bloc <code>tool_use</code>.</p>\n<p>La fonction <code>run_conversation</code> = prend les messages initiaux, appelle Claude dans une boucle, exécute les outils demandés, ajoute les résultats à la conversation, jusqu'à obtenir une réponse finale.</p>\n<p>Refactoring nécessaire :<br />\n- <code>add_user_message</code>/<code>add_assistant_message</code> = mises à jour pour gérer plusieurs blocs de message, et pas seulement du texte brut.<br />\n- Fonction <code>chat</code> = accepte un paramètre <code>tools</code> et renvoie le message entier plutôt que le seul premier bloc de texte.<br />\n- Fonction utilitaire <code>text_from_message</code> = extrait tous les blocs de texte d'un message contenant plusieurs blocs de contenu.</p>\n<p>Idée centrale = on ne peut pas prédire combien d'outils une requête utilisateur nécessitera, donc le système doit pouvoir gérer automatiquement des chaînes d'appels d'outils de longueur arbitraire.</p>\n<hr />", "id": "c1-26"}, {"level": 3, "title": "Implémenter l'interaction multi-tours", "children": [], "html": "<p><strong>Implémenter l'interaction multi-tours = continuer à appeler Claude jusqu'à ce qu'il arrête de demander des outils</strong></p>\n<p><strong>Le champ <code>stop_reason</code> = indique pourquoi Claude a arrêté de générer du texte</strong><br />\n- <code>stop_reason</code> = \"tool_use\" signifie que Claude veut appeler un outil.<br />\n- D'autres valeurs existent, mais <code>tool_use</code> est celle que l'on vérifie le plus souvent.</p>\n<p><strong>La fonction <code>run_conversation</code> = la boucle principale, qui fonctionne ainsi :</strong><br />\n1. Appeler Claude avec les messages + les outils disponibles.<br />\n2. Ajouter la réponse de l'assistant à l'historique de la conversation.<br />\n3. Vérifier <code>stop_reason</code> - si ce n'est pas \"tool_use\", sortir de la boucle.<br />\n4. Si c'est \"tool_use\", appeler la fonction <code>run_tools</code>.<br />\n5. Ajouter les résultats des outils en tant que message utilisateur.<br />\n6. Répéter le processus jusqu'à ce qu'il n'y ait plus de demande d'outil.</p>\n<p><strong>La fonction <code>run_tools</code> = gère plusieurs blocs d'utilisation d'outil :</strong><br />\n1. Filtrer <code>message.content</code> pour ne garder que les blocs de type \"tool_use\".<br />\n2. Itérer sur chaque demande d'outil.<br />\n3. Exécuter la fonction outil correspondante via la fonction utilitaire <code>run_tool</code>.<br />\n4. Créer un bloc <code>tool_result</code> contenant : <code>type=\"tool_result\"</code>, <code>tool_use_id=original_id</code>, <code>content=JSON_encoded_output</code>, <code>is_error=boolean</code>.<br />\n5. Renvoyer une liste de tous les blocs de résultat d'outil.</p>\n<p><strong>La fonction <code>run_tool</code> = un dispatcher, qui fonctionne ainsi :</strong><br />\n- Reçoit <code>tool_name</code> et <code>tool_input</code>.<br />\n- Utilise des instructions <code>if</code> pour faire correspondre le nom de l'outil à une fonction.<br />\n- Exécute la fonction outil correspondante.<br />\n- Extensible pour ajouter plusieurs outils.</p>\n<p><strong>Gestion des erreurs = utiliser un bloc <code>try/except</code> autour de l'exécution de l'outil :</strong><br />\n- Succès : <code>is_error=false</code>, <code>content=tool_output</code>.<br />\n- Échec : <code>is_error=true</code>, <code>content=error_message</code>.</p>\n<p><strong>Points d'architecture clés :</strong><br />\n- Un message assistant peut contenir plusieurs blocs (texte + plusieurs <code>tool_use</code>).<br />\n- Chaque bloc <code>tool_use</code> reçoit une réponse <code>tool_result</code> distincte.<br />\n- Les résultats d'outils sont renvoyés sous forme de message utilisateur contenant tous les résultats.<br />\n- Le processus se répète jusqu'à ce que Claude fournisse une réponse finale en texte brut.</p>\n<hr />", "id": "c1-27"}, {"level": 3, "title": "Utiliser plusieurs outils", "children": [], "html": "<p>Implémenter plusieurs outils = ajouter des outils supplémentaires à un système d'outils existant une fois le cadre initial mis en place.</p>\n<p>Processus = 3 étapes : (1) ajouter le schéma de l'outil à la liste <code>tools</code> dans la fonction <code>RunConversation</code>, (2) ajouter une branche conditionnelle dans la fonction <code>RunTool</code> pour gérer le nouveau nom d'outil, (3) implémenter la fonction outil elle-même.</p>\n<p>Composants clés :<br />\n- Fonction <code>RunConversation</code> = contient la liste <code>tools</code>, qui informe Claude des outils disponibles.<br />\n- Fonction <code>RunTool</code> = route un appel d'outil vers la fonction correspondante en fonction du nom de l'outil.<br />\n- Schéma d'outil = définit la structure de l'outil pour le modèle d'IA.<br />\n- Fonction outil = le code d'implémentation réel.</p>\n<p>Exemples d'outils ajoutés :<br />\n- <code>AddDurationToDateTime</code> = calcule une date/heure avec un décalage de durée.<br />\n- <code>SetReminder</code> = crée un rappel (une implémentation factice qui affiche un message de confirmation).</p>\n<p>Chaînage d'outils = l'IA peut utiliser plusieurs outils de manière séquentielle au sein d'une seule conversation (par exemple, d'abord calculer une date, puis utiliser le résultat pour définir un rappel).</p>\n<p>Structure des messages = une réponse assistant peut contenir plusieurs blocs : un bloc de texte et un bloc d'utilisation d'outil peuvent apparaître ensemble dans le même message.</p>\n<p>Extensibilité = une fois le cadre initial mis en place, l'ajout d'un nouvel outil devient un pattern simple : schéma + routage + implémentation.</p>\n<hr />", "id": "c1-28"}, {"level": 3, "title": "Batch Tool", "children": [], "html": "<p>Batch Tool = un outil qui permet à Claude d'exécuter plusieurs outils en parallèle au sein d'un seul message assistant, plutôt que d'effectuer plusieurs requêtes séquentielles.</p>\n<p>Problème : en théorie, Claude peut envoyer plusieurs blocs d'utilisation d'outil dans un seul message, mais en pratique il le fait rarement, ce qui entraîne des appels d'outils séquentiels inutiles.</p>\n<p>Solution : créer un schéma de batch tool qui accepte une liste d'<code>invocations</code>, chacune contenant un nom d'outil + des paramètres. Plutôt que d'appeler les outils directement, Claude appelle ce batch tool avec un tableau des outils qu'il souhaite exécuter.</p>\n<p>Implémentation :<br />\n- Ajouter le batch tool au schéma avec un paramètre <code>invocations</code>.<br />\n- Créer une fonction <code>run_batch</code> qui itère sur la liste <code>invocations</code>.<br />\n- Extraire le nom de l'outil et les paramètres décodés en JSON de chaque invocation.<br />\n- Appeler la fonction <code>run_tool</code> pour chaque outil demandé.<br />\n- Renvoyer une liste <code>batch_output</code> contenant les résultats de toutes les exécutions d'outils.</p>\n<p>Mécanisme : en fournissant une abstraction de plus haut niveau, on effectue manuellement ce que la gestion de plusieurs blocs d'utilisation d'outil devrait faire automatiquement, ce qui « pousse » Claude vers une exécution d'outils en parallèle.</p>\n<p>Résultat : pour les tâches pouvant s'exécuter en parallèle, un seul cycle requête-réponse est nécessaire, au lieu de plusieurs tours séquentiels.</p>\n<hr />", "id": "c1-29"}, {"level": 3, "title": "Outils pour les données structurées", "children": [], "html": "<p>Outils pour les données structurées = une méthode alternative pour extraire du JSON structuré à partir d'une source de données, en utilisant le système d'outils de Claude plutôt que le préremplissage de message et les séquences d'arrêt.</p>\n<p>Principales différences avec la méthode d'extraction basée sur le prompt :<br />\n- Sortie plus fiable.<br />\n- Configuration plus complexe.<br />\n- Nécessite la spécification d'un schéma JSON.</p>\n<p>Flux principal :<br />\n1. Définir un schéma JSON pour l'outil, où l'entrée = la structure de données souhaitée.<br />\n2. Envoyer le prompt + le schéma à Claude.<br />\n3. Claude appelle l'outil avec des arguments structurés correspondant au schéma.<br />\n4. Extraire le JSON du bloc d'utilisation d'outil (aucun résultat d'outil n'est nécessaire).</p>\n<p>Prérequis clé = utiliser le paramètre <code>tool_choice</code> pour forcer un appel d'outil :<br />\n- <code>tool_choice = {\"type\": \"tool\", \"name\": \"your_tool_name\"}</code><br />\n- Garantit que Claude appelle toujours l'outil spécifié.</p>\n<p>Étapes d'implémentation :<br />\n1. Créer une définition de schéma pour l'outil d'extraction.<br />\n2. Mettre à jour la fonction <code>chat</code> pour accepter un paramètre <code>tool_choice</code>.<br />\n3. Passer <code>tool_choice</code> à <code>client.messages.create()</code>.<br />\n4. Accéder aux données structurées via <code>response.content[0].input</code>.</p>\n<p>Cas d'usage = quand la fiabilité compte plus que la simplicité. La méthode basée sur le prompt est mieux adaptée à une extraction rapide/simple, tandis que les outils sont mieux adaptés à une extraction complexe/fiable.</p>\n<hr />", "id": "c1-30"}, {"level": 3, "title": "Text Editor Tool", "children": [], "html": "<p>Text Editor Tool = un outil intégré de Claude pour les opérations sur les fichiers/le texte (lecture, écriture, création, remplacement, annulation de fichiers/répertoires).</p>\n<p>Principales caractéristiques :<br />\n- Seul le schéma JSON est intégré à Claude ; l'implémentation doit être codée sur mesure.<br />\n- Le stub de schéma envoyé à Claude est automatiquement développé en un schéma complet.<br />\n- La chaîne de type du schéma varie selon la version du modèle Claude (3.5 et 3.7 ont des dates différentes).<br />\n- Permet à Claude d'agir comme un ingénieur logiciel dès le départ.</p>\n<p>Implémentation nécessaire :<br />\n- Une classe/fonction personnalisée pour gérer les demandes d'utilisation d'outil de Claude.<br />\n- Des fonctions pour visualiser des fichiers, remplacer des chaînes, créer des fichiers, etc.<br />\n- Claude ne fournit pas les opérations réelles sur le système de fichiers.</p>\n<p>Flux de travail :<br />\n1. Envoyer à Claude un stub de schéma minimal (nom + un type avec une date spécifique à la version).<br />\n2. Claude le développe en interne en schéma complet.<br />\n3. Claude envoie une demande d'utilisation d'outil.<br />\n4. L'implémentation personnalisée effectue les opérations réelles sur les fichiers.<br />\n5. Les résultats sont renvoyés à Claude.</p>\n<p>Cas d'usage :<br />\n- Reproduire les fonctionnalités d'un éditeur de code IA.<br />\n- Opérations sur le système de fichiers dans des situations où un éditeur natif ne peut pas être utilisé.<br />\n- Génération/refactoring automatisé de code.<br />\n- Opérations sur des projets multi-fichiers.</p>\n<p>Avantage = approche les fonctionnalités d'un éditeur de code avancé via des appels API plutôt que des interactions avec une interface graphique (GUI).</p>\n<hr />", "id": "c1-31"}, {"level": 3, "title": "Web Search Tool", "children": [], "html": "<p>Web Search Tool = un outil intégré de Claude pour rechercher sur le web des informations à jour/spécialisées afin de répondre aux questions de l'utilisateur.</p>\n<p>Implémentation = aucun code personnalisé n'est nécessaire ; Claude gère automatiquement l'exécution de la recherche.</p>\n<p>Exigences de schéma :<br />\n- <code>type</code> : \"web_search_20250305\"<br />\n- <code>name</code> : \"web_search\"<br />\n- <code>max_uses</code> : un nombre (limite le nombre total de recherches, par défaut 5)<br />\n- <code>allowed_domains</code> : une liste optionnelle pour restreindre la recherche à des domaines spécifiques.</p>\n<p>Structure de la réponse :<br />\n- Bloc de texte = le texte explicatif de Claude.<br />\n- Bloc d'utilisation d'outil = la requête de recherche exécutée par Claude.<br />\n- Bloc de résultat de recherche web = les pages trouvées (titre, URL).<br />\n- Bloc <code>Citations</code> = le texte précis étayant les affirmations de Claude.</p>\n<p>Principales caractéristiques :<br />\n- Plusieurs recherches par requête (jusqu'à <code>max_uses</code>).<br />\n- Contrôle qualité via la restriction de domaine.<br />\n- Le système de citation relie les affirmations au matériau source.</p>\n<p>Pattern d'affichage dans l'interface :<br />\n- Afficher les blocs de texte comme du texte normal.<br />\n- Afficher les résultats de recherche comme une liste de références.<br />\n- Mettre en évidence les citations avec l'attribution de la source (domaine, titre, URL, texte cité).</p>\n<p>Exemple de cas d'usage : restreindre la recherche à NIH.gov pour des conseils médicaux/sportifs, afin de garantir que l'information est scientifiquement fondée plutôt qu'issue de contenu web générique.</p>\n<hr />", "id": "c1-32"}, {"level": 3, "title": "Introduction à la génération augmentée par récupération (RAG)", "children": [], "html": "<p>RAG = <code>Retrieval Augmented Generation</code>, une technique pour interroger de grands documents à l'aide d'un modèle de langage.</p>\n<p>Problème : comment utiliser Claude pour extraire une information précise de grands documents (100 à 1000+ pages) sans dépasser la limite de contexte.</p>\n<p>Option 1 (l'approche directe) : placer l'intégralité du texte du document directement dans le prompt.<br />\n- Limites : il existe une limite de tokens stricte, les prompts longs ont de moins bonnes performances, coûtent plus cher et sont traités plus lentement.</p>\n<p>Option 2 (l'approche RAG) : un processus en deux étapes.<br />\n- Étape 1 : découper le document en petits morceaux (chunks).<br />\n- Étape 2 : pour la question de l'utilisateur, trouver les chunks les plus pertinents et n'inclure que ceux-là dans le prompt.</p>\n<p>Avantages du RAG : le modèle se concentre sur le contenu pertinent, il s'adapte à des documents volumineux/multiples, les prompts sont plus petits, les coûts sont réduits et le traitement est plus rapide.</p>\n<p>Inconvénients du RAG : plus complexe, nécessite un prétraitement, requiert un mécanisme de recherche pour trouver les chunks pertinents, ne garantit pas qu'un contexte complet soit inclus dans un chunk, et peut impliquer plusieurs stratégies de découpage (taille égale vs. basé sur les titres).</p>\n<p>Défi clé : définir la pertinence et la stratégie de découpage optimale pour un cas d'usage donné.</p>\n<p>Le RAG échange de la simplicité contre de la scalabilité et de l'efficacité, mais nécessite une implémentation et une évaluation soignées.</p>\n<hr />", "id": "c1-33"}, {"level": 3, "title": "Stratégies de découpage de texte", "children": [], "html": "<p><code>Stratégies de découpage de texte</code> (Text Chunking Strategies) = le processus consistant à découper un document en parties plus petites pour un pipeline RAG.</p>\n<p>Problème central : la qualité du découpage affecte directement la performance du RAG. Un mauvais découpage entraîne la récupération d'un contexte non pertinent (par exemple, récupérer un texte médical sur un « bug » pour une requête portant sur un bug en ingénierie logicielle).</p>\n<p>Trois stratégies principales :</p>\n<ol>\n<li>Découpage basé sur la taille = découper le texte en chaînes de longueur égale.</li>\n<li>Avantages : facile à implémenter, la plus courante en production.</li>\n<li>Inconvénients : peut couper des mots, manque de contexte.</li>\n<li>Solution : une stratégie de chevauchement (overlap) = inclure des caractères des chunks adjacents pour préserver le contexte.</li>\n<li>\n<p>Compromis : produit une duplication de texte, mais améliore le sens des chunks.</p>\n</li>\n<li>\n<p>Découpage basé sur la structure = découper selon la structure du document (titres, paragraphes, sections).</p>\n</li>\n<li>Le mieux adapté aux documents structurés (markdown, HTML).</li>\n<li>Limite : nécessite un formatage garanti du document.</li>\n<li>\n<p>Exemple : découper selon les titres markdown (##) pour créer des chunks basés sur les sections.</p>\n</li>\n<li>\n<p>Découpage sémantique = utiliser le traitement du langage naturel (NLP) pour regrouper les phrases/sections liées entre elles.</p>\n</li>\n<li>La technique la plus avancée.</li>\n<li>Regroupe des phrases consécutives selon leur similarité sémantique.</li>\n<li>Complexe à implémenter.</li>\n</ol>\n<p>Notes d'implémentation clés :<br />\n- Découpage par caractère = le fallback le plus fiable, fonctionne pour tout type de document.<br />\n- Découpage par phrase = un bon compromis si la détection des phrases est fiable.<br />\n- Découpage par section = produit les meilleurs résultats, mais nécessite une entrée structurée.<br />\n- Le choix de la stratégie dépend du fait que le type de document soit garanti ou non, et des besoins du cas d'usage.</p>\n<p>Règle : il n'existe pas de meilleure méthode de découpage universelle - cela dépend des garanties sur la structure du document et du cas d'usage spécifique.</p>\n<hr />", "id": "c1-34"}, {"level": 3, "title": "Embeddings de texte", "children": [], "html": "<p>Embeddings de texte (Text Embeddings) = des représentations numériques du sens d'un texte, générées par un <code>Embedding Model</code>.</p>\n<p>Modèle d'embedding = prend un texte en entrée et produit en sortie une longue chaîne de nombres (compris entre -1 et +1).</p>\n<p>Nombres d'embedding = des scores représentant des qualités/caractéristiques inconnues du texte d'entrée. En théorie, chaque nombre évalue un aspect différent (degré de bonheur, pertinence thématique, etc.), mais l'utilisateur ne sait pas ce qu'ils signifient réellement.</p>\n<p>Recherche sémantique (Semantic Search) = utilise les embeddings de texte pour trouver les chunks de texte pertinents par rapport à la question d'un utilisateur dans un pipeline RAG. Elle résout le problème de recherche consistant à faire correspondre une requête utilisateur à des chunks de document pertinents.</p>\n<p>Processus du pipeline RAG = extraction des chunks de texte → l'utilisateur soumet une requête → utilisation de la recherche sémantique pour trouver les chunks pertinents → ajout des chunks pertinents comme contexte dans le prompt.</p>\n<p>Implémentation = Anthropic recommande d'utiliser Voyage AI pour la génération d'embeddings. Cela nécessite un compte/une clé API distincts. C'est gratuit pour démarrer et facile à intégrer via le SDK.</p>\n<p>Idée centrale = les embeddings permettent une correspondance par similarité sémantique plutôt que par mots-clés, ce qui permet une meilleure compréhension des relations entre les textes pour les tâches de récupération.</p>\n<hr />", "id": "c1-35"}, {"level": 3, "title": "Le flux RAG complet", "children": [], "html": "<p>Flux RAG (RAG Flow) = un processus en 7 étapes qui combine le découpage de texte, l'embedding et la recherche vectorielle pour récupérer un contexte pertinent pour une requête adressée à un LLM.</p>\n<p>Étape 1 : Découpage de texte = découper le document source en fragments de texte distincts.<br />\nÉtape 2 : Génération des embeddings = utiliser un modèle d'embedding pour convertir les chunks de texte en vecteurs numériques.<br />\nÉtape 3 : Normalisation = ramener la magnitude du vecteur à 1,0 (gérée automatiquement par l'API d'embedding).<br />\nÉtape 4 : Stockage en <code>base de données vectorielle</code> (Vector Database) = stocker les embeddings dans une base de données spécifiquement optimisée pour les opérations sur des vecteurs numériques.<br />\nÉtape 5 : Traitement de la requête = utiliser le même modèle pour convertir la question de l'utilisateur en un embedding.<br />\nÉtape 6 : Recherche par similarité = utiliser un calcul de <code>similarité cosinus</code> (Cosine Similarity) pour trouver les embeddings stockés les plus similaires.<br />\nÉtape 7 : Assemblage du prompt = combiner la question de l'utilisateur avec les chunks de texte pertinents récupérés et l'envoyer au LLM.</p>\n<p>Concepts mathématiques clés :<br />\n- Similarité cosinus = le cosinus de l'angle entre deux vecteurs, renvoyant une valeur comprise entre -1 et 1, où plus la valeur est proche de 1, plus les vecteurs sont similaires.<br />\n- <code>Distance cosinus</code> (Cosine Distance) = 1 moins la similarité cosinus, où plus la valeur est proche de 0, plus la similarité est élevée.<br />\n- Base de données vectorielle = effectue les calculs de similarité pour trouver les embeddings les mieux correspondants.</p>\n<p>Flux : prétraitement (étapes 1 à 4) → requête utilisateur → récupération en temps réel (étapes 5 à 7) → réponse du LLM.</p>\n<hr />", "id": "c1-36"}, {"level": 3, "title": "Implémenter le flux RAG", "children": [], "html": "<p>Implémentation du flux RAG = une mise en pratique en 5 étapes du processus de génération augmentée par récupération (Retrieval Augmented Generation).</p>\n<p>Étape 1 : Découpage de texte = utiliser la fonction <code>chunk_by_section</code> pour découper le document par section sur le fichier <code>report.MD</code>.</p>\n<p>Étape 2 : Génération des embeddings = utiliser la fonction <code>generate_embedding</code> pour créer une représentation vectorielle pour chaque chunk (prend en charge une chaîne unique ou une liste de chaînes en entrée).</p>\n<p>Étape 3 : Peupler la vector store = créer une instance d'index vectoriel, itérer sur les paires chunk-embedding avec <code>zip()</code>, et stocker chaque paire avec <code>store.add_vector(embedding, {content: chunk})</code>. Stocker le texte original avec l'embedding afin que la récupération renvoie des résultats exploitables.</p>\n<p>Étape 4 : Traitement de la requête = l'utilisateur demande « Qu'a fait le département d'ingénierie logicielle l'année dernière », et un embedding est généré pour la requête utilisateur.</p>\n<p>Étape 5 : Recherche par similarité = utiliser <code>store.search(user_embedding, 2)</code> pour trouver les 2 chunks les plus pertinents, en renvoyant les résultats avec leurs distances cosinus (0,71 pour la deuxième section, 0,72 pour la section méthodologie).</p>\n<p>Composants clés :<br />\n- Classe d'index vectoriel = une implémentation personnalisée de base de données vectorielle.<br />\n- Distance cosinus = la mesure de similarité entre la requête et les embeddings stockés.<br />\n- Stockage des métadonnées = stocker le contenu textuel original avec les embeddings, permettant une récupération exploitable.</p>\n<p>Le workflow est complet, mais il présente des limites et nécessite des améliorations supplémentaires.</p>\n<hr />", "id": "c1-37"}, {"level": 3, "title": "Recherche lexicale BM25", "children": [], "html": "<p>BM25 = Best Match 25, un algorithme de <code>recherche lexicale</code> (lexical search) couramment utilisé dans les pipelines RAG pour compléter la recherche sémantique.</p>\n<p>Problème de la recherche sémantique seule = elle peut manquer des correspondances exactes de termes et peut renvoyer des résultats non pertinents, même lorsqu'un terme spécifique apparaît fréquemment dans certains documents.</p>\n<p>L'approche de <code>recherche hybride</code> (Hybrid search) = combiner la recherche sémantique (embeddings/base de données vectorielle) avec la recherche lexicale (BM25) en parallèle, puis fusionner les résultats pour un meilleur équilibre.</p>\n<p>Étapes de l'algorithme BM25 :<br />\n1. Tokeniser la requête utilisateur en termes individuels (supprimer la ponctuation, découper selon les espaces).<br />\n2. Compter la fréquence de chaque terme dans tous les chunks de texte/documents.<br />\n3. Attribuer une importance relative aux termes en fonction de leur fréquence d'utilisation (termes rares = importance plus élevée, mots courants comme « un » = importance plus faible).<br />\n4. Classer les chunks de texte selon la fréquence avec laquelle ils contiennent des termes à forte pondération.</p>\n<p>Idée centrale = les termes fréquemment utilisés dans l'ensemble du corpus sont moins importants pour la pertinence de la recherche que les termes rares et spécifiques.</p>\n<p>Avantages de BM25 = meilleur pour trouver des correspondances exactes de termes, privilégie les documents contenant des termes de recherche rares/spécifiques, ce qui complète les faiblesses de la recherche sémantique.</p>\n<p>Implémentation = les systèmes de recherche sémantique et de recherche lexicale utilisent une API similaire (fonctions <code>add_document</code>, <code>search</code>), ce qui facilite leur combinaison.</p>\n<p>Prochaine étape = fusionner les résultats des deux systèmes de recherche pour bénéficier à la fois de la compréhension sémantique et de la correspondance exacte de termes.</p>\n<hr />", "id": "c1-38"}, {"level": 3, "title": "Pipeline RAG multi-index", "children": [], "html": "<p><code>Pipeline RAG multi-index</code> (Multi-Index RAG Pipeline) = un système qui combine la recherche sémantique (index vectoriel) et la recherche lexicale (index BM25) pour améliorer la précision de la récupération.</p>\n<p>Composants clés :<br />\n- Index vectoriel = utilise les embeddings pour la recherche par similarité sémantique.<br />\n- Index BM25 = recherche lexicale/basée sur des mots-clés.<br />\n- Classe Retriever = un wrapper qui transmet les requêtes aux deux index et fusionne les résultats.</p>\n<p><code>Reciprocal Rank Fusion</code> = une technique pour fusionner les résultats de recherche provenant de différents index. Formule : RRF_score = pour chaque document, la somme sur toutes les méthodes de recherche de (1/(rang + 1)). Les documents sont classés selon le score combiné le plus élevé.</p>\n<p>Exemple : la recherche vectorielle renvoie [doc2, doc7, doc6], BM25 renvoie [doc6, doc2, doc7]. Après le calcul RRF, le classement final devient [doc2, doc6, doc7], car doc2 est bien classé dans les deux méthodes.</p>\n<p>Avantages :<br />\n- Améliore la précision de la recherche en combinant différents paradigmes de recherche.<br />\n- Utilise une conception modulaire et une API standardisée (méthodes <code>search()</code> et <code>add_document()</code>).<br />\n- Facile à étendre avec des index de recherche supplémentaires.<br />\n- Gère mieux les cas limites où une seule méthode échoue.</p>\n<p>Le pattern d'implémentation permet à plusieurs méthodes de recherche de fonctionner ensemble tout en gardant les classes d'index indépendantes et isolées.</p>\n<hr />", "id": "c1-39"}, {"level": 3, "title": "Reclassement des résultats (Reranking)", "children": [], "html": "<p>Reranking = une étape de post-traitement qui utilise un LLM après la récupération initiale pour réordonner les résultats de recherche selon leur pertinence.</p>\n<p>Processus : exécuter la recherche vectorielle + BM25 → fusionner les résultats → transmettre les résultats au LLM avec un prompt lui demandant de classer les documents par pertinence → obtenir les résultats reclassés.</p>\n<p>Détails d'implémentation : pour des raisons d'efficacité, utiliser les identifiants de document plutôt que le texte complet. Le LLM reçoit la requête utilisateur + les documents candidats + des instructions pour lister les documents les plus pertinents par ordre décroissant. Utiliser le préremplissage du message assistant + une séquence d'arrêt pour garantir une sortie JSON structurée.</p>\n<p>Compromis : améliore la précision de la recherche en tirant parti de la compréhension de la pertinence sémantique par le LLM. Cependant, cela ajoute de la latence en raison de l'appel supplémentaire au LLM. Cette méthode est particulièrement efficace lorsque la méthode de récupération initiale ne parvient pas à capturer une intention subtile de la requête (par exemple, « équipe ENG » vs. « équipe d'ingénierie »).</p>\n<p>Exemple d'amélioration : pour la requête « Qu'a fait l'équipe d'ingénierie pendant l'incident de 2023 ? », après le reranking, la section ingénierie logicielle est correctement placée au-dessus de la section cybersécurité, alors que la recherche hybride l'avait initialement classée plus bas.</p>\n<hr />", "id": "c1-40"}, {"level": 3, "title": "Récupération contextuelle (Contextual Retrieval)", "children": [], "html": "<p>Contextual Retrieval = une technique qui ajoute du contexte aux chunks de document avant de les transformer en embeddings, afin d'améliorer la précision d'un pipeline RAG.</p>\n<p>Problème : lorsqu'un document est découpé en chunks, un chunk individuel perd le contexte du document d'origine, ce qui
